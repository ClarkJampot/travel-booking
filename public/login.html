<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="card-title text-center mb-4">Login</h2>
            
            <div id="alertContainer"></div>
            
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
              </div>
              
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
              </div>
              
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Login</button>
              </div>
              
              <div class="text-center">
                <p class="mb-0">Don't have an account? <a href="register.html">Register here</a></p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/urlHelpers.js"></script>
  <script src="js/utils/componentLoader.js"></script>
  <script src="js/utils/uiHelpers.js"></script>
  <script src="js/utils/renderers.js"></script>
  <script src="js/utils/authHelpers.js"></script>
  <script src="js/utils/locationHelpers.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Check if already logged in
    document.addEventListener('DOMContentLoaded', async function() {
      await loadComponent('header', 'components/header.html', 'includes/header.html');
      await loadComponent('footer', 'components/footer.html', 'includes/footer.html');
      updateNavigation();
      
      const token = localStorage.getItem('token');
      if (token) {
        // Already logged in, redirect to home
        window.location.href = 'index.html';
        return;
      }
      
      // Initialize form
      const loginForm = document.getElementById('loginForm');
      const alertContainer = document.getElementById('alertContainer');
      const submitBtn = document.getElementById('submitBtn');
      
      function showAlert(message, type = 'danger') {
        alertContainer.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
      }
      
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
          showAlert('Please fill in all fields');
          return;
        }
        
        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';
        
        try {
          const data = await login(email, password);
          
          // Success - redirect to home
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } catch (error) {
          // Show error
          const errorMessage = error.message || 'Login failed. Please check your credentials.';
          showAlert(errorMessage);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      });
    });
  </script>
</body>
</html>
