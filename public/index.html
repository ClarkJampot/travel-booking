<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <div id="header"></div>

  <!-- Main Content -->
  <div class="container mt-4">
    <div class="hero">
      <h1>Discover Amazing Destinations</h1>
      <p>Explore the beautiful Philippines with our curated travel experiences</p>
      <a href="destinations.html" class="btn btn-light btn-lg">Explore Destinations</a>
    </div>

    <!-- Featured Destinations -->
    <section class="mb-5">
      <h2 class="mb-4">Featured Destinations</h2>
      <div id="featuredDestinations" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Hotels -->
    <section class="mb-5">
      <h2 class="mb-4">Top Hotels</h2>
      <div id="topHotels" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Flights -->
    <section class="mb-5">
      <h2 class="mb-4">Popular Flights</h2>
      <div id="topFlights" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Activities -->
    <section class="mb-5">
      <h2 class="mb-4">Popular Activities</h2>
      <div id="topActivities" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>
  </div>
  <!-- End Main Content -->

  <!-- Footer -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Load header and footer
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());

    // Load featured destinations
    async function loadFeaturedDestinations() {
      try {
        const data = await apiCall('/destinations?featured=1&limit=4');
        const container = document.getElementById('featuredDestinations');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No featured destinations available.</p>';
          return;
        }
        
        container.innerHTML = data.results.map(dest => `
          <div class="col-md-3">
            <div class="card h-100">
              <img src="${dest.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${dest.name}">
              <div class="card-body">
                <h5 class="card-title">${dest.name}</h5>
                <p class="card-text text-muted">${dest.country}</p>
                <a href="destination-details.html?id=${dest.id}" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading destinations:', error);
      }
    }

    // Load top hotels
    async function loadTopHotels() {
      try {
        const data = await apiCall('/top/hotels?limit=4');
        const container = document.getElementById('topHotels');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No hotels available.</p>';
          return;
        }
        
        container.innerHTML = data.results.map(hotel => `
          <div class="col-md-3">
            <div class="card h-100">
              <img src="${hotel.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${hotel.name}">
              <div class="card-body">
                <h5 class="card-title">${hotel.name}</h5>
                <p class="card-text text-muted">${hotel.city}, ${hotel.country}</p>
                <p class="price">${formatPrice(hotel.price_per_night)}<span class="price-small">/night</span></p>
                <p class="rating">★ ${hotel.rating || 0}</p>
                <a href="hotel-details.html?id=${hotel.id}" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading hotels:', error);
      }
    }

    // Load top flights
    async function loadTopFlights() {
      try {
        const data = await apiCall('/top/flights?limit=4');
        const container = document.getElementById('topFlights');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No flights available.</p>';
          return;
        }
        
        container.innerHTML = data.results.map(flight => `
          <div class="col-md-3">
            <div class="card h-100">
              <img src="${flight.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${flight.airline}">
              <div class="card-body">
                <h5 class="card-title">${flight.airline}</h5>
                <p class="card-text">${flight.origin} → ${flight.destination}</p>
                <p class="text-muted">${formatDate(flight.depart_date)}</p>
                <p class="price">${formatPrice(flight.price)}</p>
                <a href="flight-details.html?id=${flight.id}" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading flights:', error);
      }
    }

    // Load top activities
    async function loadTopActivities() {
      try {
        const data = await apiCall('/top/activities?limit=4');
        const container = document.getElementById('topActivities');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No activities available.</p>';
          return;
        }
        
        container.innerHTML = data.results.map(activity => `
          <div class="col-md-3">
            <div class="card h-100">
              <img src="${activity.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${activity.title}">
              <div class="card-body">
                <h5 class="card-title">${activity.title}</h5>
                <p class="card-text text-muted">${activity.city}</p>
                <p class="text-muted">${formatDate(activity.date)}</p>
                <p class="price">${formatPrice(activity.price)}</p>
                <a href="activity-details.html?id=${activity.id}" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading activities:', error);
      }
    }

    // Load all content
    document.addEventListener('DOMContentLoaded', function() {
      loadFeaturedDestinations();
      loadTopHotels();
      loadTopFlights();
      loadTopActivities();
    });
  </script>
</body>
</html>
