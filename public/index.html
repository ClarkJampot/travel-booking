<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <strong>Travel Booking</strong>
    <nav>
      <a href="/hotels.html">Hotels</a>
      <a href="/flights.html">Flights</a>
      <a href="/activities.html">Activities</a>
      <a href="/transfers.html">Transfers</a>
      <a href="/bookings.html">Bookings</a>
      <a href="/auth.html">Auth</a>
    </nav>
  </header>
  <main>
    <h1>Welcome</h1>
    <p class="muted">Browse and book hotels, flights, activities, and transfers.</p>

    <h2>Featured Ads</h2>
    <div id="ads" class="grid"></div>
  </main>

  <script src="js/main.js"></script>
  <script>
    async function loadAds() {
      try {
        const r = await fetch('/api/ads?placement=home');
        const ads = await r.json();
        const container = document.getElementById('ads');
        ads.forEach(a => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<strong>${a.title}</strong><div class="muted">${a.placement}</div>`;
          container.appendChild(card);
        });
      } catch (e) { console.error(e); }
    }
    loadAds();
  </script>
</body>
</html>
