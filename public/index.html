<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <div id="header"></div>

  <!-- Hero Banner -->
  <section class="hero-banner">
    <img src="uploads/hero-banner.jpg" alt="Hero Banner" class="hero-banner-image" onerror="this.src='uploads/placeholder.svg'">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Discover Amazing Destinations</h1>
      <p>Explore the beautiful Philippines with our curated travel experiences</p>
      <!-- Search form inside hero -->
      <div class="hero-search-form">
        <div class="search-form-wrapper">
          <select class="content-type-select" id="heroContentTypeSelect">
            <option value="hotels">Hotels</option>
            <option value="flights">Flights</option>
            <option value="activities">Activities</option>
            <option value="transfers">Transfers</option>
            <option value="destinations">Destinations</option>
          </select>
          <div class="search-input-wrapper">
            <input type="text" class="search-input" id="heroSearchInput" placeholder="Search for hotels, flights, activities, transfers, or destinations...">
            <div class="search-dropdown" id="heroSearchDropdown"></div>
          </div>
          <button type="button" class="search-btn" id="heroSearchBtn">Search</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Sticky search bar (initially hidden) -->
  <div class="sticky-search-bar-replacement" id="stickySearchBar">
    <div class="container">
      <div class="search-form">
        <div class="search-form-wrapper">
          <select class="content-type-select" id="stickyContentTypeSelect">
            <option value="hotels">Hotels</option>
            <option value="flights">Flights</option>
            <option value="activities">Activities</option>
            <option value="transfers">Transfers</option>
            <option value="destinations">Destinations</option>
          </select>
          <div class="search-input-wrapper">
            <input type="text" class="search-input" id="stickySearchInput" placeholder="Search for hotels, flights, activities, transfers, or destinations...">
            <div class="search-dropdown" id="stickySearchDropdown"></div>
          </div>
          <button type="button" class="search-btn" id="stickySearchBtn">Search</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Results Container -->
  <div class="container mt-4">
    <div id="searchResults"></div>
  </div>

  <!-- Promotions Carousel -->
  <section class="promotions-section mb-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Special Promotions</h2>
        <a href="hotels.html?promoted=1" class="text-primary text-decoration-none fw-semibold">View all <i class="bi bi-chevron-right"></i></a>
      </div>
      <div class="promotions-carousel" id="promotionsCarousel">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <div class="container mt-4">

    <!-- Featured Destinations -->
    <section class="mb-5 reveal">
      <h2 class="mb-4">Featured Destinations</h2>
      <div id="featuredDestinations" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Hotels -->
    <section class="mb-5 reveal">
      <h2 class="mb-4">Top Hotels</h2>
      <div id="topHotels" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Flights -->
    <section class="mb-5 reveal">
      <h2 class="mb-4">Popular Flights</h2>
      <div id="topFlights" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>

    <!-- Top Activities -->
    <section class="mb-5 reveal">
      <h2 class="mb-4">Popular Activities</h2>
      <div id="topActivities" class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </section>
  </div>
  <!-- End Main Content -->

  <!-- Footer -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search-bar.js"></script>
  <script src="js/promotions.js"></script>
  <script>
    // Load header and footer
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());
    
    // Initialize search bar after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initSearchBar === 'function') {
        initSearchBar();
      }
    });

    // Load featured destinations
    async function loadFeaturedDestinations() {
      try {
        const data = await apiCall('/destinations?featured=1&limit=4');
        const container = document.getElementById('featuredDestinations');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No featured destinations available.</p>';
          return;
        }
        
        // Make cards visible immediately, then animate
        container.querySelectorAll('.reveal').forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        });
        
        container.innerHTML = data.results.map((dest, index) => `
          <div class="col-md-3 reveal stagger-${index + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${normalizeImageUrl(dest.image_url)}" class="card-img-top" alt="${dest.name}" loading="lazy">
                <div class="card-overlay">
                  <a href="destination-details.html?id=${dest.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${dest.name}</h5>
                <p class="card-text text-muted">Philippines</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading destinations:', error);
      }
    }

    // Load top hotels
    async function loadTopHotels() {
      try {
        const data = await apiCall('/top/hotels?limit=4');
        const container = document.getElementById('topHotels');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No hotels available.</p>';
          return;
        }
        
        // Make cards visible immediately
        container.querySelectorAll('.reveal').forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        });
        
        container.innerHTML = data.results.map((hotel, index) => `
          <div class="col-md-3 reveal stagger-${index + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${normalizeImageUrl(hotel.image_url)}" class="card-img-top" alt="${hotel.name}" loading="lazy">
                <div class="card-overlay">
                  <a href="hotel-details.html?id=${hotel.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${hotel.name}</h5>
                <p class="card-text text-muted">${hotel.city_name || hotel.city || ''}${hotel.province_name ? ', ' + hotel.province_name : ''}</p>
                <p class="price">${formatPrice(hotel.price_per_night)}<span class="price-small">/night</span></p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading hotels:', error);
      }
    }

    // Load top flights
    async function loadTopFlights() {
      try {
        const data = await apiCall('/top/flights?limit=4');
        const container = document.getElementById('topFlights');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No flights available.</p>';
          return;
        }
        
        // Make cards visible immediately
        container.querySelectorAll('.reveal').forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        });
        
        container.innerHTML = data.results.map((flight, index) => `
          <div class="col-md-3 reveal stagger-${index + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${normalizeImageUrl(flight.image_url)}" class="card-img-top" alt="${flight.airline}" loading="lazy">
                <div class="card-overlay">
                  <a href="flight-details.html?id=${flight.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${flight.airline}</h5>
                <p class="card-text">${flight.origin} → ${flight.destination}</p>
                <p class="text-muted">${formatDate(flight.depart_date)}</p>
                <p class="price">${formatPrice(flight.price)}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading flights:', error);
      }
    }

    // Load top activities
    async function loadTopActivities() {
      try {
        const data = await apiCall('/top/activities?limit=4');
        const container = document.getElementById('topActivities');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No activities available.</p>';
          return;
        }
        
        // Make cards visible immediately
        container.querySelectorAll('.reveal').forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        });
        
        container.innerHTML = data.results.map((activity, index) => `
          <div class="col-md-3 reveal stagger-${index + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${normalizeImageUrl(activity.image_url)}" class="card-img-top" alt="${activity.title}" loading="lazy">
                <div class="card-overlay">
                  <a href="activity-details.html?id=${activity.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${activity.title}</h5>
                <p class="card-text text-muted">${activity.city}</p>
                <p class="text-muted">${formatDate(activity.date)}</p>
                <p class="price">${formatPrice(activity.price)}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading activities:', error);
      }
    }

    // Load all content
    document.addEventListener('DOMContentLoaded', function() {
      loadPromotionsCarousel();
      loadFeaturedDestinations().then(() => observeRevealElements());
      loadTopHotels().then(() => observeRevealElements());
      loadTopFlights().then(() => observeRevealElements());
      loadTopActivities().then(() => observeRevealElements());
    });
  </script>
</body>
</html>
