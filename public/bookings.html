<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <h1 class="mb-4">My Bookings</h1>
    
    <div id="status"></div>
    <div id="bookings">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());

    // Check authentication
    if (!isAuthenticated()) {
      window.location.href = 'login.html';
    }

    async function loadBookings() {
      showLoading('bookings');
      clearStatus('status');
      
      try {
        const data = await apiCall('/bookings?limit=50');
        const container = document.getElementById('bookings');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">You have no bookings yet.</p>';
          return;
        }
        
        container.innerHTML = data.results.map(booking => `
          <div class="card mb-3">
            <div class="card-body">
              <div class="row">
                <div class="col-md-8">
                  <h5 class="card-title">${booking.item_type.charAt(0).toUpperCase() + booking.item_type.slice(1)} Booking</h5>
                  <p class="card-text"><strong>Booking ID:</strong> ${booking.id}</p>
                  <p class="card-text"><strong>Status:</strong> <span class="badge bg-${booking.status === 'confirmed' ? 'success' : booking.status === 'cancelled' ? 'danger' : 'secondary'}">${booking.status}</span></p>
                  <p class="card-text"><strong>Booked on:</strong> ${formatDate(booking.booked_at)}</p>
                  <p class="price">Total: ${formatPrice(booking.total_price)}</p>
                </div>
                <div class="col-md-4 text-end">
                  ${booking.status === 'confirmed' ? `<button class="btn btn-danger" onclick="cancelBooking(${booking.id})">Cancel Booking</button>` : ''}
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        showError('status', error.message || 'Failed to load bookings');
        document.getElementById('bookings').innerHTML = '';
      }
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this booking?')) {
        return;
      }
      
      try {
        await apiCall(`/bookings/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'cancelled' })
        });
        showSuccess('status', 'Booking cancelled successfully');
        loadBookings();
      } catch (error) {
        showError('status', error.message || 'Failed to cancel booking');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadBookings();
    });
  </script>
</body>
</html>
