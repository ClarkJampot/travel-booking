<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4 reveal">My Bookings</h1>
    
    <!-- Filters -->
    <div class="filter-section mb-4">
      <div class="row">
        <div class="col-md-3">
          <label for="typeFilter" class="form-label">Type</label>
          <select class="form-control" id="typeFilter">
            <option value="">All Types</option>
            <option value="hotel">Hotels</option>
            <option value="flight">Flights</option>
            <option value="activity">Activities</option>
            <option value="transfer">Transfers</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="statusFilter" class="form-label">Status</label>
          <select class="form-control" id="statusFilter">
            <option value="">All Statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="applyFilters()">Apply Filters</button>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>
    
    <div id="status"></div>
    <div id="bookings" class="reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/utils/urlHelpers.js"></script>
  <script src="js/utils/componentLoader.js"></script>
  <script src="js/utils/uiHelpers.js"></script>
  <script src="js/utils/renderers.js"></script>
  <script src="js/utils/authHelpers.js"></script>
  <script src="js/utils/locationHelpers.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication and role
    if (!isAuthenticated()) {
      alert('Please log in to view your bookings.');
      window.location.href = 'index.html';
    }
    
    const user = getCurrentUser();
    if (user && (user.role === 'owner' || user.role === 'agency')) {
      alert('Bookings are only available for customers.');
      window.location.href = 'profile.html';
    }

    function getUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        item_type: urlParams.get('item_type') || document.getElementById('typeFilter')?.value || '',
        status: urlParams.get('status') || document.getElementById('statusFilter')?.value || ''
      };
    }
    
    function getFormParams() {
      return {
        item_type: document.getElementById('typeFilter')?.value || '',
        status: document.getElementById('statusFilter')?.value || ''
      };
    }
    
    function updateURLWithFilters() {
      // When applying filters, use form values (not URL params) to get current selections
      const params = getFormParams();
      const url = new URL(window.location);
      if (params.item_type) url.searchParams.set('item_type', params.item_type);
      else url.searchParams.delete('item_type');
      if (params.status) url.searchParams.set('status', params.status);
      else url.searchParams.delete('status');
      window.history.pushState({}, '', url);
    }
    
    function applyFilters() {
      updateURLWithFilters();
      loadBookings();
    }
    
    function clearFilters() {
      document.getElementById('typeFilter').value = '';
      document.getElementById('statusFilter').value = '';
      window.history.pushState({}, '', window.location.pathname);
      loadBookings();
    }
    
    async function loadBookings() {
      showLoading('bookings');
      clearStatus('status');
      
      try {
        const params = getUrlParams();
        let url = '/bookings?limit=50';
        if (params.item_type) url += `&item_type=${encodeURIComponent(params.item_type)}`;
        if (params.status) url += `&status=${encodeURIComponent(params.status)}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('bookings');
        
        // Update filter values from URL
        if (params.item_type) document.getElementById('typeFilter').value = params.item_type;
        if (params.status) document.getElementById('statusFilter').value = params.status;
        
        if (data.results.length === 0) {
          container.innerHTML = renderEmptyState({ message: 'You have no bookings yet.' });
          return;
        }
        
        container.innerHTML = data.results.map((booking, index) => renderBookingCard(booking, index)).join('');
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load bookings');
        document.getElementById('bookings').innerHTML = '';
      }
    }

    async function cancelBooking(id) {
      Modal.confirm({
        title: 'Cancel Booking',
        message: 'Are you sure you want to cancel this booking? This action cannot be undone.',
        confirmText: 'Cancel Booking',
        cancelText: 'Keep Booking',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
          try {
            await apiCall(`/bookings/${id}`, {
              method: 'PUT',
              body: JSON.stringify({ status: 'cancelled' })
            });
            showSuccessToast('Booking cancelled successfully');
            loadBookings();
          } catch (error) {
            setStatus('status', 'error', error.message || 'Failed to cancel booking');
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Load filter values from URL on page load
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('item_type')) document.getElementById('typeFilter').value = urlParams.get('item_type');
      if (urlParams.get('status')) document.getElementById('statusFilter').value = urlParams.get('status');
      
      loadBookings();
    });
  </script>
</body>
</html>
