<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bookings - Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">My Bookings</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="dashboard.html" id="dashboardLink" style="display:none;">Dashboard</a>
      <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="#" onclick="logout()" id="logoutLink" style="display:none;">Logout</a>
    </nav>
  </header>
  <main>
    <h1>My Bookings</h1>
    <div id="authStatus" class="muted"></div>
    <div id="status" class="muted"></div>
    <div id="list" class="grid"></div>
  </main>
  <script>
    let currentUser = null;

    async function checkAuth() {
      try {
        const res = await fetch('api/auth/me');
        const data = await res.json();
        if (data.user) {
          currentUser = data.user;
          updateNavigation();
          loadBookings();
        } else {
          redirectToLogin();
        }
      } catch (e) {
        redirectToLogin();
      }
    }

    function updateNavigation() {
      const loginLink = document.getElementById('loginLink');
      const dashboardLink = document.getElementById('dashboardLink');
      const profileLink = document.getElementById('profileLink');
      const logoutLink = document.getElementById('logoutLink');
      
      if (currentUser) {
        loginLink.style.display = 'none';
        dashboardLink.style.display = 'inline';
        profileLink.style.display = 'inline';
        logoutLink.style.display = 'inline';
      } else {
        loginLink.style.display = 'inline';
        dashboardLink.style.display = 'none';
        profileLink.style.display = 'none';
        logoutLink.style.display = 'none';
      }
    }

    function redirectToLogin() {
      window.location.href = 'login.html';
    }

    async function logout() {
      try {
        await fetch('api/auth/logout', { method: 'POST' });
        window.location.href = 'login.html';
      } catch (e) {
        console.error('Logout failed:', e);
      }
    }

    async function loadBookings() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      const authStatus = document.getElementById('authStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading...';
      
      try {
        const res = await fetch('api/bookings');
        const data = await res.json();
        
        if (res.status === 403 && data.redirect) {
          // Onboarding required
          authStatus.textContent = 'Please complete your profile first.';
          setTimeout(() => window.location.href = data.redirect, 2000);
          return;
        }
        
        if (!res.ok) throw new Error(data.error || 'Failed to load bookings');
        
        status.textContent = '';
        authStatus.textContent = `Welcome, ${currentUser.name}!`;
        
        (data.results || []).forEach(b => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
            <div class="row" style="justify-content:space-between">
              <strong>Booking #${b.id}</strong>
              <span class="badge">${b.item_type}</span>
            </div>
            <div><strong>${b.item_name || 'Unknown Item'}</strong></div>
            <div class="muted">${b.item_description || ''}</div>
            <div style="margin-top:8px;">
              <div>₱${Number(b.total_price).toFixed(2)}</div>
              <div class="muted">Booked: ${new Date(b.booked_at).toLocaleDateString()}</div>
            </div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No bookings yet. Start exploring our hotels, flights, and activities!';
        }
      } catch (e) {
        status.textContent = 'Failed to load bookings: ' + e.message;
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
