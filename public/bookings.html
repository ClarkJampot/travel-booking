<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <h1 class="mb-4 reveal">My Bookings</h1>
    
    <div id="status"></div>
    <div id="bookings" class="reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication
    if (!isAuthenticated()) {
      alert('Please log in to view your bookings.');
      window.location.href = 'index.html';
    }

    async function loadBookings() {
      showLoading('bookings');
      clearStatus('status');
      
      try {
        const data = await apiCall('/bookings?limit=50');
        const container = document.getElementById('bookings');
        
        if (data.results.length === 0) {
          container.innerHTML = renderEmptyState({ message: 'You have no bookings yet.' });
          return;
        }
        
        container.innerHTML = data.results.map((booking, index) => renderBookingCard(booking, index)).join('');
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load bookings');
        document.getElementById('bookings').innerHTML = '';
      }
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this booking?')) {
        return;
      }
      
      try {
        await apiCall(`/bookings/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'cancelled' })
        });
        showSuccessToast('Booking cancelled successfully');
        loadBookings();
      } catch (error) {
        showError('status', error.message || 'Failed to cancel booking');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadBookings();
    });
  </script>
</body>
</html>
