<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <h1 class="mb-4">Activities</h1>
    <div class="filter-section">
      <div class="row">
        <div class="col-md-4"><label class="form-label">City</label><input type="text" class="form-control" id="cityFilter"></div>
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" id="dateFilter"></div>
        <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary w-100" onclick="loadActivities()">Filter</button></div>
      </div>
    </div>
    <div id="status"></div>
    <div id="activities" class="row g-4 reveal"></div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    async function loadActivities() {
      showLoading('activities');
      try {
        let url = '/activities?limit=20';
        if (document.getElementById('cityFilter').value) url += `&city=${encodeURIComponent(document.getElementById('cityFilter').value)}`;
        if (document.getElementById('dateFilter').value) url += `&date=${document.getElementById('dateFilter').value}`;
        const data = await apiCall(url);
        document.getElementById('activities').innerHTML = data.results.length === 0 ? '<p class="text-muted">No activities found.</p>' : data.results.map((a, index) => `
          <div class="col-md-4 reveal stagger-${(index % 5) + 1}">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${a.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${a.title}" loading="lazy">
                <div class="card-overlay">
                  <a href="activity-details.html?id=${a.id}" class="btn btn-light btn-sm">Quick View</a>
                  <a href="activity-details.html?id=${a.id}" class="btn btn-primary btn-sm">Book Now</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${a.title}</h5>
                <p class="text-muted">${a.city}</p>
                <p class="text-muted">${formatDate(a.date)}</p>
                <p class="price">${formatPrice(a.price)}</p>
                <a href="activity-details.html?id=${a.id}" class="btn btn-primary w-100">View Details</a>
              </div>
            </div>
          </div>`).join('');
      } catch (error) {
        showError('status', error.message || 'Failed to load activities');
        document.getElementById('activities').innerHTML = '';
      }
    }
    document.addEventListener('DOMContentLoaded', loadActivities);
  </script>
</body>
</html>
