<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activities - Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">Bookings</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main>
    <h1>Activities</h1>
    <div class="row">
      <label>City <input id="city" placeholder="Cebu"></label>
      <label>Date <input id="date" type="date"></label>
      <button onclick="loadActivities()">Search</button>
    </div>
    <div id="status" class="muted"></div>
    <div id="list" class="grid"></div>
  </main>
  <script>
    async function loadActivities() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      list.innerHTML = '';
      status.textContent = 'Loading...';
      const q = new URLSearchParams();
      const city = document.getElementById('city').value.trim();
      const date = document.getElementById('date').value;
      if (city) q.set('city', city);
      if (date) q.set('date', date);
      try {
        const res = await fetch('api/activities?' + q.toString());
        const data = await res.json();
        status.textContent = '';
        (data.results || []).forEach(a => {
          const div = document.createElement('div');
          div.className = 'card';
          div.onclick = () => window.location.href = `activity-details.html?id=${a.id}`;
          const imgSrc = a.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI0Y1RjVGMEYiLz4KICA8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOEIwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj4KICAgIE5vIEltYWdlIEF2YWlsYWJsZQogIDwvdGV4dD4KPC9zdmc+';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${a.title}" class="card-image">
            <strong>${a.title}</strong>
            <div class="muted">${a.city}</div>
            <div>${a.date} · ₱${Number(a.price).toFixed(2)}</div>
          `;
          list.appendChild(div);
        });
        if (!list.children.length) status.textContent = 'No activities found.';
      } catch (e) {
        status.textContent = 'Failed to load activities.';
        console.error(e);
      }
    }
    window.addEventListener('DOMContentLoaded', loadActivities);
  </script>
</body>
</html>
