<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Activities</h1>
    
    <!-- Filters -->
    <div id="activitiesFilter"></div>

    <!-- Results -->
    <div id="status"></div>
    
    <!-- Promoted Activities Section -->
    <div id="promotedActivities" class="promoted-section mb-4">
      <div id="promotedActivitiesHeader"></div>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Activities -->
    <div id="activities" class="row g-4 reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5 loading-more-container"></div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
    <script src="js/utils/formatters.js"></script>
    <script src="js/utils/api.js"></script>
    <script src="js/utils/urlHelpers.js"></script>
    <script src="js/utils/componentLoader.js"></script>
    <script src="js/utils/uiHelpers.js"></script>
    <script src="js/utils/renderers.js"></script>
    <script src="js/utils/authHelpers.js"></script>
    <script src="js/utils/locationHelpers.js"></script>
    <script src="js/utils/animations.js"></script>
    <script src="js/components/Image.js"></script>
    <script src="js/components/Price.js"></script>
    <script src="js/components/Badge.js"></script>
    <script src="js/components/EmptyState.js"></script>
    <script src="js/components/Card.js"></script>
    <script src="js/components/Filter.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');

    // Infinite scroll variables
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;

    // Initialize Filter component
    const filter = new Filter('activitiesFilter', {
      keywordPlaceholder: 'Search activities...',
      onFilter: () => {
        updateURLWithFilters();
        loadActivities(true);
      },
      onClear: () => {
        updateURLWithFilters();
        loadActivities(true);
      }
    });

    // Read URL search parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        province_id: params.get('province_id') || '',
        city_id: params.get('city_id') || '',
        minPrice: params.get('minPrice') || '',
        maxPrice: params.get('maxPrice') || '',
        date: params.get('date') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    // Update URL with current filter values
    function updateURLWithFilters() {
      const values = filter.getValues();
      const params = new URLSearchParams();
      if (values.province_id) params.set('province_id', values.province_id);
      if (values.city_id) params.set('city_id', values.city_id);
      if (values.q) params.set('q', values.q);
      if (values.minPrice) params.set('minPrice', values.minPrice);
      if (values.maxPrice) params.set('maxPrice', values.maxPrice);
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }

    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }

    async function loadActivities(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('activities');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-md-4', true, 3);
        const promotedContainer = document.getElementById('promotedActivities');
        const promotedRow = promotedContainer.querySelector('.row');
        if (promotedRow) promotedRow.innerHTML = '';
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'none';
      }
      
      try {
        const urlParams = getUrlParams();
        const filterValues = filter.getValues();
        let url = `/activities?limit=${limit}&page=${currentPage}`;
        if (filterValues.province_id) url += `&province_id=${filterValues.province_id}`;
        if (filterValues.city_id) url += `&city_id=${filterValues.city_id}`;
        if (filterValues.minPrice) url += `&minPrice=${filterValues.minPrice}`;
        if (filterValues.maxPrice) url += `&maxPrice=${filterValues.maxPrice}`;
        if (urlParams.date) url += `&date=${urlParams.date}`;
        if (filterValues.q) url += `&q=${encodeURIComponent(filterValues.q)}`;
        
        const data = await apiCall(url);
        const promotedContainer = document.getElementById('promotedActivities');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted activities (only on first page/reset)
        if (reset || currentPage === 1) {
          container.innerHTML = '';
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const header = document.getElementById('promotedActivitiesHeader');
            header.innerHTML = renderSectionHeader({ title: 'Promoted Activities' });
            promotedRow.innerHTML = data.promoted.slice(0, 2).map((activity, index) => {
              const card = renderCard({ type: 'activity', data: activity, columnsClass: 'col-md-6' });
              // Add promoted styling hook
              return card.replace('card h-100', 'card h-100 promoted-item');
            }).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular activities
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            if (!data.promoted || data.promoted.length === 0) {
              container.innerHTML = renderEmptyState({ message: 'Currently no activities available.' });
            } else {
              container.innerHTML = '';
            }
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items
        hasMore = data.results.length >= limit;
        
        // Append activities to container
        const activitiesHtml = data.results.map((activity, index) => {
          return renderCard({ type: 'activity', data: activity, columnsClass: 'col-md-4' });
        }).join('');
        
        container.insertAdjacentHTML('beforeend', activitiesHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load activities');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadActivities();
          }
        }, 100);
      });
    }


    window.addEventListener('popstate', function() {
      loadActivities(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      filter.render();
      
      // Enforce integer input on price fields
      enforceIntegerInput('activitiesFilter-minPrice');
      enforceIntegerInput('activitiesFilter-maxPrice');
      
      // Restore filter values from URL parameters
      const urlParams = getUrlParams();
      if (urlParams.city_id && !urlParams.province_id) {
        // If city_id is provided without province_id, fetch province from city
        try {
          const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
          if (cityData.city && cityData.city.province_id) {
            urlParams.province_id = cityData.city.province_id;
          }
        } catch (e) {
          console.error('Error loading city:', e);
        }
      }
      
      // Use setValues for consistent restoration
      if (urlParams.province_id || urlParams.city_id || urlParams.q || urlParams.minPrice || urlParams.maxPrice) {
        filter.setValues({
          province_id: urlParams.province_id,
          city_id: urlParams.city_id,
          q: urlParams.q,
          minPrice: urlParams.minPrice,
          maxPrice: urlParams.maxPrice
        });
      }
      
      setupInfiniteScroll();
      loadActivities(true);
    });
  </script>
</body>
</html>
