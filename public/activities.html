<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <h1 class="mb-4">Activities</h1>
    <div class="filter-section">
      <div class="row">
        <div class="col-md-2">
          <label class="form-label">Province</label>
          <select class="form-control" id="provinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">City</label>
          <select class="form-control" id="cityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Keyword Search</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search activities...">
        </div>
        <div class="col-md-2">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Filter</button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <!-- Promoted Activities Section -->
    <div id="promotedActivities" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Activities</h3>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Activities -->
    <div id="activities" class="row g-4 reveal"></div>
    
    <!-- Pagination -->
    <nav aria-label="Activities pagination" id="paginationNav" style="display: none;">
      <ul class="pagination justify-content-center mt-4">
        <li class="page-item" id="prevPageItem">
          <a class="page-link" href="#" id="prevPageLink">Previous</a>
        </li>
        <li class="page-item" id="pageNumbers"></li>
        <li class="page-item" id="nextPageItem">
          <a class="page-link" href="#" id="nextPageLink">Next</a>
        </li>
      </ul>
    </nav>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    
    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const provinceSelect = document.getElementById('provinceFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(province => {
            const option = document.createElement('option');
            option.value = province.id;
            option.textContent = province.name;
            provinceSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        city_id: params.get('city_id') || '',
        date: params.get('date') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    function updateURLWithFilters(page = 1) {
      const params = new URLSearchParams();
      const cityId = document.getElementById('cityFilter').value;
      const date = document.getElementById('dateFilter').value;
      const keyword = document.getElementById('keywordFilter').value;
      
      if (cityId) params.set('city_id', cityId);
      if (date) params.set('date', date);
      if (keyword) params.set('q', keyword);
      if (page > 1) params.set('page', page);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadActivities() {
      showLoading('activities');
      const urlParams = getUrlParams();
      
      // Pre-fill filter inputs from URL
      if (urlParams.city_id) {
        try {
          const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
          if (cityData.city && cityData.city.province_id) {
            document.getElementById('provinceFilter').value = cityData.city.province_id;
            const citySelect = document.getElementById('cityFilter');
            citySelect.disabled = false;
            await loadCitiesForProvince(cityData.city.province_id, citySelect);
          }
        } catch (e) {
          console.error('Error loading city:', e);
        }
        document.getElementById('cityFilter').value = urlParams.city_id;
      }
      if (urlParams.date) document.getElementById('dateFilter').value = urlParams.date;
      if (urlParams.q) {
        document.getElementById('keywordFilter').value = urlParams.q;
      }
      
      try {
        const currentPage = urlParams.page || 1;
        const limit = 12;
        let url = `/activities?limit=${limit}&page=${currentPage}`;
        if (urlParams.city_id) url += `&city_id=${urlParams.city_id}`;
        if (urlParams.date) url += `&date=${urlParams.date}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        const data = await apiCall(url);
        const container = document.getElementById('activities');
        const promotedContainer = document.getElementById('promotedActivities');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted activities
        if (data.promoted && data.promoted.length > 0) {
          promotedContainer.style.display = 'block';
          promotedRow.innerHTML = data.promoted.map((a, index) => {
            const priceDisplay = a.discount_percent > 0 
              ? `<div class="price-container">
                  <span class="original-price">${formatPrice(a.price)}</span>
                  <span class="discounted-price">${formatPrice(a.discounted_price || a.price * (1 - a.discount_percent / 100))}</span>
                </div>`
              : `<p class="price">${formatPrice(a.price)}</p>`;
            
            return `
              <div class="col-md-6 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
                <div class="card h-100 promoted-item">
                  <div class="card-img-wrapper">
                    <img src="${normalizeImageUrl(a.image_url)}" class="card-img-top" alt="${a.title}" loading="lazy">
                    ${a.discount_percent > 0 ? `<div class="discount-badge">${a.discount_percent}% OFF</div>` : ''}
                    <div class="card-overlay">
                      <a href="activity-details.html?id=${a.id}" class="btn btn-primary btn-lg">View Details</a>
                    </div>
                  </div>
                  <div class="card-body">
                    <h5 class="card-title">${a.title}</h5>
                    <p class="text-muted">${a.city_name || ''}${a.province_name ? ', ' + a.province_name : ''}</p>
                    <p class="text-muted">${formatDate(a.date)}</p>
                    ${priceDisplay}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          promotedContainer.style.display = 'none';
        }
        
        // Display regular activities
        if (!data || !data.results || data.results.length === 0) {
          if (!data.promoted || data.promoted.length === 0) {
            container.innerHTML = '<p class="text-muted">No activities found.</p>';
          } else {
            container.innerHTML = '';
          }
          return;
        }
        
        container.innerHTML = data.results.map((a, index) => {
          const priceDisplay = a.discount_percent > 0 
            ? `<div class="price-container">
                <span class="original-price">${formatPrice(a.price)}</span>
                <span class="discounted-price">${formatPrice(a.discounted_price || a.price * (1 - a.discount_percent / 100))}</span>
              </div>`
            : `<p class="price">${formatPrice(a.price)}</p>`;
          
          return `
            <div class="col-md-4 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
              <div class="card h-100">
                <div class="card-img-wrapper">
                  <img src="${normalizeImageUrl(a.image_url)}" class="card-img-top" alt="${a.title}" loading="lazy">
                  ${a.discount_percent > 0 ? `<div class="discount-badge">${a.discount_percent}% OFF</div>` : ''}
                  ${a.ad ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                  <div class="card-overlay">
                    <a href="activity-details.html?id=${a.id}" class="btn btn-primary btn-lg">View Details</a>
                  </div>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${a.title}</h5>
                  <p class="text-muted">${a.city_name || ''}${a.province_name ? ', ' + a.province_name : ''}</p>
                  <p class="text-muted">${formatDate(a.date)}</p>
                  ${priceDisplay}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        updatePagination(currentPage, limit, data.results ? data.results.length : 0);
      } catch (error) {
        showError('status', error.message || 'Failed to load activities');
        document.getElementById('activities').innerHTML = '';
        document.getElementById('paginationNav').style.display = 'none';
      }
    }
    
    function updatePagination(currentPage, limit, itemCount) {
      const paginationNav = document.getElementById('paginationNav');
      const pageNumbers = document.getElementById('pageNumbers');
      const prevPageItem = document.getElementById('prevPageItem');
      const nextPageItem = document.getElementById('nextPageItem');
      
      if (itemCount < limit && currentPage === 1) {
        paginationNav.style.display = 'none';
        return;
      }
      
      paginationNav.style.display = 'block';
      
      if (currentPage > 1) {
        prevPageItem.classList.remove('disabled');
        document.getElementById('prevPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage - 1);
          loadActivities();
        };
      } else {
        prevPageItem.classList.add('disabled');
        document.getElementById('prevPageLink').onclick = (e) => e.preventDefault();
      }
      
      if (itemCount >= limit) {
        nextPageItem.classList.remove('disabled');
        document.getElementById('nextPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage + 1);
          loadActivities();
        };
      } else {
        nextPageItem.classList.add('disabled');
        document.getElementById('nextPageLink').onclick = (e) => e.preventDefault();
      }
      
      let pageNumbersHtml = '';
      const maxPages = 5;
      let startPage = Math.max(1, currentPage - 2);
      let endPage = startPage + maxPages - 1;
      
      for (let i = startPage; i <= endPage; i++) {
        const isActive = i === currentPage;
        pageNumbersHtml += `
          <li class="page-item ${isActive ? 'active' : ''}">
            <a class="page-link" href="#" onclick="event.preventDefault(); updateURLWithFilters(${i}); loadActivities();">${i}</a>
          </li>
        `;
      }
      
      pageNumbers.innerHTML = pageNumbersHtml;
    }

    function handleFilterClick() {
      updateURLWithFilters(1);
      loadActivities();
    }

    window.addEventListener('popstate', function() {
      loadActivities();
    });

    document.addEventListener('DOMContentLoaded', async function() {
      await loadProvinces();
      initCascadingCityDropdown('provinceFilter', 'cityFilter');
      loadActivities();
    });
  </script>
</body>
</html>
