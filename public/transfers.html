<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Transfers</h1>
    
    <!-- Transfer Search Form -->
    <div class="flight-search-form">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label">Province</label>
          <select class="form-control" id="provinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">City</label>
          <select class="form-control" id="cityFilter" disabled>
            <option value="">Select Province First</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Keyword</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search transfers...">
        </div>
        <div class="col-md-2">
          <label class="form-label">Min Price</label>
          <input type="number" class="form-control" id="minPrice" placeholder="Min" min="0" step="1" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="col-md-2">
          <label class="form-label">Max Price</label>
          <input type="number" class="form-control" id="maxPrice" placeholder="Max" min="0" step="1" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" class="btn btn-primary w-100" id="searchTransfersBtn">Filter</button>
        </div>
      </div>
    </div>
    
    <!-- Hidden inputs for actual values -->
    <input type="hidden" id="destinationCityId">
    <div id="status"></div>
    
    <!-- Promoted Transfers Section -->
    <div id="promotedTransfers" class="promoted-section mb-4" style="display: none;">
      <div id="promotedTransfersHeader"></div>
      <div id="promotedTransfersList" class="list-group mb-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Transfers -->
    <div id="transfers" class="list-group reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;"></div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');
    
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    let citiesData = [];
    let provincesData = [];
    
    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }
    
    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        provincesData = data.results || [];
        const provinceSelect = document.getElementById('provinceFilter');
        provinceSelect.innerHTML = '<option value=\"\">All Provinces</option>' + provincesData.map(p => `<option value=\"${p.id}\">${escapeHtml(p.name)}</option>`).join('');
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }
    
    async function loadCitiesForProvince(provinceId, citySelect) {
      const params = provinceId ? `?province_id=${provinceId}` : '';
      const data = await apiCall(`/cities${params}`);
      citiesData = data.results || [];
      citySelect.innerHTML = '<option value=\"\">All Cities</option>';
      citiesData.forEach(city => {
        const opt = document.createElement('option');
        opt.value = city.id;
        opt.textContent = city.name;
        citySelect.appendChild(opt);
      });
    }
    
    function initCascadingCityDropdown(provinceSelectId, citySelectId) {
      const provinceSelect = document.getElementById(provinceSelectId);
      const citySelect = document.getElementById(citySelectId);
      if (!provinceSelect || !citySelect) return;
      
      citySelect.disabled = true;
      citySelect.innerHTML = '<option value=\"\">Select Province First</option>';
      
      provinceSelect.addEventListener('change', async function() {
        const provinceId = this.value;
        citySelect.value = '';
        document.getElementById('destinationCityId').value = '';
        
        if (!provinceId) {
          citySelect.disabled = true;
          citySelect.innerHTML = '<option value=\"\">Select Province First</option>';
          updateURLWithFilters();
          loadTransfers(true);
          return;
        }
        
        citySelect.disabled = false;
        await loadCitiesForProvince(provinceId, citySelect);
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      citySelect.addEventListener('change', function() {
        document.getElementById('destinationCityId').value = this.value || '';
        updateURLWithFilters();
        loadTransfers(true);
      });
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        province_id: params.get('province_id') || '',
        destination_city_id: params.get('destination_city_id') || '',
        q: params.get('q') || '',
        minPrice: params.get('minPrice') || '',
        maxPrice: params.get('maxPrice') || '',
        page: parseInt(params.get('page')) || 1
      };
    }
    
    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const provinceId = document.getElementById('provinceFilter').value;
      const destinationCityId = document.getElementById('destinationCityId').value;
      const keyword = document.getElementById('keywordFilter').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (provinceId) params.set('province_id', provinceId);
      if (destinationCityId) params.set('destination_city_id', destinationCityId);
      if (keyword) params.set('q', keyword);
      if (minPrice) params.set('minPrice', minPrice);
      if (maxPrice) params.set('maxPrice', maxPrice);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    function renderTransferListItem(t) {
      const basePrice = t.price;
      const discountedPrice = t.discount_percent > 0
        ? (t.discounted_price || basePrice * (1 - t.discount_percent / 100))
        : basePrice;
      const originDisplay = t.origin_city_name
        ? `${t.origin_city_name}${t.origin_province_name ? ', ' + t.origin_province_name : ''}`
        : (t.origin || '');
      const destinationDisplay = t.destination_city_name
        ? `${t.destination_city_name}${t.destination_province_name ? ', ' + t.destination_province_name : ''}`
        : (t.destination || '');
      return `
        <a href="transfer-details.html?id=${t.id}" class="list-group-item list-group-item-action py-3">
          <div class="d-flex w-100 justify-content-between align-items-center">
            <div class="flex-grow-1">
              <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                <span><strong>${escapeHtml(t.service || 'Transfer')}</strong></span>
                <span class="text-muted">${originDisplay} → ${destinationDisplay}</span>
                ${isPromoted(t.ad) ? '<span class="badge bg-warning text-dark">Promoted</span>' : ''}
                ${t.discount_percent > 0 ? `<span class="badge bg-danger">${formatPercent(t.discount_percent)}% OFF</span>` : ''}
              </div>
            </div>
            <div class="text-end ms-3">
              ${t.discount_percent > 0
                ? `<div><span class="text-decoration-line-through text-muted small">${formatPrice(basePrice)}</span><br><strong class="text-primary">${formatPrice(discountedPrice)}</strong></div>`
                : `<div><strong class="text-primary">From ${formatPrice(basePrice)}</strong></div>`
              }
            </div>
          </div>
        </a>
      `;
    }
    
    async function loadTransfers(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('transfers');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-12', false, 2);
        const promotedContainer = document.getElementById('promotedTransfers');
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'block';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/transfers?limit=${limit}&page=${currentPage}`;
        
        if (urlParams.province_id) url += `&province_id=${urlParams.province_id}`;
        if (urlParams.destination_city_id) url += `&destination_city_id=${urlParams.destination_city_id}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        if (urlParams.minPrice) url += `&minPrice=${urlParams.minPrice}`;
        if (urlParams.maxPrice) url += `&maxPrice=${urlParams.maxPrice}`;
        
        const data = await apiCall(url);
        if (!data) {
          console.error('No data returned from API');
          isLoading = false;
          loadingIndicator.style.display = 'none';
          return;
        }
        
        const promotedContainer = document.getElementById('promotedTransfers');
        
        // Display promoted transfers (only on first page/reset)
        if (reset || currentPage === 1) {
          container.innerHTML = '';
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const header = document.getElementById('promotedTransfersHeader');
            header.innerHTML = renderSectionHeader({ title: 'Promoted Transfers' });
            const promotedList = document.getElementById('promotedTransfersList');
            promotedList.innerHTML = data.promoted.slice(0, 2).map((t) => renderTransferListItem(t)).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular transfers
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            const hasFilters = urlParams.province_id || urlParams.destination_city_id || urlParams.minPrice || urlParams.maxPrice || urlParams.q;
            container.innerHTML = hasFilters
              ? renderEmptyState({ message: 'No transfers found matching your criteria. Try adjusting your search filters.' })
              : renderEmptyState({ message: 'Currently no transfers available.' });
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items - stop if we got fewer results than the limit
        hasMore = data.results.length === limit;
        
        // Append transfers to container as list items
        const transfersHtml = data.results.map((t) => renderTransferListItem(t)).join('');
        
        container.insertAdjacentHTML('beforeend', transfersHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load transfers');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadTransfers();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadTransfers(true);
    }

    window.addEventListener('popstate', function() {
      loadTransfers(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
        await loadProvinces();
        initCascadingCityDropdown('provinceFilter', 'cityFilter');
        enforceIntegerInput('minPrice');
        enforceIntegerInput('maxPrice');
      
      // Load URL params into selects
      const urlParams = getUrlParams();
      if (urlParams.province_id) {
        document.getElementById('provinceFilter').value = urlParams.province_id;
          const citySelect = document.getElementById('cityFilter');
          citySelect.disabled = false;
          await loadCitiesForProvince(urlParams.province_id, citySelect);
      }
      if (urlParams.destination_city_id) {
        const city = citiesData.find(c => c.id == urlParams.destination_city_id);
        if (city) {
          document.getElementById('cityFilter').value = city.id;
          document.getElementById('destinationCityId').value = city.id;
        }
      }
        if (urlParams.q) document.getElementById('keywordFilter').value = urlParams.q;
        if (urlParams.minPrice) document.getElementById('minPrice').value = urlParams.minPrice;
        if (urlParams.maxPrice) document.getElementById('maxPrice').value = urlParams.maxPrice;
      
      // Province / City filter handlers
      // Province / City handled via cascading dropdown init
      document.getElementById('minPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      document.getElementById('maxPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      document.getElementById('keywordFilter').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          updateURLWithFilters();
          loadTransfers(true);
        }
      });
      
      // Search button
      document.getElementById('searchTransfersBtn').addEventListener('click', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      // Initial load - show all transfers if no filters
      loadTransfers(true);
    });
  </script>
</body>
</html>
