<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Transfers</h1>
    
    <!-- Transfer Search Form -->
    <div class="flight-search-form">
      <!-- Main Search Fields -->
      <div class="flight-search-fields transfers-search-fields">
        <!-- Origin Province -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <select class="flight-field-input" id="originProvinceSelect">
              <option value="">Province</option>
            </select>
          </div>
        </div>
        
        <!-- Origin City -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <select class="flight-field-input" id="originCitySelect" disabled>
              <option value="">City</option>
            </select>
          </div>
        </div>
        
        <!-- Swap Button -->
        <button type="button" class="flight-swap-btn" id="swapCitiesBtn" title="Swap cities">
          <i class="bi bi-arrow-left-right"></i>
        </button>
        
        <!-- Destination Province -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt-fill"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <select class="flight-field-input" id="destinationProvinceSelect">
              <option value="">Province</option>
            </select>
          </div>
        </div>
        
        <!-- Destination City -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt-fill"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <select class="flight-field-input" id="destinationCitySelect" disabled>
              <option value="">City</option>
            </select>
          </div>
        </div>
        
        <!-- Search Button -->
        <button type="button" class="flight-search-btn" id="searchTransfersBtn">
          Search
        </button>
      </div>
      
      <!-- Price Range Filter -->
      <div class="flight-filters mt-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Price Range</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="number" class="form-control" id="minPrice" placeholder="Min price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
              <div class="col-6">
                <input type="number" class="form-control" id="maxPrice" placeholder="Max price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
            </div>
          </div>
        </div>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Clear Filters</button>
        </div>
      </div>
    </div>
    
    <div id="status"></div>
    
    <!-- Promoted Transfers Section -->
    <div id="promotedTransfers" class="promoted-section mb-4" style="display: none;">
      <div id="promotedTransfersHeader"></div>
      <div id="promotedTransfersList" class="list-group mb-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Transfers -->
    <div id="transfers" class="list-group reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;"></div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');
    
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    
    // Load provinces
    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const provinces = data.results || [];
        const originProvinceSelect = document.getElementById('originProvinceSelect');
        const destinationProvinceSelect = document.getElementById('destinationProvinceSelect');
        
        provinces.forEach(province => {
          const option1 = document.createElement('option');
          option1.value = province.id;
          option1.textContent = province.name;
          originProvinceSelect.appendChild(option1);
          
          const option2 = document.createElement('option');
          option2.value = province.id;
          option2.textContent = province.name;
          destinationProvinceSelect.appendChild(option2);
        });
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }
    
    // Load cities for a specific province
    async function loadCitiesForProvince(provinceId, citySelect) {
      try {
        const cities = await apiCall(`/cities?province_id=${provinceId}`);
        citySelect.disabled = false;
        citySelect.innerHTML = '<option value="">Select City</option>';
        if (cities.results && cities.results.length > 0) {
          cities.results.forEach(city => {
            const option = document.createElement('option');
            option.value = city.id;
            option.textContent = city.name;
            citySelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading cities:', error);
      }
    }
    
    // Initialize cascading dropdown for origin
    function initOriginCascading() {
      const provinceSelect = document.getElementById('originProvinceSelect');
      const citySelect = document.getElementById('originCitySelect');
      
      provinceSelect.addEventListener('change', async function() {
        const provinceId = this.value;
        citySelect.innerHTML = '<option value="">Select City</option>';
        
        if (!provinceId) {
          citySelect.disabled = true;
          citySelect.innerHTML = '<option value="">Select Province First</option>';
          return;
        }
        
        citySelect.disabled = false;
        await loadCitiesForProvince(provinceId, citySelect);
      });
    }
    
    // Initialize cascading dropdown for destination
    function initDestinationCascading() {
      const provinceSelect = document.getElementById('destinationProvinceSelect');
      const citySelect = document.getElementById('destinationCitySelect');
      
      provinceSelect.addEventListener('change', async function() {
        const provinceId = this.value;
        citySelect.innerHTML = '<option value="">Select City</option>';
        
        if (!provinceId) {
          citySelect.disabled = true;
          citySelect.innerHTML = '<option value="">Select Province First</option>';
          return;
        }
        
        citySelect.disabled = false;
        await loadCitiesForProvince(provinceId, citySelect);
      });
    }
    
    // Swap cities (both province and city)
    function swapCities() {
      const originProvince = document.getElementById('originProvinceSelect');
      const originCity = document.getElementById('originCitySelect');
      const destinationProvince = document.getElementById('destinationProvinceSelect');
      const destinationCity = document.getElementById('destinationCitySelect');
      
      const tempProvince = originProvince.value;
      const tempCity = originCity.value;
      
      originProvince.value = destinationProvince.value;
      originCity.value = destinationCity.value;
      destinationProvince.value = tempProvince;
      destinationCity.value = tempCity;
      
      // Reload cities if provinces changed
      if (originProvince.value) {
        loadCitiesForProvince(originProvince.value, originCity);
        // Try to restore city selection if it exists
        if (tempCity) {
          setTimeout(() => {
            originCity.value = tempCity;
          }, 100);
        }
      } else {
        originCity.disabled = true;
        originCity.innerHTML = '<option value="">Select Province First</option>';
      }
      
      if (destinationProvince.value) {
        loadCitiesForProvince(destinationProvince.value, destinationCity);
        // Try to restore city selection if it exists
        if (tempCity) {
          setTimeout(() => {
            destinationCity.value = tempCity;
          }, 100);
        }
      } else {
        destinationCity.disabled = true;
        destinationCity.innerHTML = '<option value="">Select Province First</option>';
      }
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        origin_province_id: params.get('origin_province_id') || '',
        origin_city_id: params.get('origin_city_id') || '',
        destination_province_id: params.get('destination_province_id') || '',
        destination_city_id: params.get('destination_city_id') || '',
        minPrice: params.get('minPrice') || '',
        maxPrice: params.get('maxPrice') || '',
        page: parseInt(params.get('page')) || 1
      };
    }
    
    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }
    
    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const originProvinceId = document.getElementById('originProvinceSelect').value;
      const originCityId = document.getElementById('originCitySelect').value;
      const destinationProvinceId = document.getElementById('destinationProvinceSelect').value;
      const destinationCityId = document.getElementById('destinationCitySelect').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (originProvinceId) params.set('origin_province_id', originProvinceId);
      if (originCityId) params.set('origin_city_id', originCityId);
      if (destinationProvinceId) params.set('destination_province_id', destinationProvinceId);
      if (destinationCityId) params.set('destination_city_id', destinationCityId);
      if (minPrice) params.set('minPrice', minPrice);
      if (maxPrice) params.set('maxPrice', maxPrice);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    function renderTransferListItem(t) {
      const basePrice = t.price;
      const discountedPrice = t.discount_percent > 0
        ? (t.discounted_price || basePrice * (1 - t.discount_percent / 100))
        : basePrice;
      const originDisplay = t.origin_city_name
        ? `${t.origin_city_name}${t.origin_province_name ? ', ' + t.origin_province_name : ''}`
        : (t.origin || '');
      const destinationDisplay = t.destination_city_name
        ? `${t.destination_city_name}${t.destination_province_name ? ', ' + t.destination_province_name : ''}`
        : (t.destination || '');
      return `
        <a href="transfer-details.html?id=${t.id}" class="list-group-item list-group-item-action py-3">
          <div class="d-flex w-100 justify-content-between align-items-center">
            <div class="flex-grow-1">
              <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                <span><strong>${escapeHtml(t.service || 'Transfer')}</strong></span>
                <span class="text-muted">${originDisplay} → ${destinationDisplay}</span>
                ${isPromoted(t.ad) ? '<span class="promoted-badge">Promoted</span>' : ''}
                ${t.discount_percent > 0 ? `<span class="badge bg-danger">${formatPercent(t.discount_percent)}% OFF</span>` : ''}
              </div>
            </div>
            <div class="text-end ms-3">
              ${t.discount_percent > 0
                ? `<div><span class="text-decoration-line-through text-muted small">${formatPrice(basePrice)}</span><br><strong class="text-primary">${formatPrice(discountedPrice)}</strong></div>`
                : `<div><strong class="text-primary">From ${formatPrice(basePrice)}</strong></div>`
              }
            </div>
          </div>
        </a>
      `;
    }
    
    async function loadTransfers(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('transfers');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-12', false, 2);
        const promotedContainer = document.getElementById('promotedTransfers');
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'block';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/transfers?limit=${limit}&page=${currentPage}`;
        
        // Only send city_id if selected, otherwise send province_id
        if (urlParams.origin_city_id) {
          url += `&origin_city_id=${urlParams.origin_city_id}`;
        } else if (urlParams.origin_province_id) {
          url += `&origin_province_id=${urlParams.origin_province_id}`;
        }
        
        if (urlParams.destination_city_id) {
          url += `&destination_city_id=${urlParams.destination_city_id}`;
        } else if (urlParams.destination_province_id) {
          url += `&destination_province_id=${urlParams.destination_province_id}`;
        }
        
        if (urlParams.minPrice) url += `&minPrice=${urlParams.minPrice}`;
        if (urlParams.maxPrice) url += `&maxPrice=${urlParams.maxPrice}`;
        
        const data = await apiCall(url);
        if (!data) {
          console.error('No data returned from API');
          isLoading = false;
          loadingIndicator.style.display = 'none';
          return;
        }
        
        const promotedContainer = document.getElementById('promotedTransfers');
        
        // Display promoted transfers (only on first page/reset)
        if (reset || currentPage === 1) {
          container.innerHTML = '';
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const header = document.getElementById('promotedTransfersHeader');
            header.innerHTML = renderSectionHeader({ title: 'Promoted Transfers' });
            const promotedList = document.getElementById('promotedTransfersList');
            promotedList.innerHTML = data.promoted.slice(0, 2).map((t) => renderTransferListItem(t)).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular transfers
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            const hasFilters = urlParams.origin_province_id || urlParams.origin_city_id || urlParams.destination_province_id || urlParams.destination_city_id || urlParams.minPrice || urlParams.maxPrice;
            container.innerHTML = hasFilters
              ? renderEmptyState({ message: 'No transfers found matching your criteria. Try adjusting your search filters.' })
              : renderEmptyState({ message: 'Currently no transfers available.' });
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items - stop if we got fewer results than the limit
        hasMore = data.results.length === limit;
        
        // Append transfers to container as list items
        const transfersHtml = data.results.map((t) => renderTransferListItem(t)).join('');
        
        container.insertAdjacentHTML('beforeend', transfersHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load transfers');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadTransfers();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadTransfers(true);
    }

    window.addEventListener('popstate', function() {
      loadTransfers(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
      await loadProvinces();
      enforceIntegerInput('minPrice');
      enforceIntegerInput('maxPrice');
      
      // Initialize cascading dropdowns
      initOriginCascading();
      initDestinationCascading();
      
      // Load URL params into form
      const urlParams = getUrlParams();
      if (urlParams.origin_province_id) {
        const originProvinceSelect = document.getElementById('originProvinceSelect');
        const originCitySelect = document.getElementById('originCitySelect');
        originProvinceSelect.value = urlParams.origin_province_id;
        await loadCitiesForProvince(urlParams.origin_province_id, originCitySelect);
        if (urlParams.origin_city_id) {
          originCitySelect.value = urlParams.origin_city_id;
        }
      }
      if (urlParams.destination_province_id) {
        const destinationProvinceSelect = document.getElementById('destinationProvinceSelect');
        const destinationCitySelect = document.getElementById('destinationCitySelect');
        destinationProvinceSelect.value = urlParams.destination_province_id;
        await loadCitiesForProvince(urlParams.destination_province_id, destinationCitySelect);
        if (urlParams.destination_city_id) {
          destinationCitySelect.value = urlParams.destination_city_id;
        }
      }
      
      // Swap button
      document.getElementById('swapCitiesBtn').addEventListener('click', swapCities);
      
      // Search button
      document.getElementById('searchTransfersBtn').addEventListener('click', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      // Clear filters
      document.getElementById('clearFiltersBtn').addEventListener('click', function() {
        document.getElementById('originProvinceSelect').value = '';
        document.getElementById('originCitySelect').value = '';
        document.getElementById('originCitySelect').disabled = true;
        document.getElementById('originCitySelect').innerHTML = '<option value="">Select Province First</option>';
        document.getElementById('destinationProvinceSelect').value = '';
        document.getElementById('destinationCitySelect').value = '';
        document.getElementById('destinationCitySelect').disabled = true;
        document.getElementById('destinationCitySelect').innerHTML = '<option value="">Select Province First</option>';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        window.history.pushState({}, '', window.location.pathname);
        loadTransfers(true);
      });
      
      // Apply filters on price change
      document.getElementById('minPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      document.getElementById('maxPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadTransfers(true);
      });
      
      // Initialize filters from URL
      const filterUrlParams = getUrlParams();
      if (filterUrlParams.minPrice) {
        document.getElementById('minPrice').value = filterUrlParams.minPrice;
      }
      if (filterUrlParams.maxPrice) {
        document.getElementById('maxPrice').value = filterUrlParams.maxPrice;
      }
      
      // Initial load - show all transfers if no filters
      loadTransfers(true);
    });
  </script>
</body>
</html>
