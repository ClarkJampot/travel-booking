<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Transfers</h1>
    <div class="filter-section">
      <div class="row">
        <div class="col-md-2">
          <label class="form-label">Origin Province</label>
          <select class="form-control" id="originProvinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Origin City</label>
          <select class="form-control" id="originCityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Destination Province</label>
          <select class="form-control" id="destinationProvinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Destination City</label>
          <select class="form-control" id="destinationCityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Keyword Search</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search transfers...">
        </div>
        <div class="col-md-1">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Filter</button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <!-- Promoted Transfers Section -->
    <div id="promotedTransfers" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Transfers</h3>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Transfers -->
    <div id="transfers" class="row g-4 reveal"></div>
    
    <!-- Pagination -->
    <nav aria-label="Transfers pagination" id="paginationNav" style="display: none;">
      <ul class="pagination justify-content-center mt-4">
        <li class="page-item" id="prevPageItem">
          <a class="page-link" href="#" id="prevPageLink">Previous</a>
        </li>
        <li class="page-item" id="pageNumbers"></li>
        <li class="page-item" id="nextPageItem">
          <a class="page-link" href="#" id="nextPageLink">Next</a>
        </li>
      </ul>
    </nav>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    
    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const originProvinceSelect = document.getElementById('originProvinceFilter');
        const destinationProvinceSelect = document.getElementById('destinationProvinceFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(province => {
            const option1 = document.createElement('option');
            option1.value = province.id;
            option1.textContent = province.name;
            originProvinceSelect.appendChild(option1);
            
            const option2 = document.createElement('option');
            option2.value = province.id;
            option2.textContent = province.name;
            destinationProvinceSelect.appendChild(option2);
          });
        }
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        origin_city_id: params.get('origin_city_id') || '',
        destination_city_id: params.get('destination_city_id') || '',
        date: params.get('date') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    function updateURLWithFilters(page = 1) {
      const params = new URLSearchParams();
      const originCityId = document.getElementById('originCityFilter').value;
      const destinationCityId = document.getElementById('destinationCityFilter').value;
      const date = document.getElementById('dateFilter').value;
      const keyword = document.getElementById('keywordFilter').value;
      
      if (originCityId) params.set('origin_city_id', originCityId);
      if (destinationCityId) params.set('destination_city_id', destinationCityId);
      if (date) params.set('date', date);
      if (keyword) params.set('q', keyword);
      if (page > 1) params.set('page', page);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadTransfers() {
      showLoading('transfers');
      const urlParams = getUrlParams();
      
      // Pre-fill filter inputs from URL
      if (urlParams.origin_city_id) {
        try {
          const cityData = await apiCall(`/cities?id=${urlParams.origin_city_id}`);
          if (cityData.city && cityData.city.province_id) {
            document.getElementById('originProvinceFilter').value = cityData.city.province_id;
            const originCitySelect = document.getElementById('originCityFilter');
            originCitySelect.disabled = false;
            await loadCitiesForProvince(cityData.city.province_id, originCitySelect);
          }
        } catch (e) {
          console.error('Error loading origin city:', e);
        }
        document.getElementById('originCityFilter').value = urlParams.origin_city_id;
      }
      if (urlParams.destination_city_id) {
        try {
          const cityData = await apiCall(`/cities?id=${urlParams.destination_city_id}`);
          if (cityData.city && cityData.city.province_id) {
            document.getElementById('destinationProvinceFilter').value = cityData.city.province_id;
            const destinationCitySelect = document.getElementById('destinationCityFilter');
            destinationCitySelect.disabled = false;
            await loadCitiesForProvince(cityData.city.province_id, destinationCitySelect);
          }
        } catch (e) {
          console.error('Error loading destination city:', e);
        }
        document.getElementById('destinationCityFilter').value = urlParams.destination_city_id;
      }
      if (urlParams.date) document.getElementById('dateFilter').value = urlParams.date;
      if (urlParams.q) {
        document.getElementById('keywordFilter').value = urlParams.q;
      }
      
      try {
        const currentPage = urlParams.page || 1;
        const limit = 12;
        let url = `/transfers?limit=${limit}&page=${currentPage}`;
        if (urlParams.origin_city_id) url += `&origin_city_id=${urlParams.origin_city_id}`;
        if (urlParams.destination_city_id) url += `&destination_city_id=${urlParams.destination_city_id}`;
        if (urlParams.date) url += `&date=${urlParams.date}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        const data = await apiCall(url);
        const container = document.getElementById('transfers');
        const promotedContainer = document.getElementById('promotedTransfers');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted transfers
        if (data.promoted && data.promoted.length > 0) {
          promotedContainer.style.display = 'block';
          promotedRow.innerHTML = data.promoted.map((t, index) => {
            const priceDisplay = t.discount_percent > 0 
              ? `<div class="price-container">
                  <span class="original-price">${formatPrice(t.price)}</span>
                  <span class="discounted-price">${formatPrice(t.discounted_price || t.price * (1 - t.discount_percent / 100))}</span>
                </div>`
              : `<p class="price">${formatPrice(t.price)}</p>`;
            
            return `
              <div class="col-md-6 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
                <div class="card h-100 promoted-item">
                  <div class="card-img-wrapper">
                    <img src="${normalizeImageUrl(t.image_url)}" class="card-img-top" alt="${t.service}" loading="lazy">
                    ${t.discount_percent > 0 ? `<div class="discount-badge">${t.discount_percent}% OFF</div>` : ''}
                    <div class="card-overlay">
                      <a href="transfer-details.html?id=${t.id}" class="btn btn-primary btn-lg">View Details</a>
                    </div>
                  </div>
                  <div class="card-body">
                    <h5 class="card-title">${t.service}</h5>
                    <p>${t.origin_city_name || t.origin} → ${t.destination_city_name || t.destination}</p>
                    <p class="text-muted">${formatDate(t.date)}</p>
                    ${priceDisplay}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          promotedContainer.style.display = 'none';
        }
        
        // Display regular transfers
        if (!data || !data.results || data.results.length === 0) {
          if (!data.promoted || data.promoted.length === 0) {
            container.innerHTML = '<p class="text-muted">No transfers found.</p>';
          } else {
            container.innerHTML = '';
          }
          return;
        }
        
        container.innerHTML = data.results.map((t, index) => {
          const priceDisplay = t.discount_percent > 0 
            ? `<div class="price-container">
                <span class="original-price">${formatPrice(t.price)}</span>
                <span class="discounted-price">${formatPrice(t.discounted_price || t.price * (1 - t.discount_percent / 100))}</span>
              </div>`
            : `<p class="price">${formatPrice(t.price)}</p>`;
          
          return `
            <div class="col-md-4 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
              <div class="card h-100">
                <div class="card-img-wrapper">
                  <img src="${normalizeImageUrl(t.image_url)}" class="card-img-top" alt="${t.service}" loading="lazy">
                  ${t.discount_percent > 0 ? `<div class="discount-badge">${t.discount_percent}% OFF</div>` : ''}
                  ${t.ad ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                  <div class="card-overlay">
                    <a href="transfer-details.html?id=${t.id}" class="btn btn-primary btn-lg">View Details</a>
                  </div>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${t.service}</h5>
                  <p>${t.origin_city_name || t.origin} → ${t.destination_city_name || t.destination}</p>
                  <p class="text-muted">${formatDate(t.date)}</p>
                  ${priceDisplay}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        updatePagination(currentPage, limit, data.results ? data.results.length : 0);
      } catch (error) {
        showError('status', error.message || 'Failed to load transfers');
        document.getElementById('transfers').innerHTML = '';
        document.getElementById('paginationNav').style.display = 'none';
      }
    }
    
    function updatePagination(currentPage, limit, itemCount) {
      const paginationNav = document.getElementById('paginationNav');
      const pageNumbers = document.getElementById('pageNumbers');
      const prevPageItem = document.getElementById('prevPageItem');
      const nextPageItem = document.getElementById('nextPageItem');
      
      if (itemCount < limit && currentPage === 1) {
        paginationNav.style.display = 'none';
        return;
      }
      
      paginationNav.style.display = 'block';
      
      if (currentPage > 1) {
        prevPageItem.classList.remove('disabled');
        document.getElementById('prevPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage - 1);
          loadTransfers();
        };
      } else {
        prevPageItem.classList.add('disabled');
        document.getElementById('prevPageLink').onclick = (e) => e.preventDefault();
      }
      
      if (itemCount >= limit) {
        nextPageItem.classList.remove('disabled');
        document.getElementById('nextPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage + 1);
          loadTransfers();
        };
      } else {
        nextPageItem.classList.add('disabled');
        document.getElementById('nextPageLink').onclick = (e) => e.preventDefault();
      }
      
      let pageNumbersHtml = '';
      const maxPages = 5;
      let startPage = Math.max(1, currentPage - 2);
      // Only show pages up to current page if no more items, otherwise show up to maxPages
      let endPage = itemCount >= limit ? Math.min(startPage + maxPages - 1, currentPage + 2) : currentPage;
      
      for (let i = startPage; i <= endPage; i++) {
        const isActive = i === currentPage;
        pageNumbersHtml += `
          <li class="page-item ${isActive ? 'active' : ''}">
            <a class="page-link" href="#" onclick="event.preventDefault(); updateURLWithFilters(${i}); loadTransfers();">${i}</a>
          </li>
        `;
      }
      
      pageNumbers.innerHTML = pageNumbersHtml;
    }

    function handleFilterClick() {
      updateURLWithFilters(1);
      loadTransfers();
    }

    window.addEventListener('popstate', function() {
      loadTransfers();
    });

    document.addEventListener('DOMContentLoaded', async function() {
      await loadProvinces();
      initCascadingCityDropdown('originProvinceFilter', 'originCityFilter');
      initCascadingCityDropdown('destinationProvinceFilter', 'destinationCityFilter');
      loadTransfers();
    });
  </script>
</body>
</html>
