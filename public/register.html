<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="card-title text-center mb-4">Register</h2>
            
            <div id="alertContainer"></div>
            
            <form id="registerForm">
              <div class="mb-3">
                <label for="role" class="form-label">Account Type</label>
                <select class="form-control" id="role" name="role" required>
                  <option value="customer">Customer</option>
                  <option value="agency">Travel Agency</option>
                  <option value="owner">Hotel Owner</option>
                </select>
                <small class="form-text text-muted">Select the type of account you want to create</small>
              </div>
              
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
              </div>
              
              <div class="mb-3">
                <label for="firstName" class="form-label" id="firstNameLabel">Given Name/Business Name</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required autocomplete="given-name">
                <small class="form-text text-muted" id="firstNameHelp">Enter your given name or business name</small>
              </div>
              
              <div class="mb-3" id="lastNameGroup">
                <label for="lastName" class="form-label">Last Name <span class="text-muted">(optional)</span></label>
                <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name">
              </div>
              
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password" minlength="6">
                <small class="form-text text-muted">Password must be at least 6 characters</small>
              </div>
              
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="6">
              </div>
              
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Register</button>
              </div>
              
              <div class="text-center">
                <p class="mb-0">Already have an account? <a href="login.html">Login here</a></p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/urlHelpers.js"></script>
  <script src="js/utils/componentLoader.js"></script>
  <script src="js/utils/uiHelpers.js"></script>
  <script src="js/utils/renderers.js"></script>
  <script src="js/utils/authHelpers.js"></script>
  <script src="js/utils/locationHelpers.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Check if already logged in
    document.addEventListener('DOMContentLoaded', async function() {
      await loadComponent('header', 'components/header.html', 'includes/header.html');
      await loadComponent('footer', 'components/footer.html', 'includes/footer.html');
      updateNavigation();
      
      const token = localStorage.getItem('token');
      if (token) {
        // Already logged in, redirect to home
        window.location.href = 'index.html';
        return;
      }
      
      // Initialize form
      const registerForm = document.getElementById('registerForm');
      const alertContainer = document.getElementById('alertContainer');
      const submitBtn = document.getElementById('submitBtn');
      const roleSelect = document.getElementById('role');
      const firstNameLabel = document.getElementById('firstNameLabel');
      const firstNameHelp = document.getElementById('firstNameHelp');
      const lastNameGroup = document.getElementById('lastNameGroup');
      
      // Update form based on role selection
      function updateFormForRole() {
        const role = roleSelect.value;
        if (role === 'customer') {
          firstNameLabel.textContent = 'Given Name/Business Name';
          firstNameHelp.textContent = 'Enter your given name or business name';
          lastNameGroup.style.display = 'block';
        } else if (role === 'agency') {
          firstNameLabel.textContent = 'Business Name';
          firstNameHelp.textContent = 'Enter your travel agency business name';
          lastNameGroup.style.display = 'none';
        } else if (role === 'owner') {
          firstNameLabel.textContent = 'Business Name';
          firstNameHelp.textContent = 'Enter your hotel/resort business name';
          lastNameGroup.style.display = 'none';
        }
      }
      
      // Listen for role changes
      roleSelect.addEventListener('change', updateFormForRole);
      updateFormForRole(); // Initial update
      
      function showAlert(message, type = 'danger') {
        alertContainer.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
      }
      
      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const role = roleSelect.value;
        
        // Validation
        if (!email || !firstName || !password) {
          showAlert('Please fill in all required fields');
          return;
        }
        
        if (password.length < 6) {
          showAlert('Password must be at least 6 characters');
          return;
        }
        
        if (password !== confirmPassword) {
          showAlert('Passwords do not match');
          return;
        }
        
        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';
        
        try {
          const data = await register(email, password, firstName, lastName, role);
          
          // Success - redirect to home
          showAlert('Registration successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } catch (error) {
          // Show error
          const errorMessage = error.message || 'Registration failed. Please try again.';
          showAlert(errorMessage);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register';
        }
      });
    });
  </script>
</body>
</html>
