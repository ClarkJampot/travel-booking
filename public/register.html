<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">Bookings</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main>
    <h1>Register</h1>
    
    <section class="card">
      <h3>Create Account</h3>
      <div class="row">
        <label>Email <input id="reg_email" placeholder="new@example.com" type="email"></label>
        <label>Password <input id="reg_password" type="password" placeholder="••••••••"></label>
        <label>Confirm Password <input id="reg_password_confirm" type="password" placeholder="••••••••"></label>
        <label>Full name <input id="reg_name" placeholder="Your Name"></label>
        <label>Role
          <select id="reg_role">
            <option value="customer">Customer</option>
            <option value="agency">Travel Agency</option>
            <option value="owner">Hotel Owner</option>
          </select>
        </label>
        <button onclick="register()">Register</button>
      </div>
      <div id="authStatus" class="muted"></div>
      <div style="margin-top: 12px;">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </section>
  </main>
  <script>
    async function register() {
      const email = document.getElementById('reg_email').value.trim();
      const password = document.getElementById('reg_password').value;
      const passwordConfirm = document.getElementById('reg_password_confirm').value;
      const full_name = document.getElementById('reg_name').value.trim();
      const role = document.getElementById('reg_role').value;
      const status = document.getElementById('authStatus');
      
      if (!email || !password || !full_name) {
        status.textContent = 'Please fill in all required fields';
        return;
      }
      
      if (password !== passwordConfirm) {
        status.textContent = 'Passwords do not match';
        return;
      }
      
      if (password.length < 6) {
        status.textContent = 'Password must be at least 6 characters';
        return;
      }
      
      status.textContent = 'Registering...';
      try {
        const res = await fetch('api/auth/register', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ email, password, full_name, role }) 
        });
        const data = await res.json();
        if (res.ok) {
          status.textContent = 'Registered successfully! Redirecting...';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          status.textContent = 'Error: ' + (data.error || 'Registration failed');
        }
      } catch (e) { 
        status.textContent = 'Error: ' + e.message; 
      }
    }
  </script>
</body>
</html>
