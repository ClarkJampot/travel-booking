<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <div id="status"></div>
    <div id="profileContent" class="reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/urlHelpers.js"></script>
  <script src="js/utils/componentLoader.js"></script>
  <script src="js/utils/uiHelpers.js"></script>
  <script src="js/utils/renderers.js"></script>
  <script src="js/utils/authHelpers.js"></script>
  <script src="js/utils/locationHelpers.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/components/ContentListItem.js"></script>
  <script src="js/components/FileUpload.js"></script>
  <script src="js/components/PostingModalFormFields.js"></script>
  <script src="js/components/PostingModalFieldRenderer.js"></script>
  <script src="js/components/PostingModalFormHandler.js"></script>
  <script src="js/components/PostingModalValidator.js"></script>
  <script src="js/components/PostingModal.js"></script>
  <script src="js/components/PostingModalHelpers.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication
    if (!isAuthenticated()) {
      alert('Please log in to view your profile.');
      window.location.href = 'login.html';
    }

    function renderContentCard(item, type) {
      const detailPage = {
        'hotel': 'hotel-details.html',
        'flight': 'flight-details.html',
        'activity': 'activity-details.html',
        'transfer': 'transfer-details.html'
      }[type] || '#';
      
      const priceField = type === 'hotel' ? 'price_per_night' : 'price';
      const priceLabel = type === 'hotel' ? '/night' : '';
      const nameField = type === 'activity' ? 'title' : (type === 'flight' ? 'airline' : (type === 'transfer' ? 'service' : 'name'));
      
      const originalPrice = item[priceField] || item.price_per_night || item.price || 0;
      const priceDisplay = item.discount_percent > 0 
        ? `<div class="price-container">
            <span class="original-price">${formatPrice(originalPrice)}</span>
            <span class="discounted-price">${formatPrice(item.discounted_price || originalPrice * (1 - item.discount_percent / 100))}</span>
            ${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}
          </div>`
        : `<p class="price">${formatPrice(originalPrice)}${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}</p>`;
      
      return `
        <div class="col-md-4 mb-4">
          <div class="card h-100 ${isPromoted(item.ad) ? 'promoted-item' : ''}">
            <div class="card-img-wrapper">
              <img src="${normalizeImageUrl(item.image_url)}" class="card-img-top" alt="${item[nameField]}" loading="lazy">
              ${item.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(item.discount_percent)}% OFF</div>` : ''}
              ${isPromoted(item.ad) ? `<div class="promoted-badge promoted-badge-absolute">Promoted</div>` : ''}
              <div class="card-overlay">
                <a href="${detailPage}?id=${item.id}" class="btn btn-primary btn-lg">View Details</a>
              </div>
            </div>
            <div class="card-body">
              <h5 class="card-title">${item[nameField]}</h5>
              ${item.city_name ? `<p class="card-text text-muted">${item.city_name}${item.province_name ? ', ' + item.province_name : ''}</p>` : ''}
              ${item.depart_date ? `<p class="text-muted">${formatDate(item.depart_date)}</p>` : ''}
              ${item.date ? `<p class="text-muted">${formatDate(item.date)}</p>` : ''}
              ${item.origin && item.destination ? `<p class="text-muted">${item.origin_city_name || item.origin} → ${item.destination_city_name || item.destination}</p>` : ''}
              ${priceDisplay}
            </div>
          </div>
        </div>
      `;
    }

    function renderContentSection(title, items, type) {
      if (!items || items.length === 0) return '';
      
      return `
        <div class="mb-5">
          <h3 class="mb-4">${title}</h3>
          <div class="row g-4">
            ${items.map(item => renderContentCard(item, type)).join('')}
          </div>
        </div>
      `;
    }
    
    function renderRecentBookingItem(booking, index) {
      const statusClass = booking.status === 'confirmed'
        ? 'success'
        : booking.status === 'cancelled'
          ? 'danger'
          : 'secondary';
      
      const type = booking.type || 'unknown';
      const itemDetails = booking.item_details || {};
      const itemName = itemDetails.name || itemDetails.title || itemDetails.airline || itemDetails.service || `Item #${booking.item_id}`;
      
      // Build compact details
      let detailsText = '';
      if (type === 'hotel' && booking.check_in) {
        detailsText = `${formatDate(booking.check_in)} - ${booking.check_out ? formatDate(booking.check_out) : 'N/A'}`;
      } else if (type === 'flight' && itemDetails.origin && itemDetails.destination) {
        detailsText = `${itemDetails.origin} → ${itemDetails.destination}`;
      } else if (type === 'activity' && booking.date) {
        detailsText = formatDate(booking.date);
      } else if (type === 'transfer' && itemDetails.origin && itemDetails.destination) {
        detailsText = `${itemDetails.origin} → ${itemDetails.destination}`;
      }
      
      const detailPage = type === 'hotel' ? 'hotel-details.html' : 
                        type === 'flight' ? 'flight-details.html' : 
                        type === 'activity' ? 'activity-details.html' : 
                        'transfer-details.html';
      
      return `
        <div class="card mb-2">
          <div class="card-body py-2">
            <div class="d-flex justify-content-between align-items-center">
              <div class="flex-grow-1">
                <h6 class="mb-1">${type.charAt(0).toUpperCase() + type.slice(1)}: ${itemName}</h6>
                ${detailsText ? `<small class="text-muted d-block">${detailsText}</small>` : ''}
                <small class="text-muted">${formatDate(booking.booked_at)}</small>
              </div>
              <div class="text-end ms-3">
                <span class="badge bg-${statusClass} mb-1 d-block">${booking.status.charAt(0).toUpperCase() + booking.status.slice(1)}</span>
                <small class="text-muted d-block">${formatPrice(booking.total_price)}</small>
                <a href="${detailPage}?id=${booking.item_id}" class="btn btn-sm btn-outline-primary mt-1">View</a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadProfile() {
      showLoading('profileContent');
      clearStatus('status');
      
      try {
        const data = await apiCall('/profile');
        const container = document.getElementById('profileContent');
        
        if (!data || !data.user) {
          container.innerHTML = '<p class="text-danger">User not found.</p>';
          return;
        }
        
        const user = data.user;
        const userRole = user.role_name || 'customer';
        const isOwnerOrAgency = userRole === 'owner' || userRole === 'agency';
        const bookings = data.bookings || { total: 0, confirmed: 0, cancelled: 0, completed: 0, total_revenue: 0, total_spent: 0, recent: [] };
        
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.first_name;
        
        container.innerHTML = `
          <div class="row">
            <div class="col-md-4">
              <div class="card mb-4">
                <div class="card-body">
                  <h2 class="card-title mb-3">${fullName}</h2>
                  <p class="text-muted mb-2"><strong>Role:</strong> ${user.role_name || 'Customer'}</p>
                  <p class="mb-2"><strong>Email:</strong> ${user.email || 'N/A'}</p>
                  ${isOwnerOrAgency ? `<a href="dashboard.html" class="btn btn-primary mt-3">Go to Dashboard</a>` : ''}
                </div>
              </div>
              
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title mb-3">${isOwnerOrAgency ? 'Dashboard Summary' : 'Bookings Summary'}</h5>
                  <div class="mb-2">
                    <strong>Total:</strong> <span class="badge bg-primary">${bookings.total || 0}</span>
                  </div>
                  <div class="mb-2">
                    <strong>Confirmed:</strong> <span class="badge bg-success">${bookings.confirmed || 0}</span>
                  </div>
                  <div class="mb-2">
                    <strong>Cancelled:</strong> <span class="badge bg-danger">${bookings.cancelled || 0}</span>
                  </div>
                  <div class="mb-2">
                    <strong>Completed:</strong> <span class="badge bg-secondary">${bookings.completed || 0}</span>
                  </div>
                  <div class="mb-3 pt-2 border-top">
                    <strong>${isOwnerOrAgency ? 'Total Revenue' : 'Total Spent'}:</strong> <span class="price">${formatPrice(isOwnerOrAgency ? (bookings.total_revenue || 0) : (bookings.total_spent || 0))}</span>
                  </div>
                  ${!isOwnerOrAgency ? '<a href="bookings.html" class="btn btn-outline-primary w-100">View All Bookings</a>' : ''}
                </div>
              </div>
            </div>
            
            <div class="col-md-8">
              ${isOwnerOrAgency ? `
                <div class="mb-5">
                  <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">My Content</h3>
                    <button class="btn btn-primary" onclick="createPosting()">
                      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 4px;">
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                      </svg>
                      Create Posting
                    </button>
                  </div>
                  
                  ${data.all?.hotels && data.all.hotels.length > 0 ? `
                    <div class="mb-4">
                      <h5 class="mb-3">Hotels</h5>
                      <div class="list-group">
                        ${data.all.hotels.map(item => renderContentListItem(item, 'hotel')).join('')}
                      </div>
                    </div>
                  ` : ''}
                  
                  ${data.all?.activities && data.all.activities.length > 0 ? `
                    <div class="mb-4">
                      <h5 class="mb-3">Activities</h5>
                      <div class="list-group">
                        ${data.all.activities.map(item => renderContentListItem(item, 'activity')).join('')}
                      </div>
                    </div>
                  ` : ''}
                  
                  ${data.all?.flights && data.all.flights.length > 0 ? `
                    <div class="mb-4">
                      <h5 class="mb-3">Flights</h5>
                      <div class="list-group">
                        ${data.all.flights.map(item => renderContentListItem(item, 'flight')).join('')}
                      </div>
                    </div>
                  ` : ''}
                  
                  ${data.all?.transfers && data.all.transfers.length > 0 ? `
                    <div class="mb-4">
                      <h5 class="mb-3">Transfers</h5>
                      <div class="list-group">
                        ${data.all.transfers.map(item => renderContentListItem(item, 'transfer')).join('')}
                      </div>
                    </div>
                  ` : ''}
                  
                  ${(!data.all?.hotels || data.all.hotels.length === 0) && 
                    (!data.all?.flights || data.all.flights.length === 0) &&
                    (!data.all?.activities || data.all.activities.length === 0) &&
                    (!data.all?.transfers || data.all.transfers.length === 0)
                    ? '<p class="text-muted">You haven\'t created any content yet. Click "Create Posting" to get started!</p>' : ''}
                </div>
              ` : `
                <div class="card mb-4">
                  <div class="card-body">
                    <h5 class="card-title mb-3">Recent Bookings</h5>
                    ${bookings.recent && bookings.recent.length > 0 
                      ? bookings.recent.map((booking, index) => renderRecentBookingItem(booking, index)).join('')
                      : '<p class="text-muted mb-0">No recent bookings.</p>'}
                    ${bookings.recent && bookings.recent.length === 0 
                      ? '<a href="index.html" class="btn btn-primary w-100 mt-3">Start Booking!</a>'
                      : ''}
                  </div>
                </div>
                
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title mb-3">Browse More</h5>
                    <div class="d-grid gap-2">
                      <a href="hotels.html" class="btn btn-outline-primary">Hotels</a>
                      <a href="flights.html" class="btn btn-outline-primary">Flights</a>
                      <a href="activities.html" class="btn btn-outline-primary">Activities</a>
                      <a href="transfers.html" class="btn btn-outline-primary">Transfers</a>
                    </div>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Error loading profile:', error);
        setStatus('status', 'error', error.message || 'Failed to load profile. Please try again later.');
        document.getElementById('profileContent').innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();
    });
  </script>
</body>
</html>
