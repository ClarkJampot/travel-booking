<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <div id="profileContent">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    function renderContentCard(item, type) {
      const detailPage = {
        'hotel': 'hotel-details.html',
        'flight': 'flight-details.html',
        'activity': 'activity-details.html',
        'transfer': 'transfer-details.html'
      }[type] || '#';
      
      const priceField = type === 'hotel' ? 'price_per_night' : 'price';
      const priceLabel = type === 'hotel' ? '/night' : '';
      const nameField = type === 'activity' ? 'title' : (type === 'flight' ? 'airline' : (type === 'transfer' ? 'service' : 'name'));
      
      const priceDisplay = item.discount_percent > 0 
        ? `<div class="price-container">
            <span class="original-price">${formatPrice(item[priceField])}</span>
            <span class="discounted-price">${formatPrice(item.discounted_price || item[priceField] * (1 - item.discount_percent / 100))}</span>
            ${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}
          </div>`
        : `<p class="price">${formatPrice(item[priceField])}${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}</p>`;
      
      return `
        <div class="col-md-4 mb-4">
          <div class="card h-100 ${isPromoted(item.ad) ? 'promoted-item' : ''}">
            <div class="card-img-wrapper">
              <img src="${normalizeImageUrl(item.image_url)}" class="card-img-top" alt="${item[nameField]}" loading="lazy">
              ${item.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(item.discount_percent)}% OFF</div>` : ''}
              ${isPromoted(item.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
              <div class="card-overlay">
                <a href="${detailPage}?id=${item.id}" class="btn btn-primary btn-lg">View Details</a>
              </div>
            </div>
            <div class="card-body">
              <h5 class="card-title">${item[nameField]}</h5>
              ${item.city_name ? `<p class="card-text text-muted">${item.city_name}${item.province_name ? ', ' + item.province_name : ''}</p>` : ''}
              ${item.depart_date ? `<p class="text-muted">${formatDate(item.depart_date)}</p>` : ''}
              ${item.date ? `<p class="text-muted">${formatDate(item.date)}</p>` : ''}
              ${item.origin && item.destination ? `<p class="text-muted">${item.origin_city_name || item.origin} → ${item.destination_city_name || item.destination}</p>` : ''}
              ${priceDisplay}
            </div>
          </div>
        </div>
      `;
    }

    function renderContentSection(title, items, type) {
      if (!items || items.length === 0) return '';
      
      return `
        <div class="mb-5">
          <h3 class="mb-4">${title}</h3>
          <div class="row g-4">
            ${items.map(item => renderContentCard(item, type)).join('')}
          </div>
        </div>
      `;
    }

    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('user_id');
      
      if (!userId) {
        document.getElementById('profileContent').innerHTML = '<p class="text-danger">User ID is required.</p>';
        return;
      }
      
      try {
        const data = await apiCall(`/profile?user_id=${userId}`);
        const container = document.getElementById('profileContent');
        
        if (!data || !data.user) {
          container.innerHTML = '<p class="text-danger">User not found.</p>';
          return;
        }
        
        const user = data.user;
        container.innerHTML = `
          <div class="profile-header mb-5">
            <h1>${user.full_name}</h1>
            <p class="text-muted">${user.role_name || 'User'}</p>
            ${user.email ? `<p><strong>Email:</strong> ${user.email}</p>` : ''}
            ${user.phone ? `<p><strong>Phone:</strong> ${user.phone}</p>` : ''}
            ${user.address ? `<p><strong>Address:</strong> ${user.address}</p>` : ''}
          </div>
          
          ${renderContentSection('Promoted Items', [
            ...(data.promoted.hotels || []),
            ...(data.promoted.flights || [])
          ], 'mixed')}
          
          <hr class="my-5">
          
          <h2 class="mb-4">All Content</h2>
          
          ${data.all.hotels && data.all.hotels.length > 0 ? renderContentSection('Hotels', data.all.hotels, 'hotel') : ''}
          ${data.all.flights && data.all.flights.length > 0 ? renderContentSection('Flights', data.all.flights, 'flight') : ''}
          
          ${(!data.all.hotels || data.all.hotels.length === 0) && 
            (!data.all.flights || data.all.flights.length === 0) 
            ? '<p class="text-muted">Currently no content available.</p>' : ''}
        `;
      } catch (error) {
        console.error('Error loading profile:', error);
        document.getElementById('profileContent').innerHTML = '<p class="text-danger">Failed to load profile. Please try again later.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();
    });
  </script>
</body>
</html>
