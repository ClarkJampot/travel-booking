<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <div id="status"></div>
    <div id="profileContent" class="reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication
    if (!isAuthenticated()) {
      alert('Please log in to view your profile.');
      window.location.href = 'login.html';
    }

    function renderContentCard(item, type) {
      const detailPage = {
        'hotel': 'hotel-details.html',
        'flight': 'flight-details.html',
        'activity': 'activity-details.html',
        'transfer': 'transfer-details.html'
      }[type] || '#';
      
      const priceField = type === 'hotel' ? 'price_per_night' : 'price';
      const priceLabel = type === 'hotel' ? '/night' : '';
      const nameField = type === 'activity' ? 'title' : (type === 'flight' ? 'airline' : (type === 'transfer' ? 'service' : 'name'));
      
      const priceDisplay = item.discount_percent > 0 
        ? `<div class="price-container">
            <span class="original-price">${formatPrice(item[priceField])}</span>
            <span class="discounted-price">${formatPrice(item.discounted_price || item[priceField] * (1 - item.discount_percent / 100))}</span>
            ${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}
          </div>`
        : `<p class="price">${formatPrice(item[priceField])}${priceLabel ? `<span class="price-small">${priceLabel}</span>` : ''}</p>`;
      
      return `
        <div class="col-md-4 mb-4">
          <div class="card h-100 ${isPromoted(item.ad) ? 'promoted-item' : ''}">
            <div class="card-img-wrapper">
              <img src="${normalizeImageUrl(item.image_url)}" class="card-img-top" alt="${item[nameField]}" loading="lazy">
              ${item.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(item.discount_percent)}% OFF</div>` : ''}
              ${isPromoted(item.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
              <div class="card-overlay">
                <a href="${detailPage}?id=${item.id}" class="btn btn-primary btn-lg">View Details</a>
              </div>
            </div>
            <div class="card-body">
              <h5 class="card-title">${item[nameField]}</h5>
              ${item.city_name ? `<p class="card-text text-muted">${item.city_name}${item.province_name ? ', ' + item.province_name : ''}</p>` : ''}
              ${item.depart_date ? `<p class="text-muted">${formatDate(item.depart_date)}</p>` : ''}
              ${item.date ? `<p class="text-muted">${formatDate(item.date)}</p>` : ''}
              ${item.origin && item.destination ? `<p class="text-muted">${item.origin_city_name || item.origin} → ${item.destination_city_name || item.destination}</p>` : ''}
              ${priceDisplay}
            </div>
          </div>
        </div>
      `;
    }

    function renderContentSection(title, items, type) {
      if (!items || items.length === 0) return '';
      
      return `
        <div class="mb-5">
          <h3 class="mb-4">${title}</h3>
          <div class="row g-4">
            ${items.map(item => renderContentCard(item, type)).join('')}
          </div>
        </div>
      `;
    }

    async function loadProfile() {
      showLoading('profileContent');
      clearStatus('status');
      
      try {
        const data = await apiCall('/profile');
        const container = document.getElementById('profileContent');
        
        if (!data || !data.user) {
          container.innerHTML = '<p class="text-danger">User not found.</p>';
          return;
        }
        
        const user = data.user;
        const bookings = data.bookings || { total: 0, confirmed: 0, cancelled: 0, completed: 0, recent: [] };
        const userRole = user.role_name || 'customer';
        const isOwnerOrAgency = userRole === 'owner' || userRole === 'agency';
        
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.first_name;
        
        container.innerHTML = `
          <div class="row">
            <div class="col-md-4">
              <div class="card mb-4">
                <div class="card-body">
                  <h2 class="card-title mb-3">${fullName}</h2>
                  <p class="text-muted mb-2"><strong>Role:</strong> ${user.role_name || 'Customer'}</p>
                  <p class="mb-2"><strong>Email:</strong> ${user.email || 'N/A'}</p>
                  ${isOwnerOrAgency ? `<a href="dashboard.html" class="btn btn-primary mt-3">Go to Dashboard</a>` : ''}
                </div>
              </div>
              
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title mb-3">Bookings Summary</h5>
                  <div class="mb-2">
                    <strong>Total:</strong> <span class="badge bg-primary">${bookings.total || 0}</span>
                  </div>
                  <div class="mb-2">
                    <strong>Confirmed:</strong> <span class="badge bg-success">${bookings.confirmed || 0}</span>
                  </div>
                  <div class="mb-2">
                    <strong>Cancelled:</strong> <span class="badge bg-danger">${bookings.cancelled || 0}</span>
                  </div>
                  <div class="mb-3">
                    <strong>Completed:</strong> <span class="badge bg-secondary">${bookings.completed || 0}</span>
                  </div>
                  <a href="bookings.html" class="btn btn-outline-primary w-100">View All Bookings</a>
                </div>
              </div>
            </div>
            
            <div class="col-md-8">
              ${isOwnerOrAgency ? `
                <div class="mb-5">
                  <h3 class="mb-4">My Content</h3>
                  ${renderContentSection('Promoted Items', [
                    ...(data.promoted?.hotels || []),
                    ...(data.promoted?.flights || []),
                    ...(data.promoted?.activities || []),
                    ...(data.promoted?.transfers || [])
                  ], 'mixed')}
                  
                  <hr class="my-5">
                  
                  ${data.all?.hotels && data.all.hotels.length > 0 ? renderContentSection('Hotels', data.all.hotels, 'hotel') : ''}
                  ${data.all?.flights && data.all.flights.length > 0 ? renderContentSection('Flights', data.all.flights, 'flight') : ''}
                  ${data.all?.activities && data.all.activities.length > 0 ? renderContentSection('Activities', data.all.activities, 'activity') : ''}
                  ${data.all?.transfers && data.all.transfers.length > 0 ? renderContentSection('Transfers', data.all.transfers, 'transfer') : ''}
                  
                  ${(!data.all?.hotels || data.all.hotels.length === 0) && 
                    (!data.all?.flights || data.all.flights.length === 0) &&
                    (!data.all?.activities || data.all.activities.length === 0) &&
                    (!data.all?.transfers || data.all.transfers.length === 0)
                    ? '<p class="text-muted">You haven\'t created any content yet.</p>' : ''}
                </div>
              ` : `
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title">Welcome to your profile!</h5>
                    <p class="card-text">Manage your bookings and account information from here.</p>
                    <a href="bookings.html" class="btn btn-primary">View My Bookings</a>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Error loading profile:', error);
        setStatus('status', 'error', error.message || 'Failed to load profile. Please try again later.');
        document.getElementById('profileContent').innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();
    });
  </script>
</body>
</html>
