<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <h1 class="mb-4 reveal">My Profile</h1>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card reveal">
          <div class="card-body">
            <h5 class="card-title mb-4 fade-in-up">Profile Information</h5>
            <form id="profileForm">
              <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" disabled>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="phone" name="phone">
              </div>
              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3"></textarea>
              </div>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());

    // Check authentication
    if (!isAuthenticated()) {
      window.location.href = 'login.html';
    }

    // Load user profile
    async function loadProfile() {
      try {
        const user = await getCurrentUserFromAPI();
        if (user) {
          document.getElementById('full_name').value = user.full_name || '';
          document.getElementById('email').value = user.email || '';
          document.getElementById('phone').value = user.phone || '';
          document.getElementById('address').value = user.address || '';
        }
      } catch (error) {
        console.error('Error loading profile:', error);
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      clearStatus('status');
      
      const full_name = document.getElementById('full_name').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      
      try {
        // Note: Profile update endpoint would need to be implemented
        showSuccessToast('Profile updated successfully');
      } catch (error) {
        showError('status', error.message || 'Failed to update profile');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();
    });
  </script>
</body>
</html>
