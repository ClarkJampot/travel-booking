<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Destinations</h1>
    
    <!-- Filters -->
    <div id="destinationsFilter"></div>

    <!-- Results -->
    <div id="status"></div>
    
    <!-- Destinations -->
    <div id="destinations" class="row g-4 reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5 loading-more-container"></div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
    <script src="js/utils/formatters.js"></script>
    <script src="js/utils/api.js"></script>
    <script src="js/utils/urlHelpers.js"></script>
    <script src="js/utils/componentLoader.js"></script>
    <script src="js/utils/uiHelpers.js"></script>
    <script src="js/utils/renderers.js"></script>
    <script src="js/utils/authHelpers.js"></script>
    <script src="js/utils/locationHelpers.js"></script>
    <script src="js/utils/animations.js"></script>
    <script src="js/components/Image.js"></script>
    <script src="js/components/Price.js"></script>
    <script src="js/components/Badge.js"></script>
    <script src="js/components/EmptyState.js"></script>
    <script src="js/components/Card.js"></script>
    <script src="js/components/Filter.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');

    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    

    const filter = new Filter('destinationsFilter', {
      keywordPlaceholder: 'Search destinations...',
      showPriceRange: false,
      onFilter: (values) => {
        updateURLWithFilters();
        loadDestinations(true);
      },
      onClear: () => {
        updateURLWithFilters();
        loadDestinations(true);
      }
    });

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        province_id: params.get('province_id') || '',
        city_id: params.get('city_id') || '',
        q: params.get('q') || ''
      };
    }

    function updateURLWithFilters() {
      const values = filter.getValues();
      const params = new URLSearchParams();
      if (values.province_id) params.set('province_id', values.province_id);
      if (values.city_id) params.set('city_id', values.city_id);
      if (values.q) params.set('q', values.q);
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }

    async function loadDestinations(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('destinations');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-md-4', true, 2);
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'none';
      }
      
      clearStatus('status');
      const urlParams = getUrlParams();
      const filterValues = filter.getValues();
      
      if (urlParams.province_id) {
        const provinceSelect = document.getElementById('destinationsFilter-province');
        if (provinceSelect) {
          provinceSelect.value = urlParams.province_id;
          const citySelect = document.getElementById('destinationsFilter-city');
          if (citySelect && provinceSelect.value) {
            citySelect.disabled = false;
            await loadCitiesForProvince(provinceSelect.value, citySelect);
          }
        }
      }
      if (urlParams.city_id) {
        if (!urlParams.province_id) {
          try {
            const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
            if (cityData.city && cityData.city.province_id) {
              const provinceSelect = document.getElementById('destinationsFilter-province');
              if (provinceSelect) {
                provinceSelect.value = cityData.city.province_id;
                const citySelect = document.getElementById('destinationsFilter-city');
                if (citySelect) {
                  citySelect.disabled = false;
                  await loadCitiesForProvince(cityData.city.province_id, citySelect);
                }
              }
            }
          } catch (e) {
            console.error('Error loading city:', e);
          }
        }
        const citySelect = document.getElementById('destinationsFilter-city');
        if (citySelect) citySelect.value = urlParams.city_id;
      }
      const keywordEl = document.getElementById('destinationsFilter-keyword');
      if (urlParams.q && keywordEl) keywordEl.value = urlParams.q;
      
      try {
        let url = `/destinations?limit=${limit}&page=${currentPage}`;
        if (filterValues.province_id) url += `&province_id=${filterValues.province_id}`;
        if (filterValues.city_id) url += `&city_id=${filterValues.city_id}`;
        if (filterValues.q) url += `&q=${encodeURIComponent(filterValues.q)}`;
        
        const data = await apiCall(url);
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            container.innerHTML = renderEmptyState({ message: 'Currently no destinations available.' });
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        hasMore = data.results.length >= limit;
        if (reset || currentPage === 1) {
          container.innerHTML = '';
        }
        const destinationsHtml = data.results.map((dest, index) => renderDestinationCard(dest, index)).join('');
        
        container.insertAdjacentHTML('beforeend', destinationsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load destinations');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadDestinations();
          }
        }, 100);
      });
    }

    window.addEventListener('popstate', function() {
      loadDestinations(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      filter.render();
      
      // Restore filter values from URL parameters
      const urlParams = getUrlParams();
      if (urlParams.city_id && !urlParams.province_id) {
        // If city_id is provided without province_id, fetch province from city
        try {
          const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
          if (cityData.city && cityData.city.province_id) {
            urlParams.province_id = cityData.city.province_id;
          }
        } catch (e) {
          console.error('Error loading city:', e);
        }
      }
      
      // Use setValues for consistent restoration
      if (urlParams.province_id || urlParams.city_id || urlParams.q) {
        filter.setValues({
          province_id: urlParams.province_id,
          city_id: urlParams.city_id,
          q: urlParams.q
        });
      }
      
      setupInfiniteScroll();
      loadDestinations(true);
    });
  </script>
</body>
</html>
