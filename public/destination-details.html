<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="destinationDetails"></div>
    <div class="row mt-4 mb-4">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h3 id="destName"></h3>
            <p id="destDescription"></p>
          </div>
        </div>
        <div class="mt-4">
          <h4>Hotels in this Destination</h4>
          <div id="hotels" class="row g-4"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    loadLayout();
    const urlParams = new URLSearchParams(window.location.search);
    const destId = urlParams.get('id');
    async function loadDestination() {
      try {
        const data = await apiCall(`/destinations?id=${destId}`);
        const dest = data.destination;
        document.getElementById('destName').textContent = dest.name;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(dest.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${dest.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(dest.discount_percent)}% OFF</span>` : ''}
        `;
        if (dest.ad || dest.discount_percent > 0) {
          document.getElementById('destName').insertAdjacentHTML('afterend', badgeHTML);
        }
        
        document.getElementById('destDescription').textContent = dest.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(dest.image_url, dest.images || []);
        document.getElementById('destinationDetails').innerHTML = createImageCarousel(allImages, 'destinationCarousel', dest.name);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('destinationCarousel');
          if (carouselEl && allImages.length > 1) {
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('destinationCarousel', event.to);
            });
          }
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
        const hotelsData = await apiCall(`/hotels?destination_id=${destId}&limit=6`);
        const allHotels = [...(hotelsData.promoted || []), ...(hotelsData.results || [])];
        document.getElementById('hotels').innerHTML = allHotels.length === 0 ? '<p class="text-muted">Currently no hotels available.</p>' : allHotels.map(h => `
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${normalizeImageUrl(h.image_url)}" class="card-img-top" alt="${h.name}" loading="lazy">
                <div class="card-overlay">
                  <a href="hotel-details.html?id=${h.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${h.name}</h5>
                <p class="price">${formatPrice(h.price_per_night)}<span class="price-small"> /night</span></p>
              </div>
            </div>
          </div>`).join('');
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load destination');
      }
    }
    if (destId) loadDestination();
    else setStatus('status', 'error', 'Destination ID not provided');
  </script>
</body>
</html>
