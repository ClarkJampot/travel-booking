<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotels - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Hotels</h1>
    
    <!-- Filters -->
    <div class="filter-section">
      <div class="row">
        <div class="col-md-2">
          <label for="provinceFilter" class="form-label">Province</label>
          <select class="form-control" id="provinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="cityFilter" class="form-label">City</label>
          <select class="form-control" id="cityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="keywordFilter" class="form-label">Keyword Search</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search hotels...">
        </div>
        <div class="col-md-2">
          <label for="minPrice" class="form-label">Min Price</label>
          <input type="number" class="form-control" id="minPrice" placeholder="Min">
        </div>
        <div class="col-md-2">
          <label for="maxPrice" class="form-label">Max Price</label>
          <input type="number" class="form-control" id="maxPrice" placeholder="Max">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Filter</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="status"></div>
    
    <!-- Promoted Hotels Section -->
    <div id="promotedHotels" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Hotels</h3>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Hotels -->
    <div id="hotels" class="row g-4 reveal">
      <!-- Loaded dynamically -->
    </div>
    
    <!-- Pagination -->
    <nav aria-label="Hotels pagination" id="paginationNav" style="display: none;">
      <ul class="pagination justify-content-center mt-4">
        <li class="page-item" id="prevPageItem">
          <a class="page-link" href="#" id="prevPageLink">Previous</a>
        </li>
        <li class="page-item" id="pageNumbers">
          <!-- Page numbers loaded dynamically -->
        </li>
        <li class="page-item" id="nextPageItem">
          <a class="page-link" href="#" id="nextPageLink">Next</a>
        </li>
      </ul>
    </nav>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());

    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const provinceSelect = document.getElementById('provinceFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(province => {
            const option = document.createElement('option');
            option.value = province.id;
            option.textContent = province.name;
            provinceSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }

    // Read URL search parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        province_id: params.get('province_id') || '',
        city_id: params.get('city_id') || '',
        minPrice: params.get('minPrice') || '',
        maxPrice: params.get('maxPrice') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    // Update URL with current filter values
    function updateURLWithFilters(page = 1) {
      const params = new URLSearchParams();
      const provinceId = document.getElementById('provinceFilter').value;
      const cityId = document.getElementById('cityFilter').value;
      const keyword = document.getElementById('keywordFilter').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (provinceId) params.set('province_id', provinceId);
      if (cityId) params.set('city_id', cityId);
      if (keyword) params.set('q', keyword);
      if (minPrice) params.set('minPrice', minPrice);
      if (maxPrice) params.set('maxPrice', maxPrice);
      if (page > 1) params.set('page', page);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }

    async function loadHotels() {
      showLoading('hotels');
      clearStatus('status');
      
      const urlParams = getUrlParams();
      
      // Pre-fill filter inputs from URL
      if (urlParams.province_id) {
        document.getElementById('provinceFilter').value = urlParams.province_id;
        // Trigger city dropdown update
        const provinceSelect = document.getElementById('provinceFilter');
        const citySelect = document.getElementById('cityFilter');
        if (provinceSelect.value) {
          citySelect.disabled = false;
          await loadCitiesForProvince(provinceSelect.value, citySelect);
        }
      }
      if (urlParams.city_id) {
        // If city_id is provided but no province_id, fetch city to get province
        if (!urlParams.province_id) {
          try {
            const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
            if (cityData.city && cityData.city.province_id) {
              document.getElementById('provinceFilter').value = cityData.city.province_id;
              const citySelect = document.getElementById('cityFilter');
              citySelect.disabled = false;
              await loadCitiesForProvince(cityData.city.province_id, citySelect);
            }
          } catch (e) {
            console.error('Error loading city:', e);
          }
        }
        document.getElementById('cityFilter').value = urlParams.city_id;
      }
      if (urlParams.minPrice) document.getElementById('minPrice').value = urlParams.minPrice;
      if (urlParams.maxPrice) document.getElementById('maxPrice').value = urlParams.maxPrice;
      if (urlParams.q) document.getElementById('keywordFilter').value = urlParams.q;
      
      try {
        const currentPage = urlParams.page || 1;
        const limit = 12; // Items per page
        let url = `/hotels?limit=${limit}&page=${currentPage}`;
        if (urlParams.province_id) url += `&province_id=${urlParams.province_id}`;
        if (urlParams.city_id) url += `&city_id=${urlParams.city_id}`;
        if (urlParams.minPrice) url += `&minPrice=${urlParams.minPrice}`;
        if (urlParams.maxPrice) url += `&maxPrice=${urlParams.maxPrice}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('hotels');
        const promotedContainer = document.getElementById('promotedHotels');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted hotels
        if (data.promoted && data.promoted.length > 0) {
          promotedContainer.style.display = 'block';
          promotedRow.innerHTML = data.promoted.map((hotel, index) => {
            const priceDisplay = hotel.discount_percent > 0 
              ? `<div class="price-container">
                  <span class="original-price">${formatPrice(hotel.price_per_night)}</span>
                  <span class="discounted-price">${formatPrice(hotel.discounted_price || hotel.price_per_night * (1 - hotel.discount_percent / 100))}</span>
                  <span class="price-small"> /night</span>
                </div>`
              : `<p class="price">${formatPrice(hotel.price_per_night)}<span class="price-small"> /night</span></p>`;
            
            return `
              <div class="col-md-6 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
                <div class="card h-100 promoted-item">
                  <div class="card-img-wrapper">
                    <img src="${normalizeImageUrl(hotel.image_url)}" class="card-img-top" alt="${hotel.name}" loading="lazy">
                    ${hotel.discount_percent > 0 ? `<div class="discount-badge">${hotel.discount_percent}% OFF</div>` : ''}
                    <div class="card-overlay">
                      <a href="hotel-details.html?id=${hotel.id}" class="btn btn-primary btn-lg">View Details</a>
                    </div>
                  </div>
                  <div class="card-body">
                    <h5 class="card-title">${hotel.name}</h5>
                    <p class="card-text text-muted">${hotel.city_name || ''}${hotel.province_name ? ', ' + hotel.province_name : ''}</p>
                    ${priceDisplay}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          promotedContainer.style.display = 'none';
        }
        
        // Display regular hotels
        if (!data || !data.results || data.results.length === 0) {
          if (!data.promoted || data.promoted.length === 0) {
            container.innerHTML = '<p class="text-muted">No hotels found.</p>';
          } else {
            container.innerHTML = '';
          }
          return;
        }
        
        container.innerHTML = data.results.map((hotel, index) => {
          const priceDisplay = hotel.discount_percent > 0 
            ? `<div class="price-container">
                <span class="original-price">${formatPrice(hotel.price_per_night)}</span>
                <span class="discounted-price">${formatPrice(hotel.discounted_price || hotel.price_per_night * (1 - hotel.discount_percent / 100))}</span>
                <span class="price-small"> /night</span>
              </div>`
            : `<p class="price">${formatPrice(hotel.price_per_night)}<span class="price-small"> /night</span></p>`;
          
          return `
            <div class="col-md-4 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
              <div class="card h-100">
                <div class="card-img-wrapper">
                  <img src="${normalizeImageUrl(hotel.image_url)}" class="card-img-top" alt="${hotel.name}" loading="lazy">
                  ${hotel.discount_percent > 0 ? `<div class="discount-badge">${hotel.discount_percent}% OFF</div>` : ''}
                  ${hotel.ad ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                  <div class="card-overlay">
                    <a href="hotel-details.html?id=${hotel.id}" class="btn btn-primary btn-lg">View Details</a>
                  </div>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${hotel.name}</h5>
                  <p class="card-text text-muted">${hotel.city_name || ''}${hotel.province_name ? ', ' + hotel.province_name : ''}</p>
                  ${priceDisplay}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        // Update pagination
        updatePagination(currentPage, limit, data.results ? data.results.length : 0);
      } catch (error) {
        showError('status', error.message || 'Failed to load hotels');
        document.getElementById('hotels').innerHTML = '';
        document.getElementById('paginationNav').style.display = 'none';
      }
    }
    
    function updatePagination(currentPage, limit, itemCount) {
      const paginationNav = document.getElementById('paginationNav');
      const pageNumbers = document.getElementById('pageNumbers');
      const prevPageItem = document.getElementById('prevPageItem');
      const nextPageItem = document.getElementById('nextPageItem');
      
      // Hide pagination if no items or only one page
      if (itemCount < limit && currentPage === 1) {
        paginationNav.style.display = 'none';
        return;
      }
      
      paginationNav.style.display = 'block';
      
      // Previous button
      if (currentPage > 1) {
        prevPageItem.classList.remove('disabled');
        document.getElementById('prevPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage - 1);
          loadHotels();
        };
      } else {
        prevPageItem.classList.add('disabled');
        document.getElementById('prevPageLink').onclick = (e) => e.preventDefault();
      }
      
      // Next button (show if we got a full page of results)
      if (itemCount >= limit) {
        nextPageItem.classList.remove('disabled');
        document.getElementById('nextPageLink').onclick = (e) => {
          e.preventDefault();
          updateURLWithFilters(currentPage + 1);
          loadHotels();
        };
      } else {
        nextPageItem.classList.add('disabled');
        document.getElementById('nextPageLink').onclick = (e) => e.preventDefault();
      }
      
      // Page numbers (show current and adjacent pages)
      let pageNumbersHtml = '';
      const maxPages = 5;
      let startPage = Math.max(1, currentPage - 2);
      // Only show pages up to current page if no more items, otherwise show up to maxPages
      let endPage = itemCount >= limit ? Math.min(startPage + maxPages - 1, currentPage + 2) : currentPage;
      
      for (let i = startPage; i <= endPage; i++) {
        const isActive = i === currentPage;
        pageNumbersHtml += `
          <li class="page-item ${isActive ? 'active' : ''}">
            <a class="page-link" href="#" onclick="event.preventDefault(); updateURLWithFilters(${i}); loadHotels();">${i}</a>
          </li>
        `;
      }
      
      pageNumbers.innerHTML = pageNumbersHtml;
    }

    // Handle filter button click
    function handleFilterClick() {
      updateURLWithFilters(1); // Reset to page 1 when filtering
      loadHotels();
    }

    // Listen for back/forward buttons
    window.addEventListener('popstate', function() {
      loadHotels();
    });

    document.addEventListener('DOMContentLoaded', async function() {
      await loadProvinces();
      initCascadingCityDropdown('provinceFilter', 'cityFilter');
      loadHotels();
    });
  </script>
</body>
</html>
