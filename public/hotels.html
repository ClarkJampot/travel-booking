<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotels - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Hotels</h1>
    
    <!-- Filters -->
    <div class="filter-section">
      <div class="row">
        <div class="col-md-2">
          <label for="provinceFilter" class="form-label">Province</label>
          <select class="form-control" id="provinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="cityFilter" class="form-label">City</label>
          <select class="form-control" id="cityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="keywordFilter" class="form-label">Keyword Search</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search hotels...">
        </div>
        <div class="col-md-2">
          <label for="minPrice" class="form-label">Min Price</label>
          <input type="number" class="form-control" id="minPrice" placeholder="Min" min="0" step="1" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="col-md-2">
          <label for="maxPrice" class="form-label">Max Price</label>
          <input type="number" class="form-control" id="maxPrice" placeholder="Max" min="0" step="1" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Filter</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="status"></div>
    
    <!-- Promoted Hotels Section -->
    <div id="promotedHotels" class="promoted-section mb-4" style="display: none;">
      <div id="promotedHotelsHeader"></div>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Hotels -->
    <div id="hotels" class="row g-4 reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;"></div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');

    // Infinite scroll variables
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;

    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const provinceSelect = document.getElementById('provinceFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(province => {
            const option = document.createElement('option');
            option.value = province.id;
            option.textContent = province.name;
            provinceSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }

    // Read URL search parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        province_id: params.get('province_id') || '',
        city_id: params.get('city_id') || '',
        minPrice: params.get('minPrice') || '',
        maxPrice: params.get('maxPrice') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    // Update URL with current filter values
    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const provinceId = document.getElementById('provinceFilter').value;
      const cityId = document.getElementById('cityFilter').value;
      const keyword = document.getElementById('keywordFilter').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (provinceId) params.set('province_id', provinceId);
      if (cityId) params.set('city_id', cityId);
      if (keyword) params.set('q', keyword);
      if (minPrice) params.set('minPrice', minPrice);
      if (maxPrice) params.set('maxPrice', maxPrice);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }

    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }

    async function loadHotels(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('hotels');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-md-4', true, 3);
        const promotedContainer = document.getElementById('promotedHotels');
        const promotedRow = promotedContainer.querySelector('.row');
        if (promotedRow) promotedRow.innerHTML = '';
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'none';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/hotels?limit=${limit}&page=${currentPage}`;
        if (urlParams.province_id) url += `&province_id=${urlParams.province_id}`;
        if (urlParams.city_id) url += `&city_id=${urlParams.city_id}`;
        if (urlParams.minPrice) url += `&minPrice=${urlParams.minPrice}`;
        if (urlParams.maxPrice) url += `&maxPrice=${urlParams.maxPrice}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        
        const data = await apiCall(url);
        const promotedContainer = document.getElementById('promotedHotels');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted hotels (only on first page/reset)
        if (reset || currentPage === 1) {
          container.innerHTML = '';
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const header = document.getElementById('promotedHotelsHeader');
            header.innerHTML = renderSectionHeader({ title: 'Promoted Hotels' });
            promotedRow.innerHTML = data.promoted.slice(0, 2).map((hotel, index) => {
              const card = renderHotelCard(hotel, index, 0, 'col-md-6');
              // Add promoted styling hook
              return card.replace('card h-100', 'card h-100 promoted-item');
            }).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular hotels
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            if (!data.promoted || data.promoted.length === 0) {
              container.innerHTML = renderEmptyState({ message: 'Currently no hotels available.', ctaText: 'Register as owner', ctaHref: 'register.html' });
            } else {
              container.innerHTML = '';
            }
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items
        hasMore = data.results.length >= limit;
        
        // Append hotels to container
        const existingCount = container.querySelectorAll('.col-md-4').length;
        const hotelsHtml = data.results.map((hotel, index) => renderHotelCard(hotel, index, existingCount)).join('');
        
        container.insertAdjacentHTML('beforeend', hotelsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load hotels');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadHotels();
          }
        }, 100);
      });
    }

    // Handle filter button click
    function handleFilterClick() {
      updateURLWithFilters();
      loadHotels(true);
    }

    window.addEventListener('popstate', function() {
      loadHotels(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      await loadProvinces();
      initCascadingCityDropdown('provinceFilter', 'cityFilter');
      enforceIntegerInput('minPrice');
      enforceIntegerInput('maxPrice');
      
      // Pre-fill filter inputs from URL
      const urlParams = getUrlParams();
      if (urlParams.province_id) {
        document.getElementById('provinceFilter').value = urlParams.province_id;
        const provinceSelect = document.getElementById('provinceFilter');
        const citySelect = document.getElementById('cityFilter');
        if (provinceSelect.value) {
          citySelect.disabled = false;
          await loadCitiesForProvince(provinceSelect.value, citySelect);
        }
      }
      if (urlParams.city_id) {
        if (!urlParams.province_id) {
          try {
            const cityData = await apiCall(`/cities?id=${urlParams.city_id}`);
            if (cityData.city && cityData.city.province_id) {
              document.getElementById('provinceFilter').value = cityData.city.province_id;
              const citySelect = document.getElementById('cityFilter');
              citySelect.disabled = false;
              await loadCitiesForProvince(cityData.city.province_id, citySelect);
            }
          } catch (e) {
            console.error('Error loading city:', e);
          }
        }
        document.getElementById('cityFilter').value = urlParams.city_id;
      }
      if (urlParams.minPrice) document.getElementById('minPrice').value = urlParams.minPrice;
      if (urlParams.maxPrice) document.getElementById('maxPrice').value = urlParams.maxPrice;
      if (urlParams.q) document.getElementById('keywordFilter').value = urlParams.q;
      
      setupInfiniteScroll();
      loadHotels(true);
    });
  </script>
</body>
</html>
