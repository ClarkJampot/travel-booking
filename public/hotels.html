<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotels - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <h1 class="mb-4">Hotels</h1>
    
    <!-- Filters -->
    <div class="filter-section">
      <div class="row">
        <div class="col-md-3">
          <label for="cityFilter" class="form-label">City</label>
          <input type="text" class="form-control" id="cityFilter" placeholder="City">
        </div>
        <div class="col-md-3">
          <label for="countryFilter" class="form-label">Country</label>
          <input type="text" class="form-control" id="countryFilter" placeholder="Country">
        </div>
        <div class="col-md-2">
          <label for="minPrice" class="form-label">Min Price</label>
          <input type="number" class="form-control" id="minPrice" placeholder="Min">
        </div>
        <div class="col-md-2">
          <label for="maxPrice" class="form-label">Max Price</label>
          <input type="number" class="form-control" id="maxPrice" placeholder="Max">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="loadHotels()">Filter</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="status"></div>
    <div id="hotels" class="row g-4 reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header').innerHTML = data);
    
    fetch('includes/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer').innerHTML = data)
      .then(() => updateNavigation());

    async function loadHotels() {
      showLoading('hotels');
      clearStatus('status');
      
      const city = document.getElementById('cityFilter').value;
      const country = document.getElementById('countryFilter').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      try {
        let url = '/hotels?limit=20';
        if (city) url += `&city=${encodeURIComponent(city)}`;
        if (country) url += `&country=${encodeURIComponent(country)}`;
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('hotels');
        
        if (data.results.length === 0) {
          container.innerHTML = '<p class="text-muted">No hotels found.</p>';
          return;
        }
        
        container.innerHTML = data.results.map((hotel, index) => `
          <div class="col-md-4 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${hotel.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${hotel.name}" loading="lazy">
                <div class="card-overlay">
                  <a href="hotel-details.html?id=${hotel.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${hotel.name}</h5>
                <p class="card-text text-muted">${hotel.city}, ${hotel.country}</p>
                <p class="price">${formatPrice(hotel.price_per_night)}<span class="price-small">/night</span></p>
                <p class="rating">★ ${hotel.rating || 0}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        showError('status', error.message || 'Failed to load hotels');
        document.getElementById('hotels').innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadHotels();
    });
  </script>
</body>
</html>
