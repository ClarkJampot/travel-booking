<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotels - Travel Booking</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    async function loadHotels() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      list.innerHTML = '';
      status.textContent = 'Loading...';
      const q = new URLSearchParams();
      const city = document.getElementById('city')?.value?.trim();
      const country = document.getElementById('country')?.value?.trim();
      const minPrice = document.getElementById('minPrice')?.value;
      const maxPrice = document.getElementById('maxPrice')?.value;
      const ratingMin = document.getElementById('ratingMin')?.value;
      if (city) q.set('city', city);
      if (country) q.set('country', country);
      if (minPrice) q.set('minPrice', minPrice);
      if (maxPrice) q.set('maxPrice', maxPrice);
      if (ratingMin) q.set('ratingMin', ratingMin);
      try {
        const res = await fetch('api/hotels?' + q.toString());
        const data = await res.json();
        status.textContent = '';
        (data.results || []).forEach(h => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<strong>${h.name}</strong><div class="muted">${h.city}, ${h.country}</div><div>₱${Number(h.price_per_night).toFixed(2)} / night</div>`;
          list.appendChild(div);
        });
        if (!list.children.length) status.textContent = 'No hotels found.';
      } catch (e) {
        status.textContent = 'Failed to load hotels.';
        console.error(e);
      }
    }
    window.addEventListener('DOMContentLoaded', loadHotels);
  </script>
  </head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">Bookings</a>
      <a href="auth.html">Auth</a>
    </nav>
  </header>
  <main>
    <h1>Hotels</h1>
    <div class="row">
      <label>City <input id="city" placeholder="Cebu"></label>
      <label>Country <input id="country" placeholder="Philippines"></label>
      <label>Min ₱ <input id="minPrice" type="number"></label>
      <label>Max ₱ <input id="maxPrice" type="number"></label>
      <label>Rating ≥ <input id="ratingMin" type="number" min="0" max="5" step="0.1"></label>
      <button onclick="loadHotels()">Search</button>
    </div>
    <p class="muted">Fetching from <code>api/hotels</code></p>
    <div id="status" class="muted"></div>
    <div id="list" class="grid"></div>
  </main>
</body>
</html>
