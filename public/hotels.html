<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotels - Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    async function loadHotels() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      list.innerHTML = '';
      status.textContent = 'Loading...';
      const q = new URLSearchParams();
      const city = document.getElementById('city')?.value?.trim();
      const country = document.getElementById('country')?.value?.trim();
      const minPrice = document.getElementById('minPrice')?.value;
      const maxPrice = document.getElementById('maxPrice')?.value;
      const ratingMin = document.getElementById('ratingMin')?.value;
      if (city) q.set('city', city);
      if (country) q.set('country', country);
      if (minPrice) q.set('minPrice', minPrice);
      if (maxPrice) q.set('maxPrice', maxPrice);
      if (ratingMin) q.set('ratingMin', ratingMin);
      try {
        const res = await fetch('api/hotels?' + q.toString());
        const data = await res.json();
        status.textContent = '';
        (data.results || []).forEach(h => {
          const div = document.createElement('div');
          div.className = 'card';
          div.onclick = () => window.location.href = `hotel-details.html?id=${h.id}`;
          const imgSrc = h.image_url || '/uploads/placeholder.svg';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${h.name}" class="card-image" onerror="this.src='/uploads/placeholder.svg'">
            <div class="row" style="justify-content:space-between">
              <strong>${h.name}</strong>
              <span class="badge">${Number(h.rating).toFixed(1)} ★</span>
            </div>
            <div class="muted">${h.city}, ${h.country}</div>
            <div class="price" style="margin-top:6px;">₱${Number(h.price_per_night).toFixed(2)} <span class="muted" style="font-weight:400">/ night</span></div>
          `;
          list.appendChild(div);
        });
        if (!list.children.length) status.textContent = 'No hotels found.';
      } catch (e) {
        status.textContent = 'Failed to load hotels.';
        console.error(e);
      }
    }
    window.addEventListener('DOMContentLoaded', loadHotels);
  </script>
  </head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">Bookings</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main>
    <h1>Hotels</h1>
    <div class="toolbar">
      <label>City <input id="city" placeholder="Cebu"></label>
      <label>Country <input id="country" placeholder="Philippines"></label>
      <label>Min ₱ <input id="minPrice" type="number"></label>
      <label>Max ₱ <input id="maxPrice" type="number"></label>
      <label>Rating ≥ <input id="ratingMin" type="number" min="0" max="5" step="0.1"></label>
      <button onclick="loadHotels()">Search</button>
    </div>
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <span class="muted">Fetching from <code>api/hotels</code></span>
      <div class="row">
        <span class="badge">Free cancellation</span>
        <span class="badge">Breakfast</span>
        <span class="badge">Pay at hotel</span>
      </div>
    </div>
    <div id="status" class="muted"></div>
    <div id="list" class="grid"></div>
  </main>
</body>
</html>
