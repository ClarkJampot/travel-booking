<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="flightDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="flightAirline" class="fade-in-up"></h3>
            <p id="flightRoute"></p>
            <p class="text-muted" id="flightDate"></p>
            <p class="price" id="flightPrice"></p>
            <p id="flightDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card sticky-booking-form reveal">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const flightId = urlParams.get('id');
    let flight = null;
    async function loadFlight() {
      try {
        const data = await apiCall(`/flights?id=${flightId}`);
        flight = data.flight;
        document.getElementById('flightAirline').textContent = flight.airline;
        document.getElementById('flightRoute').textContent = `${flight.origin} → ${flight.destination}`;
        document.getElementById('flightDate').textContent = formatDate(flight.depart_date);
        // Display price with discount if applicable
        const discountedPrice = flight.discount_percent > 0 
          ? flight.price * (1 - flight.discount_percent / 100)
          : flight.price;
        
        let priceHTML = '';
        if (flight.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(flight.price)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = formatPrice(flight.price);
        }
        document.getElementById('flightPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(flight.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${flight.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(flight.discount_percent)}% OFF</span>` : ''}
        `;
        if (flight.ad || flight.discount_percent > 0) {
          document.getElementById('flightPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(discountedPrice)}`;
        document.getElementById('flightDescription').textContent = flight.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(flight.image_url, flight.images || []);
        document.getElementById('flightDetails').innerHTML = createImageCarousel(allImages, 'flightCarousel', flight.airline);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('flightCarousel');
          if (carouselEl && allImages.length > 1) {
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('flightCarousel', event.to);
            });
          }
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
      } catch (error) {
        showError('status', error.message || 'Failed to load flight');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'flight',
            item_id: flight.id,
            total_price: flight.discount_percent > 0 ? flight.price * (1 - flight.discount_percent / 100) : flight.price
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (flightId) loadFlight();
    else showError('status', 'Flight ID not provided');
  </script>
</body>
</html>
