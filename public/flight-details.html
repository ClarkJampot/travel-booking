<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="flightDetails"></div>
    <div class="row mt-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h3 id="flightAirline"></h3>
            <p id="flightRoute"></p>
            <p class="text-muted" id="flightDate"></p>
            <p class="price" id="flightPrice"></p>
            <p id="flightDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const flightId = urlParams.get('id');
    let flight = null;
    async function loadFlight() {
      try {
        const data = await apiCall(`/flights?id=${flightId}`);
        flight = data.flight;
        document.getElementById('flightAirline').textContent = flight.airline;
        document.getElementById('flightRoute').textContent = `${flight.origin} → ${flight.destination}`;
        document.getElementById('flightDate').textContent = formatDate(flight.depart_date);
        document.getElementById('flightPrice').textContent = formatPrice(flight.price);
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(flight.price)}`;
        document.getElementById('flightDescription').textContent = flight.description || '';
        document.getElementById('flightDetails').innerHTML = `<img src="${flight.image_url || 'uploads/placeholder.svg'}" class="img-fluid rounded" alt="${flight.airline}">`;
      } catch (error) {
        showError('status', error.message || 'Failed to load flight');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'flight',
            item_id: flight.id,
            total_price: flight.price
          })
        });
        showSuccess('status', 'Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (flightId) loadFlight();
    else showError('status', 'Flight ID not provided');
  </script>
</body>
</html>
