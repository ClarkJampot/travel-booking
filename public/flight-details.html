<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="flightDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="flightAirline" class="fade-in-up"></h3>
            <p id="flightRoute"></p>
            <p class="text-muted" id="flightDuration"></p>
            <p class="price" id="flightPrice"></p>
          </div>
        </div>
        
        <!-- Available Instances Section -->
        <div class="card mt-3 reveal" id="instancesSection" style="display: none;">
          <div class="card-body">
            <h5>Available Flights</h5>
            <div id="instancesList"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card reveal">
          <div class="card-body">
            <h5 class="mb-4">Select Date</h5>
            <div id="calendarContainer"></div>
            <div class="mt-4">
              <div class="mb-3">
                <label class="form-label">Trip Type</label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="tripType" id="tripTypeOneWay" value="one-way" checked>
                  <label class="btn btn-outline-primary" for="tripTypeOneWay">One-way</label>
                  
                  <input type="radio" class="btn-check" name="tripType" id="tripTypeRoundTrip" value="round-trip">
                  <label class="btn btn-outline-primary" for="tripTypeRoundTrip">Round-trip</label>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Class</label>
                <select class="form-control" id="classSelect">
                  <option value="economy">Economy</option>
                  <option value="business">Business</option>
                  <option value="first">First</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Passengers</label>
                <input type="number" class="form-control" id="passengerCount" value="1" min="1" max="9">
              </div>
            </div>
            <div id="status" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/components/Calendar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    loadLayout();
    
    const urlParams = new URLSearchParams(window.location.search);
    const routeId = urlParams.get('id');
    let route = null;
    let selectedInstance = null;
    let selectedReturnInstance = null;
    let calendar = null;
    let tripType = 'one-way';
    let selectedClass = 'economy';
    let passengerCount = 1;
    let returnRouteId = null;
    
    async function loadRoute() {
      try {
        const data = await apiCall(`/flights?id=${routeId}`);
        route = data.flight;
        
        // Display route information
        document.getElementById('flightAirline').textContent = route.airline;
        const originDisplay = route.origin_city_name ? `${route.origin_city_name} (${route.origin_code || ''})` : (route.origin_code || '');
        const destinationDisplay = route.destination_city_name ? `${route.destination_city_name} (${route.destination_code || ''})` : (route.destination_code || '');
        document.getElementById('flightRoute').textContent = `${originDisplay} → ${destinationDisplay}`;
        
        if (route.duration_minutes) {
          const hours = Math.floor(route.duration_minutes / 60);
          const minutes = route.duration_minutes % 60;
          const durationText = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
          document.getElementById('flightDuration').textContent = `Duration: ${durationText}`;
        }
        
        // Display prices
        const basePrice = route.base_price_economy || route.price;
        const discountedPrice = route.discount_percent > 0 
          ? basePrice * (1 - route.discount_percent / 100)
          : basePrice;
        
        let priceHTML = '';
        if (route.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(basePrice)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = `From ${formatPrice(basePrice)}`;
        }
        document.getElementById('flightPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(route.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${route.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(route.discount_percent)}% OFF</span>` : ''}
        `;
        if (route.ad || route.discount_percent > 0) {
          document.getElementById('flightPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        // Load available dates and initialize calendar
        await loadAvailableDates();
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load flight route');
      }
    }
    
    async function loadAvailableDates() {
      try {
        const data = await apiCall(`/flights/availability?route_id=${routeId}`);
        const availableDates = data.available_dates || [];
        
        // Initialize calendar
        calendar = new Calendar({
          container: '#calendarContainer',
          availableDates: availableDates,
          rangeMode: tripType === 'round-trip',
          onDateSelect: (date) => {
            // First date selected (departure)
            loadInstancesForDate(date);
            // If round-trip, load return route availability
            if (tripType === 'round-trip') {
              loadReturnRouteAvailability(date);
            }
          },
          onRangeSelect: (departureDate, returnDate) => {
            // Both dates selected
            loadInstancesForDate(departureDate);
          }
        });
        
        // Get return route ID if it exists
        await getReturnRouteId();
        
        // Trip type change handler
        document.querySelectorAll('input[name="tripType"]').forEach(radio => {
          radio.addEventListener('change', function() {
            tripType = this.value;
            
            // Update calendar range mode
            if (calendar) {
              calendar.setRangeMode(tripType === 'round-trip');
              if (tripType === 'round-trip') {
                // Load return availability if departure is already selected
                const departureDate = calendar.getDepartureDate();
                if (departureDate) {
                  loadReturnRouteAvailability(departureDate);
                }
              } else {
                // Reset range selection
                calendar.setReturnDate(null);
                selectedReturnInstance = null;
                // Reload instances with just departure date
                const selectedDate = calendar.getSelectedDate();
                if (selectedDate) {
                  loadInstancesForDate(selectedDate);
                }
              }
            }
          });
        });
        
        // Update instances when class or passenger count changes
        document.getElementById('classSelect').addEventListener('change', function() {
          const selectedDate = calendar ? calendar.getSelectedDate() : null;
          if (selectedDate) {
            loadInstancesForDate(selectedDate);
          }
        });
        
        document.getElementById('passengerCount').addEventListener('change', function() {
          const selectedDate = calendar ? calendar.getSelectedDate() : null;
          if (selectedDate) {
            loadInstancesForDate(selectedDate);
          }
        });
      } catch (error) {
        console.error('Failed to load available dates:', error);
        setStatus('status', 'error', 'Failed to load available dates');
      }
    }
    
    async function getReturnRouteId() {
      try {
        // Check if there's a return route by making a test call with a return date
        const today = new Date().toISOString().split('T')[0];
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];
        
        const testData = await apiCall(`/flights/instances?route_id=${routeId}&departure_date=${today}&return_date=${tomorrowStr}`);
        
        // If return_instances exist, there's a return route
        if (testData.return_instances && testData.return_instances.length > 0) {
          // Return route exists - we'll get availability by querying with different return dates
          returnRouteId = true; // Flag that return route exists
        } else {
          returnRouteId = null;
        }
      } catch (error) {
        console.error('Failed to check return route:', error);
        returnRouteId = null;
      }
    }
    
    async function loadReturnRouteAvailability(departureDate) {
      try {
        // Get available return dates using the API
        const data = await apiCall(`/flights/availability?route_id=${routeId}&return=true`);
        const allReturnDates = data.available_dates || [];
        
        // Filter to only dates after departure date
        const departure = new Date(departureDate);
        const availableReturnDates = allReturnDates.filter(dateStr => {
          const date = new Date(dateStr);
          return date > departure;
        });
        
        // Update calendar with return available dates
        if (calendar) {
          calendar.setReturnAvailableDates(availableReturnDates);
        }
      } catch (error) {
        console.error('Failed to load return route availability:', error);
        if (calendar) {
          calendar.setReturnAvailableDates([]);
        }
      }
    }
    
    async function loadInstancesForDate(date) {
      try {
        clearStatus('status');
        
        // Get current class and passenger count from form
        selectedClass = document.getElementById('classSelect').value;
        passengerCount = parseInt(document.getElementById('passengerCount').value) || 1;
        
        // Build API URL
        let apiUrl = `/flights/instances?route_id=${routeId}&departure_date=${date}&class=${selectedClass}&passenger_count=${passengerCount}`;
        
        // Add return date if round-trip and return date is selected
        if (tripType === 'round-trip' && calendar) {
          const returnDate = calendar.getReturnDate();
          if (returnDate) {
            apiUrl += `&return_date=${returnDate}`;
          }
        }
        
        const data = await apiCall(apiUrl);
        const instances = data.instances || [];
        const returnInstances = data.return_instances || [];
        
        if (instances.length === 0) {
          document.getElementById('instancesList').innerHTML = '<p class="text-muted">No available flights for this date. Please try another date.</p>';
          document.getElementById('instancesSection').style.display = 'block';
          selectedInstance = null;
          return;
        }
        
        // Display instances
        let instancesHtml = '<h6 class="mb-3">Departure Flights</h6>';
        instancesHtml += instances.map(instance => {
          const price = instance.discounted_price || instance.price;
          const departureTime = new Date(instance.departure_datetime).toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: true 
          });
          
          return `
            <div class="card mb-2 instance-card ${selectedInstance && selectedInstance.id === instance.id ? 'border-primary' : ''}" 
                 data-instance-id="${instance.id}" 
                 data-instance-type="departure"
                 style="cursor: pointer; transition: all 0.2s;">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="mb-1">${departureTime}</h6>
                    <small class="text-muted">${formatDate(instance.departure_datetime)}</small>
                    <br>
                    <small class="text-muted">${instance.seats_available || 0} seat${(instance.seats_available || 0) !== 1 ? 's' : ''} available</small>
                  </div>
                  <div class="text-end">
                    <strong class="text-primary">${formatPrice(price)}</strong>
                    <br>
                    <small class="text-muted">${selectedClass.charAt(0).toUpperCase() + selectedClass.slice(1)}</small>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        // Add return flights if round-trip
        if (tripType === 'round-trip') {
          instancesHtml += '<h6 class="mb-3 mt-4">Return Flights</h6>';
          if (returnInstances.length === 0) {
            instancesHtml += '<p class="text-muted">No return flights available. Please select a return date.</p>';
          } else {
            instancesHtml += returnInstances.map(instance => {
              const price = instance.discounted_price || instance.price;
              const departureTime = new Date(instance.departure_datetime).toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
              });
              
              return `
                <div class="card mb-2 instance-card ${selectedReturnInstance && selectedReturnInstance.id === instance.id ? 'border-primary' : ''}" 
                     data-instance-id="${instance.id}" 
                     data-instance-type="return"
                     style="cursor: pointer; transition: all 0.2s;">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                      <div>
                        <h6 class="mb-1">${departureTime}</h6>
                        <small class="text-muted">${formatDate(instance.departure_datetime)}</small>
                        <br>
                        <small class="text-muted">${instance.seats_available || 0} seat${(instance.seats_available || 0) !== 1 ? 's' : ''} available</small>
                      </div>
                      <div class="text-end">
                        <strong class="text-primary">${formatPrice(price)}</strong>
                        <br>
                        <small class="text-muted">${selectedClass.charAt(0).toUpperCase() + selectedClass.slice(1)}</small>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          }
        }
        
        document.getElementById('instancesList').innerHTML = instancesHtml;
        document.getElementById('instancesSection').style.display = 'block';
        
        // Store instances for later use
        window.currentInstances = instances;
        window.currentReturnInstances = returnInstances;
        
        // Always show booking button (will be enabled/disabled based on selection)
        updateBookingButton();
        
        // Add click handlers to instance cards
        document.querySelectorAll('.instance-card').forEach(card => {
          card.addEventListener('click', function() {
            const instanceId = parseInt(this.dataset.instanceId);
            const instanceType = this.dataset.instanceType;
            
            // Remove previous selection from same type
            document.querySelectorAll(`.instance-card[data-instance-type="${instanceType}"]`).forEach(c => c.classList.remove('border-primary'));
            this.classList.add('border-primary');
            
            // Use window.currentInstances which are stored globally
            // Convert instanceId to string for comparison since API returns IDs as strings
            const instanceIdStr = String(instanceId);
            if (instanceType === 'departure') {
              selectedInstance = window.currentInstances.find(i => String(i.id) === instanceIdStr);
            } else if (instanceType === 'return') {
              selectedReturnInstance = window.currentReturnInstances.find(i => String(i.id) === instanceIdStr);
            }
            
            // Update booking button state
            updateBookingButton();
          });
        });
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load available flights');
      }
    }
    
    function updateBookingButton() {
      const instancesSection = document.getElementById('instancesSection');
      if (!instancesSection) return;
      
      // Remove existing button if any
      const existingBtn = instancesSection.querySelector('.book-instance-btn');
      if (existingBtn) existingBtn.remove();
      
      // Check if we can show the booking button
      const canBook = selectedInstance && (tripType === 'one-way' || (tripType === 'round-trip' && selectedReturnInstance));
      
      // Always show the button, always make it clickable
      const bookingBtn = document.createElement('button');
      bookingBtn.className = 'btn btn-lg w-100 mt-4 book-instance-btn';
      bookingBtn.type = 'button'; // Prevent form submission
      
      if (canBook) {
        bookingBtn.style.cssText = 'font-size: 1.2rem; font-weight: bold; padding: 15px; background-color: #007bff; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white; cursor: pointer;';
        bookingBtn.textContent = 'Book Now';
      } else {
        bookingBtn.style.cssText = 'font-size: 1.2rem; font-weight: bold; padding: 15px; background-color: #6c757d; border: none; color: white; cursor: pointer; opacity: 0.8;';
        bookingBtn.textContent = tripType === 'round-trip' && !selectedReturnInstance ? 'Select Return Flight' : 'Select a Flight';
      }
      
      // Always attach click handler - it will validate inside
      bookingBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        handleBooking();
      });
      
      // Append button to the card-body, after instancesList
      const cardBody = instancesSection.querySelector('.card-body');
      if (cardBody) {
        cardBody.appendChild(bookingBtn);
      } else {
        // Fallback: append to instancesSection
        instancesSection.appendChild(bookingBtn);
      }
    }
    
    async function handleBooking() {
      if (!isAuthenticated()) {
        showCustomerRequiredModal();
        return;
      }
      
      if (!isCustomer()) {
        showCustomerRequiredModal();
        return;
      }
      
      if (!selectedInstance) {
        setStatus('status', 'error', 'Please select a departure flight');
        return;
      }
      
      if (tripType === 'round-trip' && !selectedReturnInstance) {
        setStatus('status', 'error', 'Please select a return flight');
        return;
      }
      
      // Double-check we have valid selections
      const canBook = selectedInstance && (tripType === 'one-way' || (tripType === 'round-trip' && selectedReturnInstance));
      if (!canBook) {
        setStatus('status', 'error', 'Please select a flight to continue');
        return;
      }
      
      // Get current values from form
      selectedClass = document.getElementById('classSelect').value;
      passengerCount = parseInt(document.getElementById('passengerCount').value) || 1;
      
      if (passengerCount < 1 || passengerCount > 9) {
        setStatus('status', 'error', 'Please enter a valid number of passengers (1-9)');
        return;
      }
      
      clearStatus('status');
      
      const bookBtn = document.querySelector('.book-instance-btn');
      if (bookBtn) {
        bookBtn.disabled = true;
        bookBtn.textContent = 'Booking...';
      }
      
      try {
        // Book departure flight
        await apiCall('/flights/book', {
          method: 'POST',
          body: JSON.stringify({
            instance_id: selectedInstance.id,
            class: selectedClass,
            passenger_count: passengerCount
          })
        });
        
        // Book return flight if round-trip
        if (tripType === 'round-trip' && selectedReturnInstance) {
          await apiCall('/flights/book', {
            method: 'POST',
            body: JSON.stringify({
              instance_id: selectedReturnInstance.id,
              class: selectedClass,
              passenger_count: passengerCount
            })
          });
        }
        
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to create booking');
        if (bookBtn) {
          bookBtn.disabled = false;
          bookBtn.textContent = 'Book Now';
        }
      }
    }
    
    if (routeId) {
      loadRoute();
    } else {
      setStatus('status', 'error', 'Flight route ID not provided');
    }
  </script>
</body>
</html>
