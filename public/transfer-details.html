<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="transferDetails"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h3 id="transferService"></h3>
            <p id="transferRoute"></p>
            <p class="text-muted" id="transferDate"></p>
            <p class="price" id="transferPrice"></p>
            <p id="transferDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const transferId = urlParams.get('id');
    let transfer = null;
    async function loadTransfer() {
      try {
        const data = await apiCall(`/transfers?id=${transferId}`);
        transfer = data.transfer;
        document.getElementById('transferService').textContent = transfer.service;
        document.getElementById('transferRoute').textContent = `${transfer.origin} → ${transfer.destination}`;
        document.getElementById('transferDate').textContent = formatDate(transfer.date);
        // Display price with discount if applicable
        const discountedPrice = transfer.discount_percent > 0 
          ? transfer.price * (1 - transfer.discount_percent / 100)
          : transfer.price;
        
        let priceHTML = '';
        if (transfer.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(transfer.price)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = formatPrice(transfer.price);
        }
        document.getElementById('transferPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(transfer.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${transfer.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(transfer.discount_percent)}% OFF</span>` : ''}
        `;
        if (transfer.ad || transfer.discount_percent > 0) {
          document.getElementById('transferPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(discountedPrice)}`;
        document.getElementById('transferDescription').textContent = transfer.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(transfer.image_url, transfer.images || []);
        document.getElementById('transferDetails').innerHTML = createImageCarousel(allImages, 'transferCarousel', transfer.service);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('transferCarousel');
          if (carouselEl && allImages.length > 1) {
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('transferCarousel', event.to);
            });
          }
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
      } catch (error) {
        showError('status', error.message || 'Failed to load transfer');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'transfer',
            item_id: transfer.id,
            total_price: transfer.discount_percent > 0 ? transfer.price * (1 - transfer.discount_percent / 100) : transfer.price
          })
        });
        showSuccess('status', 'Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (transferId) loadTransfer();
    else showError('status', 'Transfer ID not provided');
  </script>
</body>
</html>
