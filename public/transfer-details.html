<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="transferService" class="fade-in-up"></h3>
            <p id="transferRoute"></p>
            <p class="text-muted" id="transferDateDisplay"></p>
            <p class="price" id="transferPrice"></p>
            <p id="transferDescription"></p>
          </div>
        </div>
        
        <!-- Available Instances Section -->
        <div class="card mt-3 reveal" id="instancesSection" style="display: none;">
          <div class="card-body">
            <h5>Available Transfers</h5>
            <div id="instancesList"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card reveal">
          <div class="card-body">
            <h5 class="mb-4">Select Date</h5>
            <div id="calendarContainer"></div>
            <div class="mt-4">
              <div class="mb-3">
                <label class="form-label">Passengers</label>
                <input type="number" class="form-control" id="passengerCount" value="1" min="1" max="9">
              </div>
            </div>
            <div id="status" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/components/Calendar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    loadLayout();
    
    const urlParams = new URLSearchParams(window.location.search);
    const transferId = urlParams.get('id');
    let transfer = null;
    let selectedInstance = null;
    let calendar = null;
    let passengerCount = 1;
    
    async function loadTransfer() {
      try {
        const data = await apiCall(`/transfers?id=${transferId}`);
        transfer = data.transfer;
        
        // Display transfer information
        document.getElementById('transferService').textContent = transfer.service || 'Transfer Service';
        const originDisplay = transfer.origin_city_name
          ? `${transfer.origin_city_name}${transfer.origin_province_name ? ', ' + transfer.origin_province_name : ''}`
          : (transfer.origin || '');
        const destinationDisplay = transfer.destination_city_name
          ? `${transfer.destination_city_name}${transfer.destination_province_name ? ', ' + transfer.destination_province_name : ''}`
          : (transfer.destination || '');
        document.getElementById('transferRoute').textContent = `${originDisplay} → ${destinationDisplay}`;
        
        if (transfer.date) {
          document.getElementById('transferDateDisplay').textContent = `Date: ${formatDate(transfer.date)}`;
        }
        
        // Display price
        const basePrice = transfer.price;
        const discountedPrice = transfer.discount_percent > 0 
          ? basePrice * (1 - transfer.discount_percent / 100)
          : basePrice;
        
        let priceHTML = '';
        if (transfer.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(basePrice)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = `From ${formatPrice(basePrice)}`;
        }
        document.getElementById('transferPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(transfer.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${transfer.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(transfer.discount_percent)}% OFF</span>` : ''}
        `;
        if (transfer.ad || transfer.discount_percent > 0) {
          document.getElementById('transferPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        // Display description if available
        if (transfer.description) {
          document.getElementById('transferDescription').textContent = transfer.description;
        }
        
        // Load available dates and initialize calendar
        await loadAvailableDates();
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load transfer');
      }
    }
    
    async function loadAvailableDates() {
      try {
        const data = await apiCall(`/transfers/availability?transfer_id=${transferId}`);
        const availableDates = data.available_dates || [];
        
        // Initialize calendar
        calendar = new Calendar({
          container: '#calendarContainer',
          availableDates: availableDates,
          onDateSelect: (date) => {
            loadInstancesForDate(date);
          }
        });
        
        // Update instances when passenger count changes
        document.getElementById('passengerCount').addEventListener('change', function() {
          const selectedDate = calendar ? calendar.getSelectedDate() : null;
          if (selectedDate) {
            loadInstancesForDate(selectedDate);
          }
        });
      } catch (error) {
        console.error('Failed to load available dates:', error);
        setStatus('status', 'error', 'Failed to load available dates');
      }
    }
    
    async function loadInstancesForDate(date) {
      try {
        clearStatus('status');
        
        // Get current passenger count from form
        passengerCount = parseInt(document.getElementById('passengerCount').value) || 1;
        
        // Load instances for selected date
        const apiUrl = `/transfer-instances?transfer_id=${transferId}&date=${date}&passenger_count=${passengerCount}`;
        const data = await apiCall(apiUrl);
        const instances = data.instances || [];
        
        if (instances.length === 0) {
          document.getElementById('instancesList').innerHTML = '<p class="text-muted">No available transfers for this date. Please try another date.</p>';
          document.getElementById('instancesSection').style.display = 'block';
          selectedInstance = null;
          return;
        }
        
        // Display instances
        let instancesHtml = instances.map(instance => {
          const price = instance.discounted_price || instance.price;
          // Use departure_datetime if available, otherwise construct from departure_date and departure_time
          let departureTime = '';
          if (instance.departure_datetime) {
            departureTime = new Date(instance.departure_datetime).toLocaleTimeString('en-US', { 
              hour: '2-digit', 
              minute: '2-digit',
              hour12: true 
            });
          } else if (instance.departure_date && instance.departure_time) {
            // Construct datetime from date and time
            const dateTimeStr = `${instance.departure_date}T${instance.departure_time}`;
            departureTime = new Date(dateTimeStr).toLocaleTimeString('en-US', { 
              hour: '2-digit', 
              minute: '2-digit',
              hour12: true 
            });
          }
          
          // Use departure_datetime for date formatting, fallback to departure_date or the selected date
          const instanceDate = instance.departure_datetime || instance.departure_date || date;
          
          return `
            <div class="card mb-2 instance-card ${selectedInstance && selectedInstance.id === instance.id ? 'border-primary' : ''}" 
                 data-instance-id="${instance.id}" 
                 style="cursor: pointer; transition: all 0.2s;">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    ${departureTime ? `<h6 class="mb-1">${departureTime}</h6>` : ''}
                    <small class="text-muted">${formatDate(instanceDate)}</small>
                    <br>
                    <small class="text-muted">${instance.seats_available || instance.available_seats || 'N/A'} seat${(instance.seats_available || instance.available_seats || 0) !== 1 ? 's' : ''} available</small>
                  </div>
                  <div class="text-end">
                    <strong class="text-primary">${formatPrice(price)}</strong>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        document.getElementById('instancesList').innerHTML = instancesHtml;
        document.getElementById('instancesSection').style.display = 'block';
        
        // Store instances for later use
        window.currentInstances = instances;
        
        // Always show booking button (will be enabled/disabled based on selection)
        updateBookingButton();
        
        // Add click handlers to instance cards
        document.querySelectorAll('.instance-card').forEach(card => {
          card.addEventListener('click', function() {
            const instanceId = parseInt(this.dataset.instanceId);
            
            // Remove previous selection
            document.querySelectorAll('.instance-card').forEach(c => c.classList.remove('border-primary'));
            this.classList.add('border-primary');
            
            // Use window.currentInstances which are stored globally
            // Convert instanceId to string for comparison since API returns IDs as strings
            const instanceIdStr = String(instanceId);
            selectedInstance = window.currentInstances.find(i => String(i.id) === instanceIdStr);
            
            // Update booking button state
            updateBookingButton();
          });
        });
      } catch (error) {
        const errorMessage = error.message || 'Failed to load available transfers';
        if (errorMessage.toLowerCase().includes('not found') || errorMessage.includes('404')) {
          setStatus('status', 'error', 'No transfers available for the selected date. Please try another date.');
        } else {
          setStatus('status', 'error', errorMessage);
        }
      }
    }
    
    function updateBookingButton() {
      const instancesSection = document.getElementById('instancesSection');
      if (!instancesSection) return;
      
      // Remove existing button if any
      const existingBtn = instancesSection.querySelector('.book-instance-btn');
      if (existingBtn) existingBtn.remove();
      
      // Always show the button, always make it clickable
      const bookingBtn = document.createElement('button');
      bookingBtn.className = 'btn btn-lg w-100 mt-4 book-instance-btn';
      bookingBtn.type = 'button'; // Prevent form submission
      
      if (selectedInstance) {
        bookingBtn.style.cssText = 'font-size: 1.2rem; font-weight: bold; padding: 15px; background-color: #007bff; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white; cursor: pointer;';
        bookingBtn.textContent = 'Book Now';
      } else {
        bookingBtn.style.cssText = 'font-size: 1.2rem; font-weight: bold; padding: 15px; background-color: #6c757d; border: none; color: white; cursor: pointer; opacity: 0.8;';
        bookingBtn.textContent = 'Select a Transfer';
      }
      
      // Always attach click handler - it will validate inside
      bookingBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        handleBooking();
      });
      
      // Append button to the card-body, after instancesList
      const cardBody = instancesSection.querySelector('.card-body');
      if (cardBody) {
        cardBody.appendChild(bookingBtn);
      } else {
        // Fallback: append to instancesSection
        instancesSection.appendChild(bookingBtn);
      }
    }
    
    async function handleBooking() {
      if (!isAuthenticated()) {
        alert('Please log in to make a booking.');
        window.location.href = 'login.html';
        return;
      }
      
      if (!selectedInstance) {
        setStatus('status', 'error', 'Please select a transfer');
        return;
      }
      
      // Get current passenger count from form
      passengerCount = parseInt(document.getElementById('passengerCount').value) || 1;
      
      if (passengerCount < 1 || passengerCount > 9) {
        setStatus('status', 'error', 'Please enter a valid number of passengers (1-9)');
        return;
      }
      
      clearStatus('status');
      
      const bookBtn = document.querySelector('.book-instance-btn');
      if (bookBtn) {
        bookBtn.disabled = true;
        bookBtn.textContent = 'Booking...';
      }
      
      try {
        await apiCall('/transfers/book', {
          method: 'POST',
          body: JSON.stringify({
            instance_id: selectedInstance.id,
            passenger_count: passengerCount
          })
        });
        
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to create booking');
        if (bookBtn) {
          bookBtn.disabled = false;
          bookBtn.textContent = 'Book Now';
        }
      }
    }
    
    if (transferId) {
      loadTransfer();
    } else {
      setStatus('status', 'error', 'Transfer ID not provided');
    }
  </script>
</body>
</html>
