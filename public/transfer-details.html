<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="transferDetails"></div>
    <div class="row mt-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h3 id="transferService"></h3>
            <p id="transferRoute"></p>
            <p class="text-muted" id="transferDate"></p>
            <p class="price" id="transferPrice"></p>
            <p id="transferDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const transferId = urlParams.get('id');
    let transfer = null;
    async function loadTransfer() {
      try {
        const data = await apiCall(`/transfers?id=${transferId}`);
        transfer = data.transfer;
        document.getElementById('transferService').textContent = transfer.service;
        document.getElementById('transferRoute').textContent = `${transfer.origin} → ${transfer.destination}`;
        document.getElementById('transferDate').textContent = formatDate(transfer.date);
        document.getElementById('transferPrice').textContent = formatPrice(transfer.price);
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(transfer.price)}`;
        document.getElementById('transferDescription').textContent = transfer.description || '';
        document.getElementById('transferDetails').innerHTML = `<img src="${transfer.image_url || 'uploads/placeholder.svg'}" class="img-fluid rounded" alt="${transfer.service}">`;
      } catch (error) {
        showError('status', error.message || 'Failed to load transfer');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'transfer',
            item_id: transfer.id,
            total_price: transfer.price
          })
        });
        showSuccess('status', 'Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (transferId) loadTransfer();
    else showError('status', 'Transfer ID not provided');
  </script>
</body>
</html>
