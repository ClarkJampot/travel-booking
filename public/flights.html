<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <h1 class="mb-4">Flights</h1>
    <div class="filter-section">
      <div class="row">
        <div class="col-md-3"><label class="form-label">Origin</label><input type="text" class="form-control" id="originFilter"></div>
        <div class="col-md-3"><label class="form-label">Destination</label><input type="text" class="form-control" id="destinationFilter"></div>
        <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="dateFilter"></div>
        <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" onclick="loadFlights()">Filter</button></div>
      </div>
    </div>
    <div id="status"></div>
    <div id="flights" class="row g-4 reveal"></div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    async function loadFlights() {
      showLoading('flights');
      try {
        let url = '/flights?limit=20';
        if (document.getElementById('originFilter').value) url += `&origin=${encodeURIComponent(document.getElementById('originFilter').value)}`;
        if (document.getElementById('destinationFilter').value) url += `&destination=${encodeURIComponent(document.getElementById('destinationFilter').value)}`;
        if (document.getElementById('dateFilter').value) url += `&date=${document.getElementById('dateFilter').value}`;
        const data = await apiCall(url);
        document.getElementById('flights').innerHTML = data.results.length === 0 ? '<p class="text-muted">No flights found.</p>' : data.results.map((f, index) => `
          <div class="col-md-4 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
            <div class="card h-100">
              <div class="card-img-wrapper">
                <img src="${f.image_url || 'uploads/placeholder.svg'}" class="card-img-top" alt="${f.airline}" loading="lazy">
                <div class="card-overlay">
                  <a href="flight-details.html?id=${f.id}" class="btn btn-primary btn-lg">View Details</a>
                </div>
              </div>
              <div class="card-body">
                <h5 class="card-title">${f.airline}</h5>
                <p>${f.origin} → ${f.destination}</p>
                <p class="text-muted">${formatDate(f.depart_date)}</p>
                <p class="price">${formatPrice(f.price)}</p>
              </div>
            </div>
          </div>`).join('');
      } catch (error) {
        showError('status', error.message || 'Failed to load flights');
        document.getElementById('flights').innerHTML = '';
      }
    }
    document.addEventListener('DOMContentLoaded', loadFlights);
  </script>
</body>
</html>
