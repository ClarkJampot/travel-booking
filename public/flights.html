<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Flights</h1>
    <div class="filter-section">
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Origin Airport</label>
          <select class="form-control" id="originAirportFilter">
            <option value="">All Airports</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Destination Airport</label>
          <select class="form-control" id="destinationAirportFilter">
            <option value="">All Airports</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Departure Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" id="departureDateFilter" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Return Date</label>
          <input type="date" class="form-control" id="returnDateFilter">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Search</button>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Class</label>
          <select class="form-control" id="classFilter">
            <option value="economy">Economy</option>
            <option value="business">Business</option>
            <option value="first">First</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Passengers</label>
          <input type="number" class="form-control" id="passengerCountFilter" value="1" min="1">
        </div>
        <div class="col-md-6">
          <label class="form-label">Trip Type</label>
          <div>
            <button id="oneWayBtn" class="btn btn-outline-primary me-2">One Way</button>
            <button id="roundTripBtn" class="btn btn-outline-primary">Round Trip</button>
          </div>
        </div>
      </div>
    </div>
    <div id="status"></div>
    
    <!-- Promoted Flights Section -->
    <div id="promotedFlights" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Flights</h3>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Flights -->
    <div id="flights" class="row g-4 reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading more...</span>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    
    let selectedTripType = 'one-way';
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    
    async function loadAirports() {
      try {
        const data = await apiCall('/airports');
        const originSelect = document.getElementById('originAirportFilter');
        const destinationSelect = document.getElementById('destinationAirportFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(airport => {
            const option1 = document.createElement('option');
            option1.value = airport.id;
            option1.textContent = `${airport.code} - ${airport.name}`;
            originSelect.appendChild(option1);
            
            const option2 = document.createElement('option');
            option2.value = airport.id;
            option2.textContent = `${airport.code} - ${airport.name}`;
            destinationSelect.appendChild(option2);
          });
        }
      } catch (error) {
        console.error('Error loading airports:', error);
      }
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        origin_airport_id: params.get('origin_airport_id') || '',
        destination_airport_id: params.get('destination_airport_id') || '',
        departure_date: params.get('departure_date') || '',
        return_date: params.get('return_date') || '',
        trip_type: params.get('trip_type') || 'one-way',
        class: params.get('class') || 'economy',
        passenger_count: parseInt(params.get('passenger_count')) || 1,
        page: parseInt(params.get('page')) || 1
      };
    }

    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const originAirportId = document.getElementById('originAirportFilter').value;
      const destinationAirportId = document.getElementById('destinationAirportFilter').value;
      const departureDate = document.getElementById('departureDateFilter').value;
      const returnDate = document.getElementById('returnDateFilter').value;
      const classFilter = document.getElementById('classFilter').value;
      const passengerCount = document.getElementById('passengerCountFilter').value;
      
      if (originAirportId) params.set('origin_airport_id', originAirportId);
      if (destinationAirportId) params.set('destination_airport_id', destinationAirportId);
      if (departureDate) params.set('departure_date', departureDate);
      if (returnDate && selectedTripType === 'round-trip') params.set('return_date', returnDate);
      if (classFilter) params.set('class', classFilter);
      if (passengerCount) params.set('passenger_count', passengerCount);
      if (selectedTripType) params.set('trip_type', selectedTripType);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadFlights(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      const urlParams = getUrlParams();
      if (!urlParams.departure_date) {
        if (reset || currentPage === 1) {
          document.getElementById('flights').innerHTML = '<p class="text-muted">Please select a departure date to search for flights.</p>';
        }
        return;
      }
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        document.getElementById('flights').innerHTML = '';
        const promotedContainer = document.getElementById('promotedFlights');
        const promotedRow = promotedContainer.querySelector('.row');
        if (promotedRow) promotedRow.innerHTML = '';
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'block';
      }
      
      try {
        let url = `/flights?limit=${limit}&page=${currentPage}&departure_date=${urlParams.departure_date}&class=${urlParams.class}&passenger_count=${urlParams.passenger_count}&trip_type=${urlParams.trip_type}`;
        if (urlParams.origin_airport_id) url += `&origin_airport_id=${urlParams.origin_airport_id}`;
        if (urlParams.destination_airport_id) url += `&destination_airport_id=${urlParams.destination_airport_id}`;
        if (urlParams.return_date && urlParams.trip_type === 'round-trip') url += `&return_date=${urlParams.return_date}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('flights');
        const promotedContainer = document.getElementById('promotedFlights');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted flights (only on first page/reset)
        if (reset || currentPage === 1) {
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            promotedRow.innerHTML = '';
            promotedRow.innerHTML = data.promoted.slice(0, 2).map((f, index) => {
              const priceDisplay = f.discount_percent > 0 
                ? `<div class="price-container">
                    <span class="original-price">${formatPrice(f.price)}</span>
                    <span class="discounted-price">${formatPrice(f.discounted_price || f.price * (1 - f.discount_percent / 100))}</span>
                  </div>`
                : `<p class="price">${formatPrice(f.price)}</p>`;
              
              return `
                <div class="col-md-6 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
                  <div class="card h-100 promoted-item">
                    <div class="card-img-wrapper">
                      <img src="${normalizeImageUrl(f.image_url || '/uploads/placeholder.svg')}" class="card-img-top" alt="${f.airline}" loading="lazy">
                      ${f.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(f.discount_percent)}% OFF</div>` : ''}
                      ${isPromoted(f.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                      <div class="card-overlay">
                        <a href="flight-details.html?id=${f.id}" class="btn btn-primary btn-lg">View Details</a>
                      </div>
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">${f.airline}</h5>
                      <p>${f.origin_code || ''} ${f.origin_name || ''} → ${f.destination_code || ''} ${f.destination_name || ''}</p>
                      <p class="text-muted">${formatDate(f.departure_datetime || f.departure_date)}</p>
                      ${priceDisplay}
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular flights
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            if (!data.promoted || data.promoted.length === 0) {
              container.innerHTML = '<p class="text-muted">Currently no flights available. If you\'re an agency, <a href="register.html">register</a> or <a href="login.html">sign in</a> as an agency to make a listing!</p>';
            } else {
              container.innerHTML = '';
            }
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items
        hasMore = data.results.length >= limit;
        
        // Append flights to container
        const existingCount = container.querySelectorAll('.col-md-4').length;
        const flightsHtml = data.results.map((f, index) => {
          const priceDisplay = f.discount_percent > 0 
            ? `<div class="price-container">
                <span class="original-price">${formatPrice(f.price)}</span>
                <span class="discounted-price">${formatPrice(f.discounted_price || f.price * (1 - f.discount_percent / 100))}</span>
              </div>`
            : `<p class="price">${formatPrice(f.price)}</p>`;
          
          return `
            <div class="col-md-4 reveal stagger-${((existingCount + index) % 5) + 1}" style="opacity: 1; transform: translateY(0);">
              <div class="card h-100">
                <div class="card-img-wrapper">
                  <img src="${normalizeImageUrl(f.image_url || '/uploads/placeholder.svg')}" class="card-img-top" alt="${f.airline}" loading="lazy">
                  ${f.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(f.discount_percent)}% OFF</div>` : ''}
                  ${isPromoted(f.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                  <div class="card-overlay">
                    <a href="flight-details.html?id=${f.id}" class="btn btn-primary btn-lg">View Details</a>
                  </div>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${f.airline}</h5>
                  <p>${f.origin_code || ''} ${f.origin_name || ''} → ${f.destination_code || ''} ${f.destination_name || ''}</p>
                  <p class="text-muted">${formatDate(f.departure_datetime || f.departure_date)}</p>
                  ${priceDisplay}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        container.insertAdjacentHTML('beforeend', flightsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        showError('status', error.message || 'Failed to load flights');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadFlights();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadFlights(true);
    }

    window.addEventListener('popstate', function() {
      loadFlights(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
      await loadAirports();
      
      // Set minimum date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('departureDateFilter').setAttribute('min', today);
      document.getElementById('returnDateFilter').setAttribute('min', today);
      
      // Load URL params into form
      const urlParams = getUrlParams();
      if (urlParams.origin_airport_id) document.getElementById('originAirportFilter').value = urlParams.origin_airport_id;
      if (urlParams.destination_airport_id) document.getElementById('destinationAirportFilter').value = urlParams.destination_airport_id;
      if (urlParams.departure_date) document.getElementById('departureDateFilter').value = urlParams.departure_date;
      if (urlParams.return_date) document.getElementById('returnDateFilter').value = urlParams.return_date;
      if (urlParams.class) document.getElementById('classFilter').value = urlParams.class;
      if (urlParams.passenger_count) document.getElementById('passengerCountFilter').value = urlParams.passenger_count;
      if (urlParams.trip_type) {
        selectedTripType = urlParams.trip_type;
        if (urlParams.trip_type === 'round-trip') {
          document.getElementById('roundTripBtn').classList.add('active');
        } else {
          document.getElementById('oneWayBtn').classList.add('active');
        }
      }
      
      // Trip type button handlers
      document.getElementById('oneWayBtn').addEventListener('click', function() {
        selectedTripType = 'one-way';
        this.classList.add('active');
        document.getElementById('roundTripBtn').classList.remove('active');
        document.getElementById('returnDateFilter').value = '';
        updateURLWithFilters();
        loadFlights(true);
      });
      
      document.getElementById('roundTripBtn').addEventListener('click', function() {
        selectedTripType = 'round-trip';
        this.classList.add('active');
        document.getElementById('oneWayBtn').classList.remove('active');
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Auto-update return date min when departure date changes
      document.getElementById('departureDateFilter').addEventListener('change', function() {
        const returnDateInput = document.getElementById('returnDateFilter');
        if (this.value) {
          returnDateInput.setAttribute('min', this.value);
        }
      });
      
      loadFlights(true);
    });
  </script>
</body>
</html>
