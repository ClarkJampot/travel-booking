<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Flights</h1>
    <div class="filter-section">
      <div class="row mb-3">
        <div class="col-md-2">
          <label class="form-label">Origin Province</label>
          <select class="form-control" id="originProvinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Origin City</label>
          <select class="form-control" id="originCityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Destination Province</label>
          <select class="form-control" id="destinationProvinceFilter">
            <option value="">All Provinces</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Destination City</label>
          <select class="form-control" id="destinationCityFilter">
            <option value="">All Cities</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="handleFilterClick()">Filter</button>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Keyword Search</label>
          <input type="text" class="form-control" id="keywordFilter" placeholder="Search flights...">
        </div>
        <div class="col-md-8">
          <label class="form-label">Trip Type</label>
          <div>
            <button id="oneWayBtn" class="btn btn-outline-primary me-2">One Way</button>
            <button id="roundTripBtn" class="btn btn-outline-primary">Round Trip</button>
          </div>
        </div>
      </div>
    </div>
    <div id="status"></div>
    
    <!-- Promoted Flights Section -->
    <div id="promotedFlights" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Flights</h3>
      <div class="row g-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Flights -->
    <div id="flights" class="row g-4 reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading more...</span>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    
    let selectedTripType = null;
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    
    async function loadProvinces() {
      try {
        const data = await apiCall('/provinces');
        const originProvinceSelect = document.getElementById('originProvinceFilter');
        const destinationProvinceSelect = document.getElementById('destinationProvinceFilter');
        if (data.results && data.results.length > 0) {
          data.results.forEach(province => {
            const option1 = document.createElement('option');
            option1.value = province.id;
            option1.textContent = province.name;
            originProvinceSelect.appendChild(option1);
            
            const option2 = document.createElement('option');
            option2.value = province.id;
            option2.textContent = province.name;
            destinationProvinceSelect.appendChild(option2);
          });
        }
      } catch (error) {
        console.error('Error loading provinces:', error);
      }
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        q: params.get('q') || '',
        origin_city_id: params.get('origin_city_id') || '',
        destination_city_id: params.get('destination_city_id') || '',
        date: params.get('date') || '',
        trip_type: params.get('trip_type') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const originCityId = document.getElementById('originCityFilter').value;
      const destinationCityId = document.getElementById('destinationCityFilter').value;
      const date = document.getElementById('dateFilter').value;
      const keyword = document.getElementById('keywordFilter').value;
      
      if (originCityId) params.set('origin_city_id', originCityId);
      if (destinationCityId) params.set('destination_city_id', destinationCityId);
      if (date) params.set('date', date);
      if (keyword) params.set('q', keyword);
      if (selectedTripType) params.set('trip_type', selectedTripType);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadFlights(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        document.getElementById('flights').innerHTML = '';
        const promotedContainer = document.getElementById('promotedFlights');
        const promotedRow = promotedContainer.querySelector('.row');
        if (promotedRow) promotedRow.innerHTML = '';
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'none';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/flights?limit=${limit}&page=${currentPage}`;
        if (urlParams.origin_city_id) url += `&origin_city_id=${urlParams.origin_city_id}`;
        if (urlParams.destination_city_id) url += `&destination_city_id=${urlParams.destination_city_id}`;
        if (urlParams.date) url += `&date=${urlParams.date}`;
        if (urlParams.q) url += `&q=${encodeURIComponent(urlParams.q)}`;
        if (urlParams.trip_type) url += `&trip_type=${urlParams.trip_type}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('flights');
        const promotedContainer = document.getElementById('promotedFlights');
        const promotedRow = promotedContainer.querySelector('.row');
        
        // Display promoted flights (only on first page/reset)
        if (reset || currentPage === 1) {
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            // Always clear first to prevent duplicates
            promotedRow.innerHTML = '';
            promotedRow.innerHTML = data.promoted.slice(0, 2).map((f, index) => {
              const priceDisplay = f.discount_percent > 0 
                ? `<div class="price-container">
                    <span class="original-price">${formatPrice(f.price)}</span>
                    <span class="discounted-price">${formatPrice(f.discounted_price || f.price * (1 - f.discount_percent / 100))}</span>
                  </div>`
                : `<p class="price">${formatPrice(f.price)}</p>`;
              
              return `
                <div class="col-md-6 reveal stagger-${(index % 5) + 1}" style="opacity: 1; transform: translateY(0);">
                  <div class="card h-100 promoted-item">
                    <div class="card-img-wrapper">
                      <img src="${normalizeImageUrl(f.image_url)}" class="card-img-top" alt="${f.airline}" loading="lazy">
                      ${f.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(f.discount_percent)}% OFF</div>` : ''}
                      ${isPromoted(f.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                      <div class="card-overlay">
                        <a href="flight-details.html?id=${f.id}" class="btn btn-primary btn-lg">View Details</a>
                      </div>
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">${f.airline}</h5>
                      <p>${f.origin_city_name || f.origin} → ${f.destination_city_name || f.destination}</p>
                      <p class="text-muted">${formatDate(f.depart_date)}</p>
                      ${f.trip_type ? `<p class="text-muted"><small>${f.trip_type}</small></p>` : ''}
                      ${priceDisplay}
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular flights
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            if (!data.promoted || data.promoted.length === 0) {
              container.innerHTML = '<p class="text-muted">No flights found.</p>';
            } else {
              container.innerHTML = '';
            }
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items
        hasMore = data.results.length >= limit;
        
        // Append flights to container
        const existingCount = container.querySelectorAll('.col-md-4').length;
        const flightsHtml = data.results.map((f, index) => {
          const priceDisplay = f.discount_percent > 0 
            ? `<div class="price-container">
                <span class="original-price">${formatPrice(f.price)}</span>
                <span class="discounted-price">${formatPrice(f.discounted_price || f.price * (1 - f.discount_percent / 100))}</span>
              </div>`
            : `<p class="price">${formatPrice(f.price)}</p>`;
          
          return `
            <div class="col-md-4 reveal stagger-${((existingCount + index) % 5) + 1}" style="opacity: 1; transform: translateY(0);">
              <div class="card h-100">
                <div class="card-img-wrapper">
                  <img src="${normalizeImageUrl(f.image_url)}" class="card-img-top" alt="${f.airline}" loading="lazy">
                  ${f.discount_percent > 0 ? `<div class="discount-badge">${formatPercent(f.discount_percent)}% OFF</div>` : ''}
                  ${isPromoted(f.ad) ? `<div class="promoted-badge" style="position: absolute; top: 10px; left: 10px; z-index: 5;">Promoted</div>` : ''}
                  <div class="card-overlay">
                    <a href="flight-details.html?id=${f.id}" class="btn btn-primary btn-lg">View Details</a>
                  </div>
                </div>
                <div class="card-body">
                  <h5 class="card-title">${f.airline}</h5>
                  <p>${f.origin_city_name || f.origin} → ${f.destination_city_name || f.destination}</p>
                  <p class="text-muted">${formatDate(f.depart_date)}</p>
                  ${f.trip_type ? `<p class="text-muted"><small>${f.trip_type}</small></p>` : ''}
                  ${priceDisplay}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        container.insertAdjacentHTML('beforeend', flightsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        showError('status', error.message || 'Failed to load flights');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadFlights();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadFlights(true);
    }

    window.addEventListener('popstate', function() {
      loadFlights(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
      await loadProvinces();
      initCascadingCityDropdown('originProvinceFilter', 'originCityFilter');
      initCascadingCityDropdown('destinationProvinceFilter', 'destinationCityFilter');
      
      // Trip type button handlers
      document.getElementById('oneWayBtn').addEventListener('click', function() {
        selectedTripType = 'one-way';
        this.classList.add('active');
        document.getElementById('roundTripBtn').classList.remove('active');
        updateURLWithFilters();
        loadFlights(true);
      });
      
      document.getElementById('roundTripBtn').addEventListener('click', function() {
        selectedTripType = 'round-trip';
        this.classList.add('active');
        document.getElementById('oneWayBtn').classList.remove('active');
        updateURLWithFilters();
        loadFlights(true);
      });
      
      loadFlights(true);
    });
  </script>
</body>
</html>
