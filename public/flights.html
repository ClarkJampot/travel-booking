<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Flights</h1>
    
    <!-- Flight Search Form -->
    <div class="flight-search-form">
      <!-- Main Search Fields -->
      <div class="flight-search-fields">
        <!-- Origin Field -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-airplane"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <input type="text" class="flight-field-input" id="originAirportInput" placeholder="Flying from" autocomplete="off">
            <div class="flight-dropdown" id="originAirportDropdown"></div>
          </div>
        </div>
        
        <!-- Swap Button -->
        <button type="button" class="flight-swap-btn" id="swapAirportsBtn" title="Swap airports">
          <i class="bi bi-arrow-left-right"></i>
        </button>
        
        <!-- Destination Field -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <input type="text" class="flight-field-input" id="destinationAirportInput" placeholder="Flying to" autocomplete="off">
            <div class="flight-dropdown" id="destinationAirportDropdown"></div>
          </div>
        </div>
        
        <!-- Search Button -->
        <button type="button" class="flight-search-btn" id="searchFlightsBtn">
          Search
        </button>
      </div>
      
      <!-- Price Range Filter -->
      <div class="flight-filters mt-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Price Range (Economy)</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="number" class="form-control" id="minPrice" placeholder="Min price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
              <div class="col-6">
                <input type="number" class="form-control" id="maxPrice" placeholder="Max price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
            </div>
          </div>
        </div>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Clear Filters</button>
        </div>
      </div>
    </div>
    
    <!-- Hidden inputs for actual values -->
    <input type="hidden" id="originAirportId">
    <input type="hidden" id="destinationAirportId">
    <div id="status"></div>
    
    <!-- Promoted Flights Section -->
    <div id="promotedFlights" class="promoted-section mb-4" style="display: none;">
      <h3 class="mb-3">Promoted Flights</h3>
      <div id="promotedFlightsList" class="list-group mb-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Flights -->
    <div id="flights" class="list-group reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading more...</span>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    let airportsData = [];
    let airportsByCity = {};
    
    // Load airports grouped by city
    async function loadAirports() {
      try {
        const data = await apiCall('/airports');
        airportsData = data.results || [];
        
        // Group airports by city
        airportsByCity = {};
        airportsData.forEach(airport => {
          const cityKey = `${airport.city_name || 'Unknown'}, ${airport.province_name || ''}`;
          if (!airportsByCity[cityKey]) {
            airportsByCity[cityKey] = {
              cityName: airport.city_name,
              provinceName: airport.province_name,
              airports: []
            };
          }
          airportsByCity[cityKey].airports.push(airport);
        });
      } catch (error) {
        console.error('Error loading airports:', error);
      }
    }
    
    // Render airport dropdown
    function renderAirportDropdown(dropdownId, searchTerm = '') {
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      
      const searchLower = searchTerm.toLowerCase();
      let html = '';
      
      Object.keys(airportsByCity).sort().forEach(cityKey => {
        const cityData = airportsByCity[cityKey];
        const cityName = cityData.cityName;
        const provinceName = cityData.provinceName;
        const airports = cityData.airports;
        
        // Check if city matches search
        const cityMatches = !searchTerm || 
          cityName.toLowerCase().includes(searchLower) ||
          provinceName.toLowerCase().includes(searchLower);
        
        // Check if any airport matches
        const matchingAirports = airports.filter(apt => 
          apt.name.toLowerCase().includes(searchLower) ||
          apt.code.toLowerCase().includes(searchLower)
        );
        
        if (cityMatches || matchingAirports.length > 0) {
          // City header with "All airports" option
          html += `
            <div class="flight-dropdown-item" data-type="city" data-city-key="${cityKey}">
              <div class="flight-dropdown-city">${cityName}${provinceName ? ', ' + provinceName : ''}</div>
              <div class="flight-dropdown-city-subtitle">All airports</div>
            </div>
          `;
          
          // Individual airports
          (searchTerm ? matchingAirports : airports).forEach(airport => {
            html += `
              <div class="flight-dropdown-item flight-dropdown-airport" data-type="airport" data-airport-id="${airport.id}" data-airport-code="${airport.code}" data-airport-name="${airport.name}">
                <span class="flight-dropdown-airport-code">${airport.code}</span>
                <span>${airport.name}</span>
              </div>
            `;
          });
        }
      });
      
      dropdown.innerHTML = html || '<div class="flight-dropdown-item">No airports found</div>';
      
      // Add click handlers
      dropdown.querySelectorAll('.flight-dropdown-item').forEach(item => {
        item.addEventListener('click', function() {
          const type = this.dataset.type;
          const inputId = dropdownId === 'originAirportDropdown' ? 'originAirportInput' : 'destinationAirportInput';
          const hiddenId = dropdownId === 'originAirportDropdown' ? 'originAirportId' : 'destinationAirportId';
          const input = document.getElementById(inputId);
          const hidden = document.getElementById(hiddenId);
          
          if (type === 'city') {
            const cityKey = this.dataset.cityKey;
            const cityData = airportsByCity[cityKey];
            input.value = `${cityData.cityName}${cityData.provinceName ? ', ' + cityData.provinceName : ''}`;
            hidden.value = ''; // All airports in city
          } else if (type === 'airport') {
            const code = this.dataset.airportCode;
            const name = this.dataset.airportName;
            input.value = `${code} - ${name}`;
            hidden.value = this.dataset.airportId;
          }
          
          closeAllDropdowns();
        });
      });
    }
    
    // Swap airports
    function swapAirports() {
      const originInput = document.getElementById('originAirportInput');
      const destinationInput = document.getElementById('destinationAirportInput');
      const originHidden = document.getElementById('originAirportId');
      const destinationHidden = document.getElementById('destinationAirportId');
      
      const tempInput = originInput.value;
      const tempHidden = originHidden.value;
      
      originInput.value = destinationInput.value;
      originHidden.value = destinationHidden.value;
      destinationInput.value = tempInput;
      destinationHidden.value = tempHidden;
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        origin_airport_id: params.get('origin_airport_id') || '',
        destination_airport_id: params.get('destination_airport_id') || '',
        min_price: params.get('min_price') || '',
        max_price: params.get('max_price') || '',
        page: parseInt(params.get('page')) || 1
      };
    }

    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }

    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const originAirportId = document.getElementById('originAirportId').value;
      const destinationAirportId = document.getElementById('destinationAirportId').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (originAirportId) params.set('origin_airport_id', originAirportId);
      if (destinationAirportId) params.set('destination_airport_id', destinationAirportId);
      if (minPrice) params.set('min_price', minPrice);
      if (maxPrice) params.set('max_price', maxPrice);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadFlights(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        document.getElementById('flights').innerHTML = '';
        const promotedContainer = document.getElementById('promotedFlights');
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'block';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/flights?limit=${limit}&page=${currentPage}`;
        
        // Only add filters if they're set
        if (urlParams.origin_airport_id) url += `&origin_airport_id=${urlParams.origin_airport_id}`;
        if (urlParams.destination_airport_id) url += `&destination_airport_id=${urlParams.destination_airport_id}`;
        if (urlParams.min_price) url += `&min_price=${urlParams.min_price}`;
        if (urlParams.max_price) url += `&max_price=${urlParams.max_price}`;
        
        const data = await apiCall(url);
        if (!data) {
          console.error('No data returned from API');
          isLoading = false;
          loadingIndicator.style.display = 'none';
          return;
        }
        
        console.log('API response:', data);
        const container = document.getElementById('flights');
        const promotedContainer = document.getElementById('promotedFlights');
        
        // Display promoted flights (only on first page/reset)
        if (reset || currentPage === 1) {
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const promotedList = document.getElementById('promotedFlightsList');
            promotedList.innerHTML = '';
            promotedList.innerHTML = data.promoted.slice(0, 2).map((f, index) => {
              const basePrice = f.price || f.base_price_economy;
              const discountedPrice = f.discount_percent > 0 
                ? (f.discounted_price || basePrice * (1 - f.discount_percent / 100))
                : basePrice;
              
              return `
                <a href="flight-details.html?id=${f.id}" class="list-group-item list-group-item-action">
                  <div class="d-flex w-100 justify-content-between align-items-center">
                    <div class="flex-grow-1">
                      <div class="d-flex align-items-center mb-2">
                        <h5 class="mb-0 me-2">${f.airline}</h5>
                        ${isPromoted(f.ad) ? '<span class="badge bg-warning text-dark me-2">Promoted</span>' : ''}
                        ${f.discount_percent > 0 ? `<span class="badge bg-danger me-2">${formatPercent(f.discount_percent)}% OFF</span>` : ''}
                      </div>
                      ${(() => {
                        const originDisplay = f.origin_city_name ? `${f.origin_city_name} (${f.origin_code || ''})` : (f.origin_code || '');
                        const destinationDisplay = f.destination_city_name ? `${f.destination_city_name} (${f.destination_code || ''})` : (f.destination_code || '');
                        return `<p class="mb-1">${originDisplay} → ${destinationDisplay}</p>`;
                      })()}
                    </div>
                    <div class="text-end ms-3">
                      ${f.discount_percent > 0 
                        ? `<div><span class="text-decoration-line-through text-muted small">${formatPrice(basePrice)}</span><br><strong class="text-primary">${formatPrice(discountedPrice)}</strong></div>`
                        : `<div><strong class="text-primary">From ${formatPrice(basePrice)}</strong></div>`
                      }
                    </div>
                  </div>
                </a>
              `;
            }).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular flights
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            if (!data.promoted || data.promoted.length === 0) {
              const hasFilters = urlParams.origin_airport_id || urlParams.destination_airport_id;
              if (hasFilters) {
                container.innerHTML = '<p class="text-muted">No flights found matching your criteria. Try adjusting your search filters.</p>';
              } else {
                container.innerHTML = '<p class="text-muted">Currently no flights available. If you\'re an agency, <a href="register.html">register</a> or <a href="login.html">sign in</a> as an agency to make a listing!</p>';
              }
            } else {
              container.innerHTML = '';
            }
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items - stop if we got fewer results than the limit
        hasMore = data.results.length === limit;
        
        // Append flights to container as list items
        const flightsHtml = data.results.map((f, index) => {
          const basePrice = f.price || f.base_price_economy;
          const discountedPrice = f.discount_percent > 0 
            ? (f.discounted_price || basePrice * (1 - f.discount_percent / 100))
            : basePrice;
          
          return `
            <a href="flight-details.html?id=${f.id}" class="list-group-item list-group-item-action">
              <div class="d-flex w-100 justify-content-between align-items-center">
                <div class="flex-grow-1">
                  <div class="d-flex align-items-center mb-2">
                    <h5 class="mb-0 me-2">${f.airline}</h5>
                    ${isPromoted(f.ad) ? '<span class="badge bg-warning text-dark me-2">Promoted</span>' : ''}
                    ${f.discount_percent > 0 ? `<span class="badge bg-danger me-2">${formatPercent(f.discount_percent)}% OFF</span>` : ''}
                  </div>
                  ${(() => {
                    const originDisplay = f.origin_city_name ? `${f.origin_city_name} (${f.origin_code || ''})` : (f.origin_code || '');
                    const destinationDisplay = f.destination_city_name ? `${f.destination_city_name} (${f.destination_code || ''})` : (f.destination_code || '');
                    return `<p class="mb-1">${originDisplay} → ${destinationDisplay}</p>`;
                  })()}
                </div>
                <div class="text-end ms-3">
                  ${f.discount_percent > 0 
                    ? `<div><span class="text-decoration-line-through text-muted small">${formatPrice(basePrice)}</span><br><strong class="text-primary">${formatPrice(discountedPrice)}</strong></div>`
                    : `<div><strong class="text-primary">From ${formatPrice(basePrice)}</strong></div>`
                  }
                </div>
              </div>
            </a>
          `;
        }).join('');
        
        container.insertAdjacentHTML('beforeend', flightsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        showError('status', error.message || 'Failed to load flights');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadFlights();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadFlights(true);
    }

    window.addEventListener('popstate', function() {
      loadFlights(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
      await loadAirports();
      enforceIntegerInput('minPrice');
      enforceIntegerInput('maxPrice');
      
      // Initialize dropdowns
      renderAirportDropdown('originAirportDropdown');
      renderAirportDropdown('destinationAirportDropdown');
      
      // Load URL params into form
      const urlParams = getUrlParams();
      if (urlParams.origin_airport_id) {
        const airport = airportsData.find(a => a.id == urlParams.origin_airport_id);
        if (airport) {
          document.getElementById('originAirportInput').value = `${airport.code} - ${airport.name}`;
          document.getElementById('originAirportId').value = airport.id;
        }
      }
      if (urlParams.destination_airport_id) {
        const airport = airportsData.find(a => a.id == urlParams.destination_airport_id);
        if (airport) {
          document.getElementById('destinationAirportInput').value = `${airport.code} - ${airport.name}`;
          document.getElementById('destinationAirportId').value = airport.id;
        }
      }
      
      // Close all dropdowns
      function closeAllDropdowns() {
        document.querySelectorAll('.flight-dropdown').forEach(d => d.classList.remove('show'));
        document.querySelectorAll('.flight-field-wrapper').forEach(w => w.classList.remove('focused'));
      }
      
      // Position dropdown relative to input field
      function positionDropdown(inputElement, dropdownElement) {
        const rect = inputElement.getBoundingClientRect();
        dropdownElement.style.top = (rect.bottom + window.scrollY + 8) + 'px';
        dropdownElement.style.left = (rect.left + window.scrollX) + 'px';
        dropdownElement.style.width = rect.width + 'px';
      }
      
      // Airport input handlers
      ['originAirportInput', 'destinationAirportInput'].forEach(inputId => {
        const input = document.getElementById(inputId);
        const dropdownId = inputId === 'originAirportInput' ? 'originAirportDropdown' : 'destinationAirportDropdown';
        
        input.addEventListener('focus', function() {
          closeAllDropdowns();
          this.parentElement.parentElement.classList.add('focused');
          const dropdown = document.getElementById(dropdownId);
          positionDropdown(this.parentElement.parentElement, dropdown);
          dropdown.classList.add('show');
          renderAirportDropdown(dropdownId, this.value);
        });
        
        input.addEventListener('input', function() {
          renderAirportDropdown(dropdownId, this.value);
        });
        
        input.addEventListener('blur', function() {
          setTimeout(() => {
            document.getElementById(dropdownId).classList.remove('show');
            this.parentElement.parentElement.classList.remove('focused');
          }, 200);
        });
      });
      
      // Swap button
      document.getElementById('swapAirportsBtn').addEventListener('click', swapAirports);
      
      // Search button
      document.getElementById('searchFlightsBtn').addEventListener('click', function() {
        closeAllDropdowns();
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Clear filters
      document.getElementById('clearFiltersBtn').addEventListener('click', function() {
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Apply filters on price change
      document.getElementById('minPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadFlights(true);
      });
      
      document.getElementById('maxPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Initialize filters from URL
      const filterUrlParams = getUrlParams();
      if (filterUrlParams.min_price) {
        document.getElementById('minPrice').value = filterUrlParams.min_price;
      }
      if (filterUrlParams.max_price) {
        document.getElementById('maxPrice').value = filterUrlParams.max_price;
      }
      
      // Close dropdowns when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.flight-field-wrapper') && 
            !e.target.closest('.flight-dropdown')) {
          closeAllDropdowns();
        }
      });
      
      // Handle Enter key on inputs
      document.querySelectorAll('.flight-field-input').forEach(input => {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            closeAllDropdowns();
            updateURLWithFilters();
            loadFlights(true);
          }
        });
      });
      
      // Handle window resize and scroll to reposition dropdowns
      function repositionActiveDropdowns() {
        document.querySelectorAll('.flight-dropdown.show').forEach(dropdown => {
          let inputId = '';
          if (dropdown.id === 'originAirportDropdown') inputId = 'originAirportInput';
          else if (dropdown.id === 'destinationAirportDropdown') inputId = 'destinationAirportInput';
          
          if (inputId) {
            const input = document.getElementById(inputId);
            if (input) {
              positionDropdown(input.parentElement.parentElement, dropdown);
            }
          }
        });
      }
      
      window.addEventListener('resize', repositionActiveDropdowns);
      window.addEventListener('scroll', repositionActiveDropdowns, true);
      
      // Initial load - show all flights if no filters
      loadFlights(true);
    });
  </script>
</body>
</html>
