<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flights - Travel Booking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">Bookings</a>
      <a href="auth.html">Auth</a>
    </nav>
  </header>
  <main>
    <h1>Flights</h1>
    <div class="row">
      <label>Origin <input id="origin" placeholder="MNL"></label>
      <label>Destination <input id="destination" placeholder="CEB"></label>
      <label>Date <input id="date" type="date"></label>
      <button onclick="loadFlights()">Search</button>
    </div>
    <div id="status" class="muted"></div>
    <div id="list" class="grid"></div>
  </main>
  <script>
    async function loadFlights() {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      list.innerHTML = '';
      status.textContent = 'Loading...';
      const q = new URLSearchParams();
      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const date = document.getElementById('date').value;
      if (origin) q.set('origin', origin);
      if (destination) q.set('destination', destination);
      if (date) q.set('date', date);
      try {
        const res = await fetch('api/flights?' + q.toString());
        const data = await res.json();
        status.textContent = '';
        (data.results || []).forEach(f => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<strong>${f.airline}</strong><div class="muted">${f.origin} → ${f.destination}</div><div>${f.depart_date} · ₱${Number(f.price).toFixed(2)}</div>`;
          list.appendChild(div);
        });
        if (!list.children.length) status.textContent = 'No flights found.';
      } catch (e) {
        status.textContent = 'Failed to load flights.';
        console.error(e);
      }
    }
    window.addEventListener('DOMContentLoaded', loadFlights);
  </script>
</body>
</html>
