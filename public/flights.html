<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Flights</h1>
    
    <!-- Flight Search Form -->
    <div class="flight-search-form">
      <!-- Main Search Fields -->
      <div class="flight-search-fields">
        <!-- Origin Field -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-airplane"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <input type="text" class="flight-field-input" id="originAirportInput" placeholder="Flying from" autocomplete="off">
            <div class="flight-dropdown" id="originAirportDropdown"></div>
          </div>
        </div>
        
        <!-- Swap Button -->
        <button type="button" class="flight-swap-btn" id="swapAirportsBtn" title="Swap airports">
          <i class="bi bi-arrow-left-right"></i>
        </button>
        
        <!-- Destination Field -->
        <div class="flight-field-wrapper">
          <div class="flight-field-icon">
            <i class="bi bi-geo-alt"></i>
          </div>
          <div class="flight-field-input-wrapper">
            <input type="text" class="flight-field-input" id="destinationAirportInput" placeholder="Flying to" autocomplete="off">
            <div class="flight-dropdown" id="destinationAirportDropdown"></div>
          </div>
        </div>
        
        <!-- Search Button -->
        <button type="button" class="flight-search-btn" id="searchFlightsBtn">
          Search
        </button>
      </div>
      
      <!-- Price Range Filter -->
      <div class="flight-filters mt-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Price Range (Economy)</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="number" class="form-control" id="minPrice" placeholder="Min price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
              <div class="col-6">
                <input type="number" class="form-control" id="maxPrice" placeholder="Max price" min="0" step="100" inputmode="numeric" pattern="[0-9]*">
              </div>
            </div>
          </div>
        </div>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Clear Filters</button>
        </div>
      </div>
    </div>
    
    <!-- Hidden inputs for actual values -->
    <input type="hidden" id="originAirportId">
    <input type="hidden" id="destinationAirportId">
    <input type="hidden" id="originCityId">
    <input type="hidden" id="destinationCityId">
    <div id="status"></div>
    
    <!-- Promoted Flights Section -->
    <div id="promotedFlights" class="promoted-section mb-4" style="display: none;">
      <div id="promotedFlightsHeader"></div>
      <div id="promotedFlightsList" class="list-group mb-4">
        <!-- Loaded dynamically -->
      </div>
    </div>
    
    <!-- Regular Flights -->
    <div id="flights" class="list-group reveal"></div>
  </div>
  
  <div id="loadingMore" class="container text-center mt-4 mb-5" style="display: none;"></div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();
    loadComponent('loadingMore', 'components/loading-more.html');
    
    let currentPage = 1;
    const limit = 12;
    let isLoading = false;
    let hasMore = true;
    let airportsData = [];
    let airportsByCity = {};
    
    // Load airports grouped by city
    async function loadAirports() {
      try {
        const data = await apiCall('/airports');
        airportsData = data.results || [];
        
        // Group airports by city
        airportsByCity = {};
        airportsData.forEach(airport => {
          const cityKey = `${airport.city_name || 'Unknown'}, ${airport.province_name || ''}`;
          if (!airportsByCity[cityKey]) {
        airportsByCity[cityKey] = {
          cityId: airport.city_id,
          cityName: airport.city_name,
          provinceName: airport.province_name,
          airports: []
        };
          }
          airportsByCity[cityKey].airports.push(airport);
        });
      } catch (error) {
        console.error('Error loading airports:', error);
      }
    }
    
    // Render airport dropdown
    function renderAirportDropdown(dropdownId, searchTerm = '') {
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:144',message:'renderAirportDropdown called',data:{dropdownId,searchTerm,searchTermLength:searchTerm.length},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
      // #endregion
      const dropdown = document.getElementById(dropdownId);
      if (!dropdown) return;
      
      const searchLower = searchTerm.toLowerCase();
      let html = '';
      
      Object.keys(airportsByCity).sort().forEach(cityKey => {
        const cityData = airportsByCity[cityKey];
        const cityName = cityData.cityName;
        const provinceName = cityData.provinceName;
        const airports = cityData.airports;
        
        // Check if city matches search
        const cityMatches = !searchTerm || 
          cityName.toLowerCase().includes(searchLower) ||
          provinceName.toLowerCase().includes(searchLower);
        
        // Check if any airport matches (include city/province match so airports surface with city search)
        const matchingAirports = airports.filter(apt => 
          apt.name.toLowerCase().includes(searchLower) ||
          apt.code.toLowerCase().includes(searchLower) ||
          cityMatches
        );
        
        if (cityMatches || matchingAirports.length > 0) {
          // City header with "All airports" option
          html += `
            <div class="flight-dropdown-item" data-type="city" data-city-key="${cityKey}">
              <div class="flight-dropdown-city">${cityName}${provinceName ? ', ' + provinceName : ''}</div>
              <div class="flight-dropdown-city-subtitle">All airports</div>
            </div>
          `;
          
          // Individual airports
          (searchTerm ? matchingAirports : airports).forEach(airport => {
            html += `
              <div class="flight-dropdown-item flight-dropdown-airport" data-type="airport" data-airport-id="${airport.id}" data-airport-code="${airport.code}" data-airport-name="${airport.name}" data-city-id="${airport.city_id}">
                <span class="flight-dropdown-airport-code">${airport.code}</span>
                <span>${airport.name}</span>
              </div>
            `;
          });
        }
      });
      
      // #region agent log
      fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:190',message:'Before setting dropdown HTML',data:{htmlLength:html.length,hasHtml:html.length>0,searchTerm},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
      // #endregion
      dropdown.innerHTML = html || '<div class="flight-dropdown-item">No airports found</div>';
      
      // Add click handlers
      dropdown.querySelectorAll('.flight-dropdown-item').forEach(item => {
        item.addEventListener('click', function() {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:194',message:'Dropdown item clicked',data:{type:this.dataset.type,dropdownId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
          // #endregion
          const type = this.dataset.type;
          const inputId = dropdownId === 'originAirportDropdown' ? 'originAirportInput' : 'destinationAirportInput';
          const hiddenId = dropdownId === 'originAirportDropdown' ? 'originAirportId' : 'destinationAirportId';
          const cityHiddenId = dropdownId === 'originAirportDropdown' ? 'originCityId' : 'destinationCityId';
          const input = document.getElementById(inputId);
          const hidden = document.getElementById(hiddenId);
          const cityHidden = document.getElementById(cityHiddenId);
          
          // Close dropdown and remove focused class BEFORE setting value
          // This prevents the input event from re-rendering the dropdown
          closeAllDropdowns();
          input.parentElement.parentElement.classList.remove('focused');
          
          if (type === 'city') {
            const cityKey = this.dataset.cityKey;
            const cityData = airportsByCity[cityKey];
            const newValue = `${cityData.cityName}${cityData.provinceName ? ', ' + cityData.provinceName : ''}`;
            // #region agent log
            fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:206',message:'Setting city input value',data:{newValue,oldValue:input.value},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
            // #endregion
            input.value = newValue;
            hidden.value = ''; // All airports in city
            cityHidden.value = cityData.cityId || '';
          } else if (type === 'airport') {
            const code = this.dataset.airportCode;
            const name = this.dataset.airportName;
            const newValue = `${code} - ${name}`;
            // #region agent log
            fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:212',message:'Setting airport input value',data:{newValue,oldValue:input.value,code,name},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
            // #endregion
            input.value = newValue;
            hidden.value = this.dataset.airportId;
            cityHidden.value = this.dataset.cityId || '';
          }
          
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:217',message:'After setting values and closing dropdown',data:{inputValue:input.value,dropdownVisible:dropdown.classList.contains('show')},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'B'})}).catch(()=>{});
          // #endregion
        });
      });
    }
    
    // Close all dropdowns - moved to top level scope
    function closeAllDropdowns() {
      // #region agent log
      const dropdownsBefore = Array.from(document.querySelectorAll('.flight-dropdown')).map(d => ({id:d.id,visible:d.classList.contains('show')}));
      fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:222',message:'closeAllDropdowns called',data:{dropdownsBefore},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'B'})}).catch(()=>{});
      // #endregion
      document.querySelectorAll('.flight-dropdown').forEach(d => d.classList.remove('show'));
      document.querySelectorAll('.flight-field-wrapper').forEach(w => w.classList.remove('focused'));
      // #region agent log
      const dropdownsAfter = Array.from(document.querySelectorAll('.flight-dropdown')).map(d => ({id:d.id,visible:d.classList.contains('show')}));
      fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:225',message:'closeAllDropdowns completed',data:{dropdownsAfter},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'B'})}).catch(()=>{});
      // #endregion
    }
    
    // Swap airports
    function swapAirports() {
      const originInput = document.getElementById('originAirportInput');
      const destinationInput = document.getElementById('destinationAirportInput');
      const originHidden = document.getElementById('originAirportId');
      const destinationHidden = document.getElementById('destinationAirportId');
      
      const tempInput = originInput.value;
      const tempHidden = originHidden.value;
      
      originInput.value = destinationInput.value;
      originHidden.value = destinationHidden.value;
      destinationInput.value = tempInput;
      destinationHidden.value = tempHidden;
    }
    
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        origin_airport_id: params.get('origin_airport_id') || '',
        destination_airport_id: params.get('destination_airport_id') || '',
        origin_city_id: params.get('origin_city_id') || '',
        destination_city_id: params.get('destination_city_id') || '',
        min_price: params.get('min_price') || '',
        max_price: params.get('max_price') || '',
        page: parseInt(params.get('page')) || 1
      };
    }
    
    // Force integer-only values on numeric inputs
    function enforceIntegerInput(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const sanitize = () => {
        const cleaned = el.value.replace(/[^0-9]/g, '');
        el.value = cleaned;
      };
      el.addEventListener('input', sanitize);
      el.addEventListener('change', sanitize);
      sanitize();
    }
    
    function updateURLWithFilters() {
      const params = new URLSearchParams();
      const originAirportId = document.getElementById('originAirportId').value;
      const destinationAirportId = document.getElementById('destinationAirportId').value;
      const originCityId = document.getElementById('originCityId').value;
      const destinationCityId = document.getElementById('destinationCityId').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      
      if (originAirportId) params.set('origin_airport_id', originAirportId);
      if (destinationAirportId) params.set('destination_airport_id', destinationAirportId);
      if (originCityId) params.set('origin_city_id', originCityId);
      if (destinationCityId) params.set('destination_city_id', destinationCityId);
      if (minPrice) params.set('min_price', minPrice);
      if (maxPrice) params.set('max_price', maxPrice);
      
      const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
      window.history.pushState({}, '', newURL);
    }
    
    async function loadFlights(reset = false) {
      if (isLoading || (!hasMore && !reset)) return;
      
      isLoading = true;
      const loadingIndicator = document.getElementById('loadingMore');
      const container = document.getElementById('flights');
      
      if (reset) {
        currentPage = 1;
        hasMore = true;
        container.innerHTML = renderSkeletonList(limit, 'col-12', false, 2);
        const promotedContainer = document.getElementById('promotedFlights');
        promotedContainer.style.display = 'none';
        loadingIndicator.style.display = 'none';
      } else {
        loadingIndicator.style.display = 'block';
      }
      
      try {
        const urlParams = getUrlParams();
        let url = `/flights?limit=${limit}&page=${currentPage}`;
        
        if (urlParams.origin_airport_id) url += `&origin_airport_id=${urlParams.origin_airport_id}`;
        else if (urlParams.origin_city_id) url += `&origin_city_id=${urlParams.origin_city_id}`;
        if (urlParams.destination_airport_id) url += `&destination_airport_id=${urlParams.destination_airport_id}`;
        else if (urlParams.destination_city_id) url += `&destination_city_id=${urlParams.destination_city_id}`;
        if (urlParams.min_price) url += `&min_price=${urlParams.min_price}`;
        if (urlParams.max_price) url += `&max_price=${urlParams.max_price}`;
        
        const data = await apiCall(url);
        if (!data) {
          console.error('No data returned from API');
          isLoading = false;
          loadingIndicator.style.display = 'none';
          return;
        }
        
        console.log('API response:', data);
        const promotedContainer = document.getElementById('promotedFlights');
        
        // Display promoted flights (only on first page/reset)
        if (reset || currentPage === 1) {
          container.innerHTML = '';
          if (data.promoted && data.promoted.length > 0) {
            promotedContainer.style.display = 'block';
            const header = document.getElementById('promotedFlightsHeader');
            header.innerHTML = renderSectionHeader({ title: 'Promoted Flights' });
            const promotedList = document.getElementById('promotedFlightsList');
            promotedList.innerHTML = data.promoted.slice(0, 2).map((f) => renderFlightListItem(f)).join('');
          } else {
            promotedContainer.style.display = 'none';
          }
        }
        
        // Display regular flights
        if (!data || !data.results || data.results.length === 0) {
          if (currentPage === 1) {
            const hasFilters = urlParams.origin_airport_id || urlParams.destination_airport_id || urlParams.min_price || urlParams.max_price;
            container.innerHTML = hasFilters
              ? renderEmptyState({ message: 'No flights found matching your criteria. Try adjusting your search filters.' })
              : renderEmptyState({ message: 'Currently no flights available.' });
          }
          hasMore = false;
          loadingIndicator.style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Check if we have more items - stop if we got fewer results than the limit
        hasMore = data.results.length === limit;
        
        // Append flights to container as list items
        const flightsHtml = data.results.map((f) => renderFlightListItem(f)).join('');
        
        container.insertAdjacentHTML('beforeend', flightsHtml);
        currentPage++;
        loadingIndicator.style.display = 'none';
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load flights');
        hasMore = false;
        loadingIndicator.style.display = 'none';
      } finally {
        isLoading = false;
      }
    }
    
    let scrollTimeout;
    function setupInfiniteScroll() {
      window.addEventListener('scroll', () => {
        if (isLoading || !hasMore) return;
        
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(() => {
          scrollTimeout = null;
          
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          
          if (scrollTop + windowHeight >= documentHeight - 300) {
            const loadingIndicator = document.getElementById('loadingMore');
            loadingIndicator.style.display = 'block';
            loadFlights();
          }
        }, 100);
      });
    }

    function handleFilterClick() {
      updateURLWithFilters();
      loadFlights(true);
    }

    window.addEventListener('popstate', function() {
      loadFlights(true);
    });

    document.addEventListener('DOMContentLoaded', async function() {
      setupInfiniteScroll();
      await loadAirports();
      enforceIntegerInput('minPrice');
      enforceIntegerInput('maxPrice');
      
      // Initialize dropdowns
      renderAirportDropdown('originAirportDropdown');
      renderAirportDropdown('destinationAirportDropdown');
      
      // Load URL params into form
      const urlParams = getUrlParams();
      if (urlParams.origin_airport_id) {
        const airport = airportsData.find(a => a.id == urlParams.origin_airport_id);
        if (airport) {
          document.getElementById('originAirportInput').value = `${airport.code} - ${airport.name}`;
          document.getElementById('originAirportId').value = airport.id;
          document.getElementById('originCityId').value = airport.city_id || '';
        }
      } else if (urlParams.origin_city_id) {
        const cityAirport = airportsData.find(a => a.city_id == urlParams.origin_city_id);
        if (cityAirport) {
          document.getElementById('originAirportInput').value = `${cityAirport.city_name}${cityAirport.province_name ? ', ' + cityAirport.province_name : ''}`;
          document.getElementById('originCityId').value = cityAirport.city_id;
        }
      }
      if (urlParams.destination_airport_id) {
        const airport = airportsData.find(a => a.id == urlParams.destination_airport_id);
        if (airport) {
          document.getElementById('destinationAirportInput').value = `${airport.code} - ${airport.name}`;
          document.getElementById('destinationAirportId').value = airport.id;
          document.getElementById('destinationCityId').value = airport.city_id || '';
        }
      } else if (urlParams.destination_city_id) {
        const cityAirport = airportsData.find(a => a.city_id == urlParams.destination_city_id);
        if (cityAirport) {
          document.getElementById('destinationAirportInput').value = `${cityAirport.city_name}${cityAirport.province_name ? ', ' + cityAirport.province_name : ''}`;
          document.getElementById('destinationCityId').value = cityAirport.city_id;
        }
      }
      
      // Position dropdown relative to input field
      function positionDropdown(inputElement, dropdownElement) {
        const rect = inputElement.getBoundingClientRect();
        dropdownElement.style.top = (rect.bottom + window.scrollY + 8) + 'px';
        dropdownElement.style.left = (rect.left + window.scrollX) + 'px';
        dropdownElement.style.width = rect.width + 'px';
      }
      
      // Airport input handlers
      ['originAirportInput', 'destinationAirportInput'].forEach(inputId => {
        const input = document.getElementById(inputId);
        const dropdownId = inputId === 'originAirportInput' ? 'originAirportDropdown' : 'destinationAirportDropdown';
        
        input.addEventListener('focus', function() {
          if (typeof closeAllDropdowns === 'function') {
            closeAllDropdowns();
          }
          this.parentElement.parentElement.classList.add('focused');
          const dropdown = document.getElementById(dropdownId);
          positionDropdown(this.parentElement.parentElement, dropdown);
          dropdown.classList.add('show');
          // If a selection has been made, store the current value and clear the input so user can immediately start typing to search
          const hiddenId = inputId === 'originAirportInput' ? 'originAirportId' : 'destinationAirportId';
          const cityHiddenId = inputId === 'originAirportInput' ? 'originCityId' : 'destinationCityId';
          const hidden = document.getElementById(hiddenId);
          const cityHidden = document.getElementById(cityHiddenId);
          const hasSelection = (hidden && hidden.value) || (cityHidden && cityHidden.value);
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:493',message:'Focus event',data:{hasSelection,currentValue:this.value},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'C'})}).catch(()=>{});
          // #endregion
          if (hasSelection) {
            // Store the selected value to restore on blur if user doesn't select a new item
            this.dataset.previousValue = this.value;
            // Clear input so user can immediately start typing to search
            this.value = '';
            renderAirportDropdown(dropdownId, '');
          } else {
            // Use current value for search
            renderAirportDropdown(dropdownId, this.value);
          }
        });
        
        input.addEventListener('input', function() {
          // #region agent log
          fetch('http://127.0.0.1:7242/ingest/a19a3953-2389-4767-8ef4-ccc15e5cb6bc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'flights.html:500',message:'Input event triggered',data:{inputValue:this.value,dropdownId,isFocused:this.parentElement.parentElement.classList.contains('focused')},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'A'})}).catch(()=>{});
          // #endregion
          // Only render dropdown if the field is focused (user is typing, not programmatic change)
          if (this.parentElement.parentElement.classList.contains('focused')) {
            renderAirportDropdown(dropdownId, this.value);
          }
        });
        
        input.addEventListener('blur', function() {
          setTimeout(() => {
            document.getElementById(dropdownId).classList.remove('show');
            this.parentElement.parentElement.classList.remove('focused');
            // If user didn't select anything and had a previous value, restore it
            const hiddenId = inputId === 'originAirportInput' ? 'originAirportId' : 'destinationAirportId';
            const cityHiddenId = inputId === 'originAirportInput' ? 'originCityId' : 'destinationCityId';
            const hidden = document.getElementById(hiddenId);
            const cityHidden = document.getElementById(cityHiddenId);
            const hasSelection = (hidden && hidden.value) || (cityHidden && cityHidden.value);
            if (hasSelection && !this.value.trim() && this.dataset.previousValue) {
              this.value = this.dataset.previousValue;
              delete this.dataset.previousValue;
            }
          }, 200);
        });
      });
      
      // Swap button
      document.getElementById('swapAirportsBtn').addEventListener('click', swapAirports);
      
      // Search button
    document.getElementById('searchFlightsBtn').addEventListener('click', function() {
      closeAllDropdowns();
      updateURLWithFilters();
      loadFlights(true);
      });
      
      // Clear filters
      document.getElementById('clearFiltersBtn').addEventListener('click', function() {
        document.getElementById('originAirportInput').value = '';
        document.getElementById('destinationAirportInput').value = '';
        document.getElementById('originAirportId').value = '';
        document.getElementById('destinationAirportId').value = '';
        document.getElementById('originCityId').value = '';
        document.getElementById('destinationCityId').value = '';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Apply filters on price change
      document.getElementById('minPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadFlights(true);
      });
      
      document.getElementById('maxPrice').addEventListener('change', function() {
        updateURLWithFilters();
        loadFlights(true);
      });
      
      // Initialize filters from URL
      const filterUrlParams = getUrlParams();
      if (filterUrlParams.min_price) {
        document.getElementById('minPrice').value = filterUrlParams.min_price;
      }
      if (filterUrlParams.max_price) {
        document.getElementById('maxPrice').value = filterUrlParams.max_price;
      }
      
      // Close dropdowns when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.flight-field-wrapper') && 
            !e.target.closest('.flight-dropdown')) {
          closeAllDropdowns();
        }
      });
      
      // Handle Enter key on inputs
      document.querySelectorAll('.flight-field-input').forEach(input => {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            closeAllDropdowns();
            updateURLWithFilters();
            loadFlights(true);
          }
        });
      });
      
      // Handle window resize and scroll to reposition dropdowns
      function repositionActiveDropdowns() {
        document.querySelectorAll('.flight-dropdown.show').forEach(dropdown => {
          let inputId = '';
          if (dropdown.id === 'originAirportDropdown') inputId = 'originAirportInput';
          else if (dropdown.id === 'destinationAirportDropdown') inputId = 'destinationAirportInput';
          
          if (inputId) {
            const input = document.getElementById(inputId);
            if (input) {
              positionDropdown(input.parentElement.parentElement, dropdown);
            }
          }
        });
      }
      
      window.addEventListener('resize', repositionActiveDropdowns);
      window.addEventListener('scroll', repositionActiveDropdowns, true);
      
      // Initial load - show all flights if no filters
      loadFlights(true);
    });
  </script>
</body>
</html>
