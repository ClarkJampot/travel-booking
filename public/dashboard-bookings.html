<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings Management - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="reveal">Bookings Management</h1>
      <a href="dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>
    
    <!-- Filters -->
    <div class="filter-section mb-4">
      <div class="row">
        <div class="col-md-3">
          <label for="typeFilter" class="form-label">Type</label>
          <select class="form-control" id="typeFilter">
            <option value="">All Types</option>
            <option value="hotel">Hotels</option>
            <option value="flight">Flights</option>
            <option value="activity">Activities</option>
            <option value="transfer">Transfers</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="statusFilter" class="form-label">Status</label>
          <select class="form-control" id="statusFilter">
            <option value="">All Statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" onclick="applyFilters()">Apply Filters</button>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>
    
    <div id="status"></div>
    <div id="bookings" class="reveal">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication and role
    const user = getCurrentUser();
    if (!isAuthenticated() || !user) {
      alert('Please log in to access bookings management.');
      window.location.href = 'login.html';
    } else if (user.role !== 'owner' && user.role !== 'agency') {
      alert('Bookings management is only available for owners and agencies.');
      window.location.href = 'index.html';
    }

    function getUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        item_type: urlParams.get('item_type') || document.getElementById('typeFilter')?.value || '',
        status: urlParams.get('status') || document.getElementById('statusFilter')?.value || ''
      };
    }
    
    function updateURLWithFilters() {
      const params = getUrlParams();
      const url = new URL(window.location);
      if (params.item_type) url.searchParams.set('item_type', params.item_type);
      else url.searchParams.delete('item_type');
      if (params.status) url.searchParams.set('status', params.status);
      else url.searchParams.delete('status');
      window.history.pushState({}, '', url);
    }
    
    function applyFilters() {
      updateURLWithFilters();
      loadBookings();
    }
    
    function clearFilters() {
      document.getElementById('typeFilter').value = '';
      document.getElementById('statusFilter').value = '';
      window.history.pushState({}, '', window.location.pathname);
      loadBookings();
    }
    
    async function loadBookings() {
      showLoading('bookings');
      clearStatus('status');
      
      try {
        const params = getUrlParams();
        let url = '/dashboard/bookings?limit=50';
        if (params.item_type) url += `&item_type=${encodeURIComponent(params.item_type)}`;
        if (params.status) url += `&status=${encodeURIComponent(params.status)}`;
        
        const data = await apiCall(url);
        const container = document.getElementById('bookings');
        
        // Update filter values from URL
        if (params.item_type) document.getElementById('typeFilter').value = params.item_type;
        if (params.status) document.getElementById('statusFilter').value = params.status;
        
        if (data.results.length === 0) {
          container.innerHTML = renderEmptyState({ message: 'No bookings found.' });
          return;
        }
        
        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Type</th>
                  <th>Item</th>
                  <th>Customer</th>
                  <th>Details</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Booked</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.results.map(booking => {
                  const statusClass = booking.status === 'confirmed' ? 'success' : 
                                    booking.status === 'cancelled' ? 'danger' : 'secondary';
                  
                  let details = '';
                  if (booking.type === 'hotel') {
                    details = booking.check_in && booking.check_out 
                      ? `${formatDate(booking.check_in)} - ${formatDate(booking.check_out)}`
                      : 'N/A';
                  } else if (booking.type === 'flight') {
                    details = booking.class ? booking.class.charAt(0).toUpperCase() + booking.class.slice(1) : 'N/A';
                  } else if (booking.type === 'activity') {
                    details = booking.participant_count ? `${booking.participant_count} participant(s)` : 'N/A';
                  } else if (booking.type === 'transfer') {
                    details = booking.passenger_count ? `${booking.passenger_count} passenger(s)` : 'N/A';
                  }
                  
                  return `
                    <tr>
                      <td>#${booking.id}</td>
                      <td>${booking.type.charAt(0).toUpperCase() + booking.type.slice(1)}</td>
                      <td>${booking.item_name || 'N/A'}</td>
                      <td>User #${booking.user_id}</td>
                      <td><small>${details}</small></td>
                      <td>${formatPrice(booking.total_price)}</td>
                      <td><span class="badge bg-${statusClass}">${booking.status.charAt(0).toUpperCase() + booking.status.slice(1)}</span></td>
                      <td><small>${formatDate(booking.booked_at)}</small></td>
                      <td>
                        <div class="btn-group btn-group-sm">
                          <a href="${booking.type === 'hotel' ? 'hotel' : booking.type === 'flight' ? 'flight' : booking.type === 'activity' ? 'activity' : 'transfer'}-details.html?id=${booking.item_id}" class="btn btn-outline-primary">View</a>
                          ${booking.status === 'confirmed' ? `
                            <button class="btn btn-outline-success" onclick="updateStatus(${booking.id}, 'completed')">Complete</button>
                            <button class="btn btn-outline-danger" onclick="updateStatus(${booking.id}, 'cancelled')">Cancel</button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load bookings');
        document.getElementById('bookings').innerHTML = '';
      }
    }
    
    async function updateStatus(bookingId, newStatus) {
      if (!confirm(`Are you sure you want to mark this booking as ${newStatus}?`)) {
        return;
      }
      
      try {
        await apiCall(`/bookings/${bookingId}`, {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus })
        });
        showSuccessToast(`Booking status updated to ${newStatus}`);
        loadBookings();
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to update booking status');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Load filter values from URL on page load
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('item_type')) document.getElementById('typeFilter').value = urlParams.get('item_type');
      if (urlParams.get('status')) document.getElementById('statusFilter').value = urlParams.get('status');
      
      loadBookings();
    });
  </script>
</body>
</html>
