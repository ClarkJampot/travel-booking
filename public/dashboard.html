<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TuklasPH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4 mb-5">
    <h1 class="mb-4 reveal">Dashboard</h1>
    
    <div id="status"></div>
    
    <!-- Overview Stats -->
    <div id="statsSection" class="row g-4 mb-5 reveal">
      <!-- Loaded dynamically -->
    </div>
    
    <!-- Bookings -->
    <div class="card mb-4 reveal">
      <div class="card-header">
        <h5 class="mb-0">Bookings</h5>
      </div>
      <div class="card-body">
        <!-- Filters -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <label for="customerFilter" class="form-label">Customer</label>
            <input type="text" class="form-control" id="customerFilter" placeholder="Customer name">
          </div>
          <div class="col-md-2" id="itemTypeFilterContainer" style="display: none;">
            <label for="itemTypeFilter" class="form-label">Item Type</label>
            <select class="form-select" id="itemTypeFilter">
              <option value="">All Types</option>
              <option value="hotel">Hotels</option>
              <option value="flight">Flights</option>
              <option value="activity">Activities</option>
              <option value="transfer">Transfers</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="statusFilter" class="form-label">Status</label>
            <select class="form-select" id="statusFilter">
              <option value="">All Statuses</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="keywordFilter" class="form-label">Keyword Search</label>
            <input type="text" class="form-control" id="keywordFilter" placeholder="Search...">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="btn-group w-100">
              <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
              <button class="btn btn-outline-secondary" onclick="clearFilters()">Clear</button>
            </div>
          </div>
        </div>
        <div id="recentBookings">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
    
    <!-- Back to Profile -->
    <div class="text-center mb-4">
      <a href="profile.html" class="btn btn-outline-secondary">Back to Profile</a>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/urlHelpers.js"></script>
  <script src="js/utils/componentLoader.js"></script>
  <script src="js/utils/uiHelpers.js"></script>
  <script src="js/utils/renderers.js"></script>
  <script src="js/utils/authHelpers.js"></script>
  <script src="js/utils/locationHelpers.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    loadLayout();

    // Check authentication and role
    const user = getCurrentUser();
    if (!isAuthenticated() || !user) {
      alert('Please log in to access the dashboard.');
      window.location.href = 'login.html';
    } else if (user.role !== 'owner' && user.role !== 'agency') {
      alert('Dashboard is only available for owners and agencies.');
      window.location.href = 'index.html';
    }
    
    // Show/hide item type filter based on user role
    // Owners only handle hotels, so hide the filter
    // Agencies handle flights, activities, transfers (not hotels), so show the filter
    function setupItemTypeFilter() {
      const itemTypeFilter = document.getElementById('itemTypeFilter');
      if (!itemTypeFilter) return;
      
      if (user && user.role === 'agency') {
        document.getElementById('itemTypeFilterContainer').style.display = 'block';
        // Rebuild options without hotel for agencies
        itemTypeFilter.innerHTML = `
          <option value="">All Types</option>
          <option value="flight">Flights</option>
          <option value="activity">Activities</option>
          <option value="transfer">Transfers</option>
        `;
        // If hotel is selected in URL, remove it
        const url = new URL(window.location);
        if (url.searchParams.get('item_type') === 'hotel') {
          url.searchParams.delete('item_type');
          window.history.replaceState({}, '', url);
        }
      } else {
        // For owners, hide the filter and clear any item_type from URL
        document.getElementById('itemTypeFilterContainer').style.display = 'none';
        const url = new URL(window.location);
        url.searchParams.delete('item_type');
        window.history.replaceState({}, '', url);
      }
    }
    
    setupItemTypeFilter();

    async function loadDashboard() {
      showLoading('statsSection');
      clearStatus('status');
      
      try {
        // Load stats
        const statsData = await apiCall('/dashboard');
        const stats = statsData.stats || {};
        
        document.getElementById('statsSection').innerHTML = `
          <div class="col">
            <div class="card text-center">
              <div class="card-body">
                <h3 class="text-primary">${stats.total_bookings || 0}</h3>
                <p class="text-muted mb-0">Total Bookings</p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card text-center">
              <div class="card-body">
                <h3 class="text-success">${formatPrice(stats.total_revenue || 0)}</h3>
                <p class="text-muted mb-0">Total Revenue</p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card text-center">
              <div class="card-body">
                <h3 class="text-info">${stats.total_items || 0}</h3>
                <p class="text-muted mb-0">Active Items</p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card text-center">
              <div class="card-body">
                <h3 class="text-warning">${stats.confirmed_bookings || 0}</h3>
                <p class="text-muted mb-0">Confirmed</p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card text-center">
              <div class="card-body">
                <h3 class="text-secondary">${stats.completed_bookings || 0}</h3>
                <p class="text-muted mb-0">Completed</p>
              </div>
            </div>
          </div>
        `;
        
        // Load bookings with filters
        await loadBookings();
        
      } catch (error) {
        console.error('Error loading dashboard:', error);
        setStatus('status', 'error', error.message || 'Failed to load dashboard');
      }
    }

    function getUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        customer_name: urlParams.get('customer_name') || '',
        item_type: urlParams.get('item_type') || '',
        status: urlParams.get('status') || '',
        keyword: urlParams.get('keyword') || ''
      };
    }
    
    function updateURLWithFilters() {
      const url = new URL(window.location);
      const customerName = document.getElementById('customerFilter').value.trim();
      const itemType = document.getElementById('itemTypeFilter').value;
      const status = document.getElementById('statusFilter').value;
      const keyword = document.getElementById('keywordFilter').value.trim();
      
      if (customerName) url.searchParams.set('customer_name', customerName);
      else url.searchParams.delete('customer_name');
      
      if (itemType) url.searchParams.set('item_type', itemType);
      else url.searchParams.delete('item_type');
      
      if (status) url.searchParams.set('status', status);
      else url.searchParams.delete('status');
      
      if (keyword) url.searchParams.set('keyword', keyword);
      else url.searchParams.delete('keyword');
      
      window.history.pushState({}, '', url);
    }
    
    function applyFilters() {
      updateURLWithFilters();
      loadBookings();
    }
    
    function clearFilters() {
      document.getElementById('customerFilter').value = '';
      document.getElementById('itemTypeFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('keywordFilter').value = '';
      window.history.pushState({}, '', window.location.pathname);
      loadBookings();
    }
    
    async function loadBookings() {
      const bookingsContainer = document.getElementById('recentBookings');
      showLoading('recentBookings');
      clearStatus('status');
      
      try {
        const params = getUrlParams();
        let url = '/dashboard/bookings?limit=50';
        if (params.customer_name) url += `&customer_name=${encodeURIComponent(params.customer_name)}`;
        if (params.item_type) url += `&item_type=${encodeURIComponent(params.item_type)}`;
        if (params.status) url += `&status=${encodeURIComponent(params.status)}`;
        if (params.keyword) url += `&keyword=${encodeURIComponent(params.keyword)}`;
        
        const bookingsData = await apiCall(url);
        const bookings = bookingsData.results || [];
        
        // Update filter values from URL
        document.getElementById('customerFilter').value = params.customer_name;
        document.getElementById('itemTypeFilter').value = params.item_type;
        document.getElementById('statusFilter').value = params.status;
        document.getElementById('keywordFilter').value = params.keyword;
        
        if (bookings.length === 0) {
          bookingsContainer.innerHTML = renderEmptyState({ message: 'No bookings found.' });
        } else {
          bookingsContainer.innerHTML = `
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Item</th>
                    <th>Customer</th>
                    <th>Participants</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Booked</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${bookings.map(booking => {
                    const statusClass = booking.status === 'confirmed' ? 'success' : 
                                      booking.status === 'cancelled' ? 'danger' : 'secondary';
                    
                    // Format participants
                    let participantsText = 'N/A';
                    if (booking.participants) {
                      if (booking.type === 'activity') {
                        participantsText = `${booking.participants} participant${booking.participants !== 1 ? 's' : ''}`;
                      } else if (booking.type === 'hotel') {
                        participantsText = `${booking.participants} guest${booking.participants !== 1 ? 's' : ''}`;
                      } else {
                        participantsText = `${booking.participants} passenger${booking.participants !== 1 ? 's' : ''}`;
                      }
                    }
                    
                    // Format customer name
                    const customerName = booking.customer_name || `User #${booking.user_id}`;
                    
                    // Status-based action buttons
                    let actionButtons = '';
                    if (booking.status === 'confirmed') {
                      actionButtons = `
                        <button class="btn btn-sm btn-success" onclick="showStatusConfirmModal(${booking.id}, 'completed')">Complete</button>
                        <button class="btn btn-sm btn-danger" onclick="showStatusConfirmModal(${booking.id}, 'cancelled')">Cancel</button>
                      `;
                    } else if (booking.status === 'cancelled') {
                      actionButtons = `
                        <button class="btn btn-sm btn-primary" onclick="showStatusConfirmModal(${booking.id}, 'confirmed')">Confirm</button>
                      `;
                    } else if (booking.status === 'completed') {
                      actionButtons = `
                        <button class="btn btn-sm btn-secondary" disabled>Completed</button>
                      `;
                    }
                    
                    return `
                      <tr>
                        <td>#${booking.id}</td>
                        <td>${booking.type.charAt(0).toUpperCase() + booking.type.slice(1)}</td>
                        <td>${booking.item_name || 'N/A'}</td>
                        <td>${customerName}</td>
                        <td>${participantsText}</td>
                        <td>${formatPrice(booking.total_price)}</td>
                        <td><span class="badge bg-${statusClass}">${booking.status.charAt(0).toUpperCase() + booking.status.slice(1)}</span></td>
                        <td>${formatDate(booking.booked_at)}</td>
                        <td>
                          <div class="btn-group btn-group-sm">
                            ${actionButtons}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error loading bookings:', error);
        setStatus('status', 'error', error.message || 'Failed to load bookings');
        bookingsContainer.innerHTML = '';
      }
    }
    
    function showStatusConfirmModal(bookingId, newStatus) {
      const statusLabels = {
        'confirmed': { verb: 'confirm', title: 'Confirm Booking' },
        'completed': { verb: 'complete', title: 'Complete Booking' },
        'cancelled': { verb: 'cancel', title: 'Cancel Booking' }
      };
      const label = statusLabels[newStatus] || { verb: newStatus, title: 'Update Booking Status' };
      
      const modalHtml = `
        <div class="modal fade" id="statusConfirmModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">${label.title}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <p>Are you sure you want to ${label.verb} this booking?</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmStatusBtn">Confirm</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      // Remove existing modal if any
      const existingModal = document.getElementById('statusConfirmModal');
      if (existingModal) {
        existingModal.remove();
      }
      
      // Add modal to body
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      const modalElement = document.getElementById('statusConfirmModal');
      const modal = new bootstrap.Modal(modalElement);
      
      // Handle confirm button
      document.getElementById('confirmStatusBtn').addEventListener('click', async () => {
        modal.hide();
        await updateBookingStatus(bookingId, newStatus);
      });
      
      // Clean up on close
      modalElement.addEventListener('hidden.bs.modal', () => {
        modalElement.remove();
      });
      
      modal.show();
    }
    
    async function updateBookingStatus(bookingId, newStatus) {
      try {
        await apiCall(`/bookings/${bookingId}`, {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus })
        });
        showSuccessToast(`Booking status updated to ${newStatus}`);
        loadBookings();
      } catch (error) {
        console.error('Error updating booking status:', error);
        setStatus('status', 'error', error.message || 'Failed to update booking status');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Ensure filter is set up correctly
      setupItemTypeFilter();
      
      loadDashboard();
      
      // Load filter values from URL on page load
      const params = getUrlParams();
      if (params.customer_name) document.getElementById('customerFilter').value = params.customer_name;
      // Only set item_type filter for agencies (owners don't have this filter)
      if (params.item_type && user && user.role === 'agency') {
        const itemTypeFilter = document.getElementById('itemTypeFilter');
        if (itemTypeFilter && itemTypeFilter.querySelector(`option[value="${params.item_type}"]`)) {
          itemTypeFilter.value = params.item_type;
        }
      }
      if (params.status) document.getElementById('statusFilter').value = params.status;
      if (params.keyword) document.getElementById('keywordFilter').value = params.keyword;
    });
  </script>
</body>
</html>
