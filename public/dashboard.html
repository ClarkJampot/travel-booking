<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html">← Home</a>
    <nav>
      <a href="hotels.html">Hotels</a>
      <a href="flights.html">Flights</a>
      <a href="activities.html">Activities</a>
      <a href="transfers.html">Transfers</a>
      <a href="bookings.html">My Bookings</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="dashboard.html" id="dashboardLink" style="display:none;">Dashboard</a>
      <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
      <a href="#" onclick="logout()" id="logoutLink" style="display:none;">Logout</a>
    </nav>
  </header>
  <main>
    <h1>Dashboard</h1>
    <div id="authStatus" class="muted"></div>
    
    <!-- Customer Dashboard -->
    <div id="customerDashboard" style="display:none;">
      <section class="card">
        <h3>My Bookings</h3>
        <div id="customerBookings" class="grid"></div>
        <div id="customerBookingsStatus" class="muted"></div>
      </section>
    </div>

    <!-- Agency Dashboard -->
    <div id="agencyDashboard" style="display:none;">
      <div class="row" style="margin-bottom:20px;">
        <button onclick="showAgencySection('flights')" class="tab-button active" id="flightsTab">Flights</button>
        <button onclick="showAgencySection('activities')" class="tab-button" id="activitiesTab">Activities</button>
        <button onclick="showAgencySection('transfers')" class="tab-button" id="transfersTab">Transfers</button>
      </div>
      
      <div id="agencyFlights" class="tab-content">
        <section class="card">
          <h3>My Flights</h3>
          <div id="agencyFlightsList" class="grid"></div>
          <div id="agencyFlightsStatus" class="muted"></div>
        </section>
      </div>
      
      <div id="agencyActivities" class="tab-content" style="display:none;">
        <section class="card">
          <h3>My Activities</h3>
          <div id="agencyActivitiesList" class="grid"></div>
          <div id="agencyActivitiesStatus" class="muted"></div>
        </section>
      </div>
      
      <div id="agencyTransfers" class="tab-content" style="display:none;">
        <section class="card">
          <h3>My Transfers</h3>
          <div id="agencyTransfersList" class="grid"></div>
          <div id="agencyTransfersStatus" class="muted"></div>
        </section>
      </div>
    </div>

    <!-- Owner Dashboard -->
    <div id="ownerDashboard" style="display:none;">
      <section class="card">
        <h3>My Hotels</h3>
        <div id="ownerHotelsList" class="grid"></div>
        <div id="ownerHotelsStatus" class="muted"></div>
      </section>
    </div>
  </main>
  
  <style>
    .tab-button {
      padding: 8px 16px;
      margin-right: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-button.active {
      background: var(--primary);
      color: white;
    }
    .tab-content {
      margin-top: 20px;
    }
  </style>
  
  <script>
    let currentUser = null;
    let currentAgencySection = 'flights';

    async function checkAuth() {
      try {
        const res = await fetch('api/auth/me');
        const data = await res.json();
        if (data.user) {
          currentUser = data.user;
          updateNavigation();
          loadDashboard();
        } else {
          redirectToLogin();
        }
      } catch (e) {
        redirectToLogin();
      }
    }

    function updateNavigation() {
      const loginLink = document.getElementById('loginLink');
      const dashboardLink = document.getElementById('dashboardLink');
      const profileLink = document.getElementById('profileLink');
      const logoutLink = document.getElementById('logoutLink');
      
      if (currentUser) {
        loginLink.style.display = 'none';
        dashboardLink.style.display = 'inline';
        profileLink.style.display = 'inline';
        logoutLink.style.display = 'inline';
      } else {
        loginLink.style.display = 'inline';
        dashboardLink.style.display = 'none';
        profileLink.style.display = 'none';
        logoutLink.style.display = 'none';
      }
    }

    function redirectToLogin() {
      window.location.href = 'login.html';
    }

    async function logout() {
      try {
        await fetch('api/auth/logout', { method: 'POST' });
        window.location.href = 'login.html';
      } catch (e) {
        console.error('Logout failed:', e);
      }
    }

    function loadDashboard() {
      const authStatus = document.getElementById('authStatus');
      authStatus.textContent = `Welcome, ${currentUser.name}!`;
      
      // Show appropriate dashboard based on role
      const customerDashboard = document.getElementById('customerDashboard');
      const agencyDashboard = document.getElementById('agencyDashboard');
      const ownerDashboard = document.getElementById('ownerDashboard');
      
      customerDashboard.style.display = 'none';
      agencyDashboard.style.display = 'none';
      ownerDashboard.style.display = 'none';
      
      switch (currentUser.role) {
        case 'customer':
          customerDashboard.style.display = 'block';
          loadCustomerBookings();
          break;
        case 'agency':
          agencyDashboard.style.display = 'block';
          loadAgencyFlights();
          break;
        case 'owner':
          ownerDashboard.style.display = 'block';
          loadOwnerHotels();
          break;
        default:
          authStatus.textContent = 'Unknown role: ' + currentUser.role;
      }
    }

    async function loadCustomerBookings() {
      const list = document.getElementById('customerBookings');
      const status = document.getElementById('customerBookingsStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading bookings...';
      
      try {
        const res = await fetch('api/bookings');
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to load bookings');
        
        status.textContent = '';
        
        (data.results || []).forEach(b => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `
            <div class="row" style="justify-content:space-between">
              <strong>Booking #${b.id}</strong>
              <span class="badge">${b.item_type}</span>
            </div>
            <div><strong>${b.item_name || 'Unknown Item'}</strong></div>
            <div class="muted">${b.item_description || ''}</div>
            <div style="margin-top:8px;">
              <div>₱${Number(b.total_price).toFixed(2)}</div>
              <div class="muted">Booked: ${new Date(b.booked_at).toLocaleDateString()}</div>
            </div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No bookings yet. Start exploring our hotels, flights, and activities!';
        }
      } catch (e) {
        status.textContent = 'Failed to load bookings: ' + e.message;
        console.error(e);
      }
    }

    async function loadAgencyFlights() {
      const list = document.getElementById('agencyFlightsList');
      const status = document.getElementById('agencyFlightsStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading flights...';
      
      try {
        const res = await fetch(`api/flights?createdBy=${currentUser.id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to load flights');
        
        status.textContent = '';
        
        (data.results || []).forEach(f => {
          const div = document.createElement('div');
          div.className = 'card';
          const imgSrc = f.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI0Y1RjVGMEYiLz4KICA8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOEIwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj4KICAgIE5vIEltYWdlIEF2YWlsYWJsZQogIDwvdGV4dD4KPC9zdmc+';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${f.airline}" class="card-image">
            <strong>${f.airline}</strong>
            <div class="muted">${f.origin} → ${f.destination}</div>
            <div>${f.depart_date} · ₱${Number(f.price).toFixed(2)}</div>
            <div class="muted">Bookings: ${f.booking_count || 0}</div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No flights created yet.';
        }
      } catch (e) {
        status.textContent = 'Failed to load flights: ' + e.message;
        console.error(e);
      }
    }

    async function loadAgencyActivities() {
      const list = document.getElementById('agencyActivitiesList');
      const status = document.getElementById('agencyActivitiesStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading activities...';
      
      try {
        const res = await fetch(`api/activities?createdBy=${currentUser.id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to load activities');
        
        status.textContent = '';
        
        (data.results || []).forEach(a => {
          const div = document.createElement('div');
          div.className = 'card';
          const imgSrc = a.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI0Y1RjVGMEYiLz4KICA8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOEIwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj4KICAgIE5vIEltYWdlIEF2YWlsYWJsZQogIDwvdGV4dD4KPC9zdmc+';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${a.title}" class="card-image">
            <strong>${a.title}</strong>
            <div class="muted">${a.city}</div>
            <div>${a.date} · ₱${Number(a.price).toFixed(2)}</div>
            <div class="muted">Bookings: ${a.booking_count || 0}</div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No activities created yet.';
        }
      } catch (e) {
        status.textContent = 'Failed to load activities: ' + e.message;
        console.error(e);
      }
    }

    async function loadAgencyTransfers() {
      const list = document.getElementById('agencyTransfersList');
      const status = document.getElementById('agencyTransfersStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading transfers...';
      
      try {
        const res = await fetch(`api/transfers?createdBy=${currentUser.id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to load transfers');
        
        status.textContent = '';
        
        (data.results || []).forEach(t => {
          const div = document.createElement('div');
          div.className = 'card';
          const imgSrc = t.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI0Y1RjVGMEYiLz4KICA8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOEIwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj4KICAgIE5vIEltYWdlIEF2YWlsYWJsZQogIDwvdGV4dD4KPC9zdmc+';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${t.service}" class="card-image">
            <strong>${t.service}</strong>
            <div class="muted">${t.origin} → ${t.destination}</div>
            <div>${t.date} · ₱${Number(t.price).toFixed(2)}</div>
            <div class="muted">Bookings: ${t.booking_count || 0}</div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No transfers created yet.';
        }
      } catch (e) {
        status.textContent = 'Failed to load transfers: ' + e.message;
        console.error(e);
      }
    }

    async function loadOwnerHotels() {
      const list = document.getElementById('ownerHotelsList');
      const status = document.getElementById('ownerHotelsStatus');
      
      list.innerHTML = '';
      status.textContent = 'Loading hotels...';
      
      try {
        const res = await fetch(`api/hotels?createdBy=${currentUser.id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to load hotels');
        
        status.textContent = '';
        
        (data.results || []).forEach(h => {
          const div = document.createElement('div');
          div.className = 'card';
          const imgSrc = h.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iI0Y1RjVGMEYiLz4KICA8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjOEIwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj4KICAgIE5vIEltYWdlIEF2YWlsYWJsZQogIDwvdGV4dD4KPC9zdmc+';
          div.innerHTML = `
            <img src="${imgSrc}" alt="${h.name}" class="card-image">
            <div class="row" style="justify-content:space-between">
              <strong>${h.name}</strong>
              <span class="badge">${Number(h.rating).toFixed(1)} ★</span>
            </div>
            <div class="muted">${h.city}, ${h.country}</div>
            <div>₱${Number(h.price_per_night).toFixed(2)} / night</div>
            <div class="muted">Bookings: ${h.booking_count || 0}</div>
          `;
          list.appendChild(div);
        });
        
        if (!list.children.length) {
          status.textContent = 'No hotels created yet.';
        }
      } catch (e) {
        status.textContent = 'Failed to load hotels: ' + e.message;
        console.error(e);
      }
    }

    function showAgencySection(section) {
      // Update tab buttons
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(section + 'Tab').classList.add('active');
      
      // Update tab content
      document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
      document.getElementById('agency' + section.charAt(0).toUpperCase() + section.slice(1)).style.display = 'block';
      
      currentAgencySection = section;
      
      // Load appropriate data
      switch (section) {
        case 'flights':
          loadAgencyFlights();
          break;
        case 'activities':
          loadAgencyActivities();
          break;
        case 'transfers':
          loadAgencyTransfers();
          break;
      }
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
