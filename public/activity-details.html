<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="activityDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="activityTitle" class="fade-in-up"></h3>
            <p class="text-muted" id="activityLocation"></p>
            <p class="text-muted" id="activityDate"></p>
            <p class="price" id="activityPrice"></p>
            <p id="activityDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card reveal">
          <div class="card-body">
            <h5 class="mb-4">Select Date</h5>
            <div id="calendarContainer"></div>
            <div class="mt-4">
              <div class="mb-3">
                <label class="form-label">Number of Participants</label>
                <input type="number" class="form-control" id="participants" value="1" min="1">
              </div>
            </div>
            <p class="price" id="totalPrice" style="display: none;"></p>
            <div id="status" class="mt-3"></div>
            <button type="button" class="btn btn-primary btn-cta w-100 mt-3" id="bookBtn" style="display: none;">Book Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/components/Calendar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    loadLayout();
    const urlParams = new URLSearchParams(window.location.search);
    const activityId = urlParams.get('id');
    let activity = null;
    let calendar = null;
    let selectedDate = null;
    
    async function loadActivity() {
      try {
        const data = await apiCall(`/activities?id=${activityId}`);
        activity = data.activity;
        document.getElementById('activityTitle').textContent = activity.title || 'Activity';
        // Use city_name and province_name if available
        const location = activity.city_name && activity.province_name 
          ? `${activity.city_name}, ${activity.province_name}`
          : (activity.city_name ? activity.city_name : '');
        document.getElementById('activityLocation').textContent = location;
        
        if (activity.date) {
          document.getElementById('activityDate').textContent = `Date: ${formatDate(activity.date)}`;
        }
        
        // Display price with discount if applicable
        const discountedPrice = activity.discount_percent > 0 
          ? activity.price * (1 - activity.discount_percent / 100)
          : activity.price;
        
        let priceHTML = '';
        if (activity.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(activity.price)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = `${formatPrice(activity.price)}`;
        }
        document.getElementById('activityPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(activity.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${activity.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(activity.discount_percent)}% OFF</span>` : ''}
        `;
        if (activity.ad || activity.discount_percent > 0) {
          document.getElementById('activityPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('activityDescription').textContent = activity.description || '';
        
        // Combine primary image with additional images for carousel
        const allImages = combineImages(activity.image_url, activity.images || []);
        document.getElementById('activityDetails').innerHTML = createImageCarousel(allImages, 'activityCarousel', activity.title || 'Activity');
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('activityCarousel');
          if (carouselEl && allImages.length > 1) {
            // Initialize Bootstrap carousel
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            
            // Sync thumbnails when carousel slides
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('activityCarousel', event.to);
            });
          }
          
          // Add hover effects for expand hint
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
        
        // Initialize calendar - activities are available on their specific date or any future date
        const today = new Date();
        const availableDates = [];
        // Generate available dates for next 365 days
        for (let i = 0; i < 365; i++) {
          const date = new Date(today);
          date.setDate(date.getDate() + i);
          availableDates.push(date.toISOString().split('T')[0]);
        }
        
        calendar = new Calendar({
          container: '#calendarContainer',
          availableDates: availableDates,
          rangeMode: false,
          onDateSelect: (date) => {
            selectedDate = date;
            updateTotalPrice();
          }
        });
        
        // Update total when participants change
        document.getElementById('participants').addEventListener('change', function() {
          updateTotalPrice();
        });
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load activity');
      }
    }
    
    function updateTotalPrice() {
      if (!selectedDate) {
        document.getElementById('totalPrice').style.display = 'none';
        document.getElementById('bookBtn').style.display = 'none';
        return;
      }
      
      const participants = parseInt(document.getElementById('participants').value) || 1;
      const pricePerPerson = activity.discount_percent > 0 
        ? activity.price * (1 - activity.discount_percent / 100)
        : activity.price;
      const total = pricePerPerson * participants;
      
      document.getElementById('totalPrice').textContent = `Total: ${formatPrice(total)}`;
      document.getElementById('totalPrice').style.display = 'block';
      document.getElementById('bookBtn').style.display = 'block';
    }
    
    document.getElementById('bookBtn').addEventListener('click', async function() {
      if (!isAuthenticated()) {
        alert('Please log in to make a booking.');
        window.location.href = 'login.html';
        return;
      }
      
      if (!selectedDate) {
        setStatus('status', 'error', 'Please select a date');
        return;
      }
      
      const selectedDateObj = new Date(selectedDate);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      if (selectedDateObj < today) {
        setStatus('status', 'error', 'Date cannot be in the past');
        return;
      }
      
      const participants = parseInt(document.getElementById('participants').value) || 1;
      const pricePerPerson = activity.discount_percent > 0 
        ? activity.price * (1 - activity.discount_percent / 100)
        : activity.price;
      const totalPrice = pricePerPerson * participants;
      
      clearStatus('status');
      
      const bookBtn = document.getElementById('bookBtn');
      bookBtn.disabled = true;
      bookBtn.textContent = 'Booking...';
      
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'activity',
            item_id: activity.id,
            date: selectedDate,
            participant_count: participants,
            total_price: totalPrice
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to create booking');
        bookBtn.disabled = false;
        bookBtn.textContent = 'Book Now';
      }
    });
    
    if (activityId) loadActivity();
    else setStatus('status', 'error', 'Activity ID not provided');
  </script>
</body>
</html>
