<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="activityDetails" class="reveal"></div>
    <div class="row mt-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="activityTitle" class="fade-in-up"></h3>
            <p class="text-muted" id="activityCity"></p>
            <p class="text-muted" id="activityDate"></p>
            <p class="price" id="activityPrice"></p>
            <p id="activityDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card sticky-booking-form reveal">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const activityId = urlParams.get('id');
    let activity = null;
    async function loadActivity() {
      try {
        const data = await apiCall(`/activities?id=${activityId}`);
        activity = data.activity;
        document.getElementById('activityTitle').textContent = activity.title;
        document.getElementById('activityCity').textContent = activity.city;
        document.getElementById('activityDate').textContent = formatDate(activity.date);
        document.getElementById('activityPrice').textContent = formatPrice(activity.price);
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(activity.price)}`;
        document.getElementById('activityDescription').textContent = activity.description || '';
        document.getElementById('activityDetails').innerHTML = `
          <div class="card-img-wrapper" style="height: 400px; border-radius: 12px; overflow: hidden;">
            <img src="${activity.image_url || 'uploads/placeholder.svg'}" class="img-fluid w-100 h-100" style="object-fit: cover;" alt="${activity.title}" loading="lazy">
          </div>
        `;
      } catch (error) {
        showError('status', error.message || 'Failed to load activity');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'activity',
            item_id: activity.id,
            total_price: activity.price
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (activityId) loadActivity();
    else showError('status', 'Activity ID not provided');
  </script>
</body>
</html>
