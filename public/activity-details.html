<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="activityDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="activityTitle" class="fade-in-up"></h3>
            <p class="text-muted" id="activityCity"></p>
            <p class="text-muted" id="activityDate"></p>
            <p class="price" id="activityPrice"></p>
            <p id="activityDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card sticky-booking-form reveal">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const activityId = urlParams.get('id');
    let activity = null;
    async function loadActivity() {
      try {
        const data = await apiCall(`/activities?id=${activityId}`);
        activity = data.activity;
        document.getElementById('activityTitle').textContent = activity.title;
        // Use city_name and province_name if available, fallback to city
        const location = activity.city_name && activity.province_name 
          ? `${activity.city_name}, ${activity.province_name}`
          : (activity.city || '');
        document.getElementById('activityCity').textContent = location;
        document.getElementById('activityDate').textContent = formatDate(activity.date);
        // Display price with discount if applicable
        const discountedPrice = activity.discount_percent > 0 
          ? activity.price * (1 - activity.discount_percent / 100)
          : activity.price;
        
        let priceHTML = '';
        if (activity.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(activity.price)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
            </div>
          `;
        } else {
          priceHTML = formatPrice(activity.price);
        }
        document.getElementById('activityPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(activity.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${activity.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(activity.discount_percent)}% OFF</span>` : ''}
        `;
        if (activity.ad || activity.discount_percent > 0) {
          document.getElementById('activityPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('totalPrice').textContent = `Total: ${formatPrice(discountedPrice)}`;
        document.getElementById('activityDescription').textContent = activity.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(activity.image_url, activity.images || []);
        document.getElementById('activityDetails').innerHTML = createImageCarousel(allImages, 'activityCarousel', activity.title);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('activityCarousel');
          if (carouselEl && allImages.length > 1) {
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('activityCarousel', event.to);
            });
          }
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
      } catch (error) {
        showError('status', error.message || 'Failed to load activity');
      }
    }
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'activity',
            item_id: activity.id,
            total_price: activity.discount_percent > 0 ? activity.price * (1 - activity.discount_percent / 100) : activity.price
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (activityId) loadActivity();
    else showError('status', 'Activity ID not provided');
  </script>
</body>
</html>
