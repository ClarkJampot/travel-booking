<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="hotelDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="hotelName" class="fade-in-up"></h3>
            <p class="text-muted" id="hotelLocation"></p>
            <p class="price" id="hotelPrice"></p>
            <p id="hotelDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card reveal">
          <div class="card-body">
            <h5 class="mb-4">Select Dates</h5>
            <div id="calendarContainer"></div>
            <div class="mt-4">
              <div class="mb-3">
                <label class="form-label">Number of Guests</label>
                <input type="number" class="form-control" id="guests" value="1" min="1" max="10">
              </div>
            </div>
            <p class="price" id="totalPrice" style="display: none;"></p>
            <div id="status" class="mt-3"></div>
            <button type="button" class="btn btn-primary btn-cta w-100 mt-3" id="bookBtn" style="display: none;">Book Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load utilities and components first -->
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/Image.js"></script>
  <script src="js/components/Price.js"></script>
  <script src="js/components/Badge.js"></script>
  <script src="js/components/EmptyState.js"></script>
  <script src="js/components/Card.js"></script>
  <script src="js/components/Calendar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    loadLayout();
    const urlParams = new URLSearchParams(window.location.search);
    const hotelId = urlParams.get('id');
    let hotel = null;
    let calendar = null;
    let checkInDate = null;
    let checkOutDate = null;
    
    async function loadHotel() {
      try {
        const data = await apiCall(`/hotels?id=${hotelId}`);
        hotel = data.hotel;
        document.getElementById('hotelName').textContent = hotel.name;
        // Use city_name and province_name if available
        const location = hotel.city_name && hotel.province_name 
          ? `${hotel.city_name}, ${hotel.province_name}`
          : (hotel.city_name ? hotel.city_name : '');
        document.getElementById('hotelLocation').textContent = location;
        
        // Display price with discount if applicable
        const discountedPrice = hotel.discount_percent > 0 
          ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
          : hotel.price_per_night;
        
        let priceHTML = '';
        if (hotel.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(hotel.price_per_night)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
              <span class="price-small"> /night</span>
            </div>
          `;
        } else {
          priceHTML = `${formatPrice(hotel.price_per_night)}<span class="price-small"> /night</span>`;
        }
        document.getElementById('hotelPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${isPromoted(hotel.ad) ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${hotel.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${formatPercent(hotel.discount_percent)}% OFF</span>` : ''}
        `;
        if (hotel.ad || hotel.discount_percent > 0) {
          document.getElementById('hotelPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('hotelDescription').textContent = hotel.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(hotel.image_url, hotel.images || []);
        document.getElementById('hotelDetails').innerHTML = createImageCarousel(allImages, 'hotelCarousel', hotel.name);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('hotelCarousel');
          if (carouselEl && allImages.length > 1) {
            // Initialize Bootstrap carousel
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            
            // Sync thumbnails when carousel slides
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('hotelCarousel', event.to);
            });
          }
          
          // Add hover effects for expand hint
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
        
        // Initialize calendar with range mode for check-in/check-out
        // Hotels are always available, so we'll allow any future dates
        const today = new Date();
        const availableDates = [];
        // Generate available dates for next 365 days
        for (let i = 0; i < 365; i++) {
          const date = new Date(today);
          date.setDate(date.getDate() + i);
          availableDates.push(date.toISOString().split('T')[0]);
        }
        
        calendar = new Calendar({
          container: '#calendarContainer',
          availableDates: availableDates,
          returnAvailableDates: availableDates, // Hotels: all dates available for check-out too
          rangeMode: true,
          onDateSelect: (date) => {
            checkInDate = date;
            checkOutDate = null;
            updateTotalPrice();
          },
          onRangeSelect: (departure, returnDate) => {
            checkInDate = departure;
            checkOutDate = returnDate;
            updateTotalPrice();
          }
        });
        
        // Update total when guests change
        document.getElementById('guests').addEventListener('change', function() {
          updateTotalPrice();
        });
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to load hotel');
      }
    }
    
    function updateTotalPrice() {
      if (!checkInDate || !checkOutDate) {
        document.getElementById('totalPrice').style.display = 'none';
        document.getElementById('bookBtn').style.display = 'none';
        return;
      }
      
      const checkIn = new Date(checkInDate);
      const checkOut = new Date(checkOutDate);
      
      if (checkOut <= checkIn) {
        document.getElementById('totalPrice').style.display = 'none';
        document.getElementById('bookBtn').style.display = 'none';
        return;
      }
      
      const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
      const guests = parseInt(document.getElementById('guests').value) || 1;
      const pricePerNight = hotel.discount_percent > 0 
        ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
        : hotel.price_per_night;
      const total = pricePerNight * nights * guests;
      
      document.getElementById('totalPrice').textContent = `Total: ${formatPrice(total)} (${nights} night${nights !== 1 ? 's' : ''}, ${guests} guest${guests !== 1 ? 's' : ''})`;
      document.getElementById('totalPrice').style.display = 'block';
      document.getElementById('bookBtn').style.display = 'block';
    }
    
    document.getElementById('bookBtn').addEventListener('click', async function() {
      if (!isAuthenticated()) {
        alert('Please log in to make a booking.');
        window.location.href = 'login.html';
        return;
      }
      
      if (!checkInDate || !checkOutDate) {
        setStatus('status', 'error', 'Please select check-in and check-out dates');
        return;
      }
      
      const checkIn = new Date(checkInDate);
      const checkOut = new Date(checkOutDate);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      if (checkIn < today) {
        setStatus('status', 'error', 'Check-in date cannot be in the past');
        return;
      }
      
      if (checkOut <= checkIn) {
        setStatus('status', 'error', 'Check-out date must be after check-in date');
        return;
      }
      
      const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
      const guests = parseInt(document.getElementById('guests').value) || 1;
      const pricePerNight = hotel.discount_percent > 0 
        ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
        : hotel.price_per_night;
      const totalPrice = pricePerNight * nights * guests;
      
      clearStatus('status');
      
      const bookBtn = document.getElementById('bookBtn');
      bookBtn.disabled = true;
      bookBtn.textContent = 'Booking...';
      
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'hotel',
            item_id: hotel.id,
            check_in: checkInDate,
            check_out: checkOutDate,
            guests: guests,
            total_price: totalPrice
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        setStatus('status', 'error', error.message || 'Failed to create booking');
        bookBtn.disabled = false;
        bookBtn.textContent = 'Book Now';
      }
    });
    
    if (hotelId) loadHotel();
    else setStatus('status', 'error', 'Hotel ID not provided');
  </script>
</body>
</html>
