<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="hotelDetails" class="reveal"></div>
    <div class="row mt-4 mb-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="hotelName" class="fade-in-up"></h3>
            <p class="text-muted" id="hotelLocation"></p>
            <p class="price" id="hotelPrice"></p>
            <p id="hotelDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card sticky-booking-form reveal">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label">Check-in Date</label>
                <input type="date" class="form-control" id="checkIn" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Check-out Date</label>
                <input type="date" class="form-control" id="checkOut" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Number of Nights</label>
                <input type="number" class="form-control" id="nights" value="1" min="1" required>
              </div>
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100" id="bookBtn">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carousel.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const hotelId = urlParams.get('id');
    let hotel = null;
    async function loadHotel() {
      try {
        const data = await apiCall(`/hotels?id=${hotelId}`);
        hotel = data.hotel;
        document.getElementById('hotelName').textContent = hotel.name;
        // Use city_name and province_name if available
        const location = hotel.city_name && hotel.province_name 
          ? `${hotel.city_name}, ${hotel.province_name}`
          : (hotel.city_name ? hotel.city_name : '');
        document.getElementById('hotelLocation').textContent = location;
        
        // Display price with discount if applicable
        const discountedPrice = hotel.discount_percent > 0 
          ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
          : hotel.price_per_night;
        
        let priceHTML = '';
        if (hotel.discount_percent > 0) {
          priceHTML = `
            <div class="price-container">
              <span class="original-price">${formatPrice(hotel.price_per_night)}</span>
              <span class="discounted-price">${formatPrice(discountedPrice)}</span>
              <span class="price-small"> /night</span>
            </div>
          `;
        } else {
          priceHTML = `${formatPrice(hotel.price_per_night)}<span class="price-small"> /night</span>`;
        }
        document.getElementById('hotelPrice').innerHTML = priceHTML;
        
        // Add discount and promoted badges if applicable
        const badgeHTML = `
          ${hotel.ad ? '<span class="promoted-badge mb-2 d-inline-block">Promoted</span>' : ''}
          ${hotel.discount_percent > 0 ? `<span class="discount-badge mb-2 d-inline-block" style="position: relative; top: 0; right: 0;">${hotel.discount_percent}% OFF</span>` : ''}
        `;
        if (hotel.ad || hotel.discount_percent > 0) {
          document.getElementById('hotelPrice').insertAdjacentHTML('beforebegin', badgeHTML);
        }
        
        document.getElementById('hotelDescription').textContent = hotel.description || '';
        // Combine primary image with additional images for carousel
        const allImages = combineImages(hotel.image_url, hotel.images || []);
        document.getElementById('hotelDetails').innerHTML = createImageCarousel(allImages, 'hotelCarousel', hotel.name);
        
        // Initialize carousel and add hover effects after DOM insertion
        setTimeout(() => {
          const carouselEl = document.getElementById('hotelCarousel');
          if (carouselEl && allImages.length > 1) {
            // Initialize Bootstrap carousel
            const bsCarousel = new bootstrap.Carousel(carouselEl, {
              interval: false,
              wrap: true
            });
            
            // Sync thumbnails when carousel slides
            carouselEl.addEventListener('slid.bs.carousel', function(event) {
              updateActiveThumbnail('hotelCarousel', event.to);
            });
          }
          
          // Add hover effects for expand hint
          carouselEl?.querySelectorAll('.card-img-wrapper').forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '1';
            });
            wrapper.addEventListener('mouseleave', function() {
              const hint = this.querySelector('.image-expand-hint');
              if (hint) hint.style.opacity = '0';
            });
          });
        }, 50);
        
        calculateTotal();
      } catch (error) {
        showError('status', error.message || 'Failed to load hotel');
      }
    }
    function calculateTotal() {
      const nights = parseInt(document.getElementById('nights').value) || 1;
      if (hotel) {
        const pricePerNight = hotel.discount_percent > 0 
          ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
          : hotel.price_per_night;
        const total = pricePerNight * nights;
        const priceEl = document.getElementById('totalPrice');
        priceEl.style.animation = 'pulse 0.3s ease';
        priceEl.textContent = `Total: ${formatPrice(total)}`;
        setTimeout(() => priceEl.style.animation = '', 300);
      }
    }
    document.getElementById('nights').addEventListener('change', calculateTotal);
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      const nights = parseInt(document.getElementById('nights').value) || 1;
      const pricePerNight = hotel.discount_percent > 0 
        ? hotel.price_per_night * (1 - hotel.discount_percent / 100)
        : hotel.price_per_night;
      const totalPrice = pricePerNight * nights;
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'hotel',
            item_id: hotel.id,
            total_price: totalPrice
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (hotelId) loadHotel();
    else showError('status', 'Hotel ID not provided');
  </script>
</body>
</html>
