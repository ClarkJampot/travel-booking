<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details - Travel Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <div class="container mt-4">
    <div id="hotelDetails" class="reveal"></div>
    <div class="row mt-4">
      <div class="col-md-8">
        <div class="card reveal">
          <div class="card-body">
            <h3 id="hotelName" class="fade-in-up"></h3>
            <p class="text-muted" id="hotelLocation"></p>
            <p class="price" id="hotelPrice"></p>
            <p class="rating" id="hotelRating"></p>
            <p id="hotelDescription"></p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card sticky-booking-form reveal">
          <div class="card-body">
            <h5>Book Now</h5>
            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label">Check-in Date</label>
                <input type="date" class="form-control" id="checkIn" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Check-out Date</label>
                <input type="date" class="form-control" id="checkOut" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Number of Nights</label>
                <input type="number" class="form-control" id="nights" value="1" min="1" required>
              </div>
              <p class="price" id="totalPrice"></p>
              <div id="status"></div>
              <button type="submit" class="btn btn-primary w-100" id="bookBtn">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    fetch('includes/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
    fetch('includes/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d).then(() => updateNavigation());
    const urlParams = new URLSearchParams(window.location.search);
    const hotelId = urlParams.get('id');
    let hotel = null;
    async function loadHotel() {
      try {
        const data = await apiCall(`/hotels?id=${hotelId}`);
        hotel = data.hotel;
        document.getElementById('hotelName').textContent = hotel.name;
        document.getElementById('hotelLocation').textContent = `${hotel.city}, ${hotel.country}`;
        document.getElementById('hotelPrice').innerHTML = `${formatPrice(hotel.price_per_night)}<span class="price-small">/night</span>`;
        document.getElementById('hotelRating').textContent = `★ ${hotel.rating || 0}`;
        document.getElementById('hotelDescription').textContent = hotel.description || '';
        document.getElementById('hotelDetails').innerHTML = `
          <div class="card-img-wrapper" style="height: 400px; border-radius: 12px; overflow: hidden;">
            <img src="${hotel.image_url || 'uploads/placeholder.svg'}" class="img-fluid w-100 h-100" style="object-fit: cover;" alt="${hotel.name}" loading="lazy">
          </div>
        `;
        calculateTotal();
      } catch (error) {
        showError('status', error.message || 'Failed to load hotel');
      }
    }
    function calculateTotal() {
      const nights = parseInt(document.getElementById('nights').value) || 1;
      if (hotel) {
        const total = hotel.price_per_night * nights;
        const priceEl = document.getElementById('totalPrice');
        priceEl.style.animation = 'pulse 0.3s ease';
        priceEl.textContent = `Total: ${formatPrice(total)}`;
        setTimeout(() => priceEl.style.animation = '', 300);
      }
    }
    document.getElementById('nights').addEventListener('change', calculateTotal);
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      clearStatus('status');
      const nights = parseInt(document.getElementById('nights').value) || 1;
      const totalPrice = hotel.price_per_night * nights;
      try {
        await apiCall('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            item_type: 'hotel',
            item_id: hotel.id,
            total_price: totalPrice
          })
        });
        showSuccessToast('Booking created successfully!');
        setTimeout(() => window.location.href = 'bookings.html', 2000);
      } catch (error) {
        showError('status', error.message || 'Failed to create booking');
      }
    });
    if (hotelId) loadHotel();
    else showError('status', 'Hotel ID not provided');
  </script>
</body>
</html>
